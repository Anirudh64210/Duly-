name: gates
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # A pull request is compared with the branch it targets. A push is compared with main.
  BASE: ${{ github.base_ref || 'main' }}
  DULY_NO_NOTIFY: "1"

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make the base branch available
        run: |
          git fetch origin main:main || true
          git fetch origin "$BASE:$BASE" || true
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: uv sync --frozen
      - run: npm ci --ignore-scripts
      - name: Install the sandbox the factory's tests need
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          git config --global user.name ci
          git config --global user.email ci@duly.invalid
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Gate 1, format lint and copy
        run: make gate-1
      - name: Gate 2, types
        run: make gate-2
      - name: Gate 3, diff policy
        run: make gate-3 BASE="$BASE"
      - name: Gate 4, security
        run: make gate-4
      - name: Gate 5, unit and property tests
        run: make gate-5
      - name: Gate 7, the factory's own files, sourced numbers and quotes
        run: make gate-7
      - name: Gate 6, diff coverage
        run: make gate-6 BASE="$BASE"
