[project]
name = "duly"
version = "0.0.0"
description = "Duly: immigration record keeping. Code computes, sources are cited, nothing is advice."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "langgraph>=0.2",
]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.112",
  "diff-cover>=9.2",
  "httpx>=0.27",
  "types-PyYAML",
  "types-jsonschema",
  "pip-audit>=2.7",
  "pip-licenses>=5.5.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["workbook-handoff", "duly-plan", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "DTZ", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tools/gates/*" = ["S603", "S607"]
"tools/factory/*" = ["S603", "S607"]
"dashboard/*" = ["S603", "S607", "DTZ", "RUF012"]
"tools/diff_policy/*" = ["S603", "S607"]
"tools/copy_lint/*" = ["S603", "S607"]
"tools/sources/*" = ["S603", "S607"]
".claude/hooks/*" = ["S603", "S607", "E402", "I001"]
"tests/*" = ["S", "DTZ"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["engine", "api", "assistant", "pipeline", "tools"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["langgraph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["engine", "api", "assistant", "pipeline", "tools"]
branch = true
# The gate scripts are proven by make prove-gates, which runs them against planted violations.
omit = ["tools/gates/*", "tools/factory/phase.py", "tools/factory/control.py", "tools/factory/golden.py", "tools/factory/drift.py", "tools/factory/weekly.py", "tools/factory/alerts.py"]
