branch: factory-e2e
spec: specs/factory/e2e-SPEC.md
merge: pr
rounds:
  - name: tests
    checkpoint: false   # tests written before the code cannot pass clean CI on their own
    lanes:
      - lane: L-tests
        agent: test-author
        mission: >
          Write tests/unit/engine/test_is_weekend.py as the SPEC describes, under "The tests".
        done: >-
          bash -c 'test -f tests/unit/engine/test_is_weekend.py
          && uv run ruff check tests && uv run ruff format --check tests'
    checks: []
  - name: code
    lanes:
      - lane: L-engine
        agent: builder
        mission: >
          Add is_weekend to engine/dates.py as the SPEC describes, under "The code". The tests
          in tests/unit/engine/test_is_weekend.py are your target and you cannot edit them.
        done: >-
          bash -c 'uv run pytest tests/unit/engine -q && uv run mypy
          && uv run ruff check engine && uv run ruff format --check engine
          && uv run python -m tools.gates.engine_literals'
    checks:
      - { name: "offline gates", run: "make test-offline BASE=factory-e2e" }
      - { name: "hidden tests", run: "uv run pytest tests/holdout -q" }
