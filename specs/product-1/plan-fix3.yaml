branch: product-1
spec: specs/product-1/SPEC-resolutions.md
merge: pr
# Resolutions 39 to 41, from the third sweep. Build then reconcile, as the runbook says.
rounds:
  - name: content
    checkpoint: false
    lanes:
      - lane: L-content
        agent: rulepack-drafter
        mission: >
          The pack words that specs/product-1/SPEC-resolutions.md point 40 needs, in
          rulepacks/f1-us/v2026.09, each quote found in a saved snapshot. (1) The list of legal
          public holidays in force before 2021-06-17: a row of calendar.federal_holidays_law with
          effective_to 2021-06-16, holding the list without Juneteenth, grounded in the saved
          5 U.S.C. 6103 copy and its note that Pub. L. 117-17 inserted Juneteenth; derivation
          reading, with a note that says what was read. If the saved words cannot ground it,
          add nothing and say so in your report; the engine then leaves such dates null.
          (2) The cap-gap October 1 row: its quote must hold the words of 8 CFR
          214.2(f)(5)(vi)(A)(2) as amended by 73 FR 18944, "States that the employment start
          date for the F-1 student is October 1 of the following fiscal year", as a flag row
          capgap.october_start_condition closed on 2025-01-16, from the saved fr-e8-7427 copy.
          Record each change in the pack's CHANGELOG.md. Never invent a number or a quote.
        done: >-
          bash -c 'uv run python -m tools.sources.verify rulepacks
          && uv run python -c "from engine.rulepack import load_all; load_all()"'
  - name: tests
    checkpoint: false
    lanes:
      - lane: L-tests
        agent: test-author
        mission: >
          Write the tests for specs/product-1/SPEC-resolutions.md points 39 and 40, first, in
          tests/unit/engine/test_f1_fix3.py, and hidden twins in tests/holdout/test_holdout_fix3.py.
          Point 39: the question on every case with an OPT card, cannot_tell until answered, no
          keeps the single-card check, yes gives talk_to_dso with opt.months_at_this_level.
          Point 40, with the cases the point names: a STEM card that began before 2016-05-10
          (limit, remaining and reports null, rule_not_in_force_on_event_day); a cap-gap petition
          filed before 2025-01-17 with an October 1 start (the October 1 row) and with another
          start (capgap.ends null, stepped back); report dates in 2019 and 2020 around June 19
          (never one day later than the list in force; if the pack holds no earlier list, null
          with the step back). Use tests/support/f1_pack.py so no placeholder answer reaches the
          engine. Name every new test. They are expected to fail until the build round.
        done: >-
          bash -c 'uv run ruff check tests && uv run ruff format --check tests
          && uv run pytest tests/unit tests/holdout -q --co -p no:cacheprovider >/dev/null
          && test -f tests/unit/engine/test_f1_fix3.py && test -f tests/holdout/test_holdout_fix3.py
          && grep -q "earlier_at_this_level" tests/unit/engine/test_f1_fix3.py'
  - name: build
    checkpoint: false
    lanes:
      - lane: L-engine
        agent: builder
        mission: >
          Build specs/product-1/SPEC-resolutions.md points 39 and 40 in engine/. Point 40 looks
          every rule up for the day of the event it governs and steps back where the pack holds
          no row in force then. No number is written in code. Older tests that collide are
          reconciled in the next round; list them in your report.
        done: >-
          bash -c 'uv run pytest tests/unit/engine/test_f1_fix3.py tests/unit/engine/test_f1_fix2.py
          tests/unit/engine/test_f1_windows.py tests/unit/engine/test_f1_periods_and_reports.py -q
          && uv run python -m tools.gates.engine_literals
          && uv run mypy && uv run ruff check engine && uv run ruff format --check engine'
  - name: reconcile
    checkpoint: false
    lanes:
      - lane: L-tests
        agent: test-author
        mission: >
          The engine now has specs/product-1/SPEC-resolutions.md points 39 and 40. Every case with
          an OPT card now raises opt.earlier_at_this_level: answer it no in the case with the
          helpers of tests/support/f1_pack.py where the test is about something else. Bring every
          test in tests/unit and tests/holdout in line; the builder's list of collisions is in its
          report on its branch. Write the point beside each change; never loosen an assertion a
          point supports; escalate any failure no settled point explains.
        done: >-
          bash -c 'uv run ruff check tests && uv run ruff format --check tests
          && uv run pytest tests/unit tests/holdout -q -p no:cacheprovider --ignore=tests/unit/tools'
    checks:
      - { name: "engine and api tests", run: "uv run pytest tests/unit/engine tests/unit/api -q" }
      - { name: "hidden tests", run: "uv run pytest tests/holdout -q" }
  - name: screen
    lanes:
      - lane: L-web
        agent: builder
        mission: >
          Build specs/product-1/SPEC-resolutions.md point 41 in web/: the cap-gap change of status
          and petition status start unchosen and the form refuses to compute until both are
          chosen, in plain words, as it does for the time zone. Give the question of point 39 and
          the judgement items opt.months_at_this_level and rule_not_in_force_on_event_day their
          words beside the others, saying what is asked or why Duly steps back, and nothing about
          what it means for the person. Tests beside the code.
        done: >-
          bash -c 'npm run typecheck -w web && npm test -w web
          && npx eslint web --max-warnings 0
          && npx prettier --check "web/**/*.{ts,tsx,css,html,json}"
          && uv run python -m tools.copy_lint.lint'
    checks:
      - { name: "offline gates", run: "make test-offline BASE=product-1" }
      - { name: "hidden tests", run: "uv run pytest tests/holdout -q" }
  - name: review
    lanes:
      - lane: L-review
        agent: reviewer
        mission: >
          Review what this plan changed (the merges since reviews/product-1-fix2.md) against
          specs/product-1/SPEC-resolutions.md points 39 to 41, PRINCIPLES.md, BOUNDARY.md and
          CLAUDE.md, following your role file. Send each case the points name through the api.
          Check that every test changed in the reconcile round names its point and loosens
          nothing, and that the form never sends a cap-gap fact the person did not choose. Write
          reviews/product-1-fix3.md and reviews/REVIEW.json.
        done: bash -c 'grep -Eq "^(APPROVE|VETO)$" reviews/product-1-fix3.md && test -f reviews/REVIEW.json'
  - name: audit
    lanes:
      - lane: L-audit
        agent: auditor
        mission: >
          Audit the rows of the register that product round 1 and its fixes cover, as your role
          file describes, against specs/product-1/SPEC.md and SPEC-resolutions.md. Update
          docs/requirements/audits/product-1.md.
        done: >-
          bash -c 'test -f docs/requirements/audits/product-1.md
          && uv run python -m tools.requirements.register check'
