branch: product-1
spec: specs/product-1/SPEC-resolutions.md
merge: pr
# Resolutions 27 to 35, from the second sweep. A behaviour change lands in two rounds: the
# build round is held to the new behaviour's tests, the reconcile round to the whole suite.
rounds:
  - name: content
    checkpoint: false
    lanes:
      - lane: L-content
        agent: rulepack-drafter
        mission: >
          The pack words that specs/product-1/SPEC-resolutions.md points 27 and 30 rest on, in
          rulepacks/f1-us/v2026.09, each quote found in a saved snapshot. (1) Point 30: quote the
          whole sentence of 8 CFR 214.2(f)(10)(ii)(A)(3) for opt.complete_within_months, with
          "except that a 24-month extension pursuant to paragraph (f)(10)(ii)(C) of this section
          does not need to be completed within such 14-month period"; value, status and
          derivation unchanged. (2) Point 27: a new guidance flag opt.post_completion_definition
          quoting SEVP's saved page: "Post-Completion OPT: Any portion of OPT used after the
          student's Program End Date." Record each change in the pack's CHANGELOG.md. Never
          invent a number or a quote.
        done: >-
          bash -c 'uv run python -m tools.sources.verify rulepacks
          && uv run python -c "from engine.rulepack import load_all; load_all()"
          && grep -q "opt.post_completion_definition" rulepacks/f1-us/v2026.09/parameters.yaml
          && grep -q "does not need to be completed within such 14-month period" rulepacks/f1-us/v2026.09/parameters.yaml'
  - name: tests
    checkpoint: false
    lanes:
      - lane: L-tests
        agent: test-author
        mission: >
          Write the tests for specs/product-1/SPEC-resolutions.md points 27, 28, 35, 36 and 37,
          first, before the code has them, and bring tests/unit/api/test_compute_context.py's
          too_many case to 257 answers (point 38; the contract now allows 256). Point 36's
          engine tests go in tests/unit/engine/test_f1_fix2.py with the case the point names;
          point 37: while opt.ead_end.after_complete_by is open, opt.apply_window_opens and
          opt.complete_by are null. Engine tests for points 27 and 28 go in
          tests/unit/engine/test_f1_fix2.py; hidden tests for them in
          tests/holdout/test_holdout_fix2.py; the api test for point 35 in
          tests/unit/api/test_status_rules.py. Point 27: the conflict with its about, its rule
          in rules, the items that use the card null, no OPT step done and no STEM step next
          while it is open, yes gives talk_to_dso, a card ending the day after the program end
          raises nothing. Point 28: use a copy of the pack in the test with the blocked regime
          made operative; a program that ended before the blocked rows took effect gets no date
          from them; the judgement item where no operative row is in force on the event day; the
          shipped pack changes nothing. Point 35: /v1/status names the packs' rules_checked_on
          and never gives rules_never_checked while a pack holds checked dates. Use
          tests/support/f1_pack.py so no placeholder answer reaches the engine. Name every new
          test in your report. The new tests are expected to fail until the build round.
        done: >-
          bash -c 'uv run ruff check tests && uv run ruff format --check tests
          && uv run pytest tests/unit tests/holdout -q --co -p no:cacheprovider >/dev/null
          && test -f tests/unit/engine/test_f1_fix2.py && test -f tests/holdout/test_holdout_fix2.py
          && test -f tests/unit/api/test_status_rules.py
          && grep -q "not_after_program_end" tests/unit/engine/test_f1_fix2.py'
  - name: build
    checkpoint: false
    lanes:
      - lane: L-engine
        agent: builder
        mission: >
          Build specs/product-1/SPEC-resolutions.md points 27, 28, 36 and 37 in engine/. Point 36
          adds stem.new_plan_due.<n> and stem.concluding_evaluation_due.<n> to the passed reports
          that are asked about. Point 37 keeps the nulling point 4 gives. Point 27 is a
          conflict that works as every conflict of SPEC section 1. Point 28 looks a rule up for
          the day of the event it measures from. No number is written in code. Older tests that
          collide are reconciled in the next round; list them in your report.
        done: >-
          bash -c 'uv run pytest tests/unit/engine/test_f1_fix2.py tests/unit/engine/test_f1_windows.py
          tests/unit/engine/test_f1_periods_and_reports.py -q
          && uv run python -m tools.gates.engine_literals
          && uv run mypy && uv run ruff check engine && uv run ruff format --check engine'
      - lane: L-api
        agent: builder
        mission: >
          Build specs/product-1/SPEC-resolutions.md point 35 in api/: /v1/status uses the
          packs' own rules_checked_on. Do not change a contract. Your target is
          tests/unit/api/test_status_rules.py and every other api test.
        done: >-
          bash -c 'uv run pytest tests/unit/api -q && uv run mypy
          && uv run ruff check api && uv run ruff format --check api'
  - name: reconcile
    checkpoint: false
    lanes:
      - lane: L-tests
        agent: test-author
        mission: >
          The engine now has specs/product-1/SPEC-resolutions.md points 27, 28, 36 and 37, the
          api point 35, and the contract point 38. Bring every test in tests/unit and tests/holdout in line with them. The
          builders' lists of collisions are in their reports on their branches (git show). For
          each change, write the point beside it; change a case so its facts fit or expect what
          the point says; never loosen an assertion a point supports; escalate any failure no
          settled point explains.
        done: >-
          bash -c 'uv run ruff check tests && uv run ruff format --check tests
          && uv run pytest tests/unit tests/holdout -q -p no:cacheprovider --ignore=tests/unit/tools'
    checks:
      - { name: "engine and api tests", run: "uv run pytest tests/unit/engine tests/unit/api -q" }
      - { name: "hidden tests", run: "uv run pytest tests/holdout -q" }
  - name: screen
    lanes:
      - lane: L-web
        agent: builder
        mission: >
          Build specs/product-1/SPEC-resolutions.md points 29, 31, 32, 33 and 34 in web/, and give
          the new conflict of point 27 its words beside the others (what does not fit, never
          which date is wrong). Point 29: an answer among an item's inputs is shown as the
          person's answer and its day. Point 31: the new name. Point 32: every date under What
          comes next opens to its rule, with the note for a reading. Point 33: an answer whose
          about no longer matches the facts is removed from the form when they change, and never
          shown as standing. Point 34: employment periods in about as start and end. Point 35's
          screen part: the page load time is not called Checked. Tests beside the code for each.
        done: >-
          bash -c 'npm run typecheck -w web && npm test -w web
          && npx eslint web --max-warnings 0
          && npx prettier --check "web/**/*.{ts,tsx,css,html,json}"
          && uv run python -m tools.copy_lint.lint'
    checks:
      - { name: "offline gates", run: "make test-offline BASE=product-1" }
      - { name: "hidden tests", run: "uv run pytest tests/holdout -q" }
  - name: review
    lanes:
      - lane: L-review
        agent: reviewer
        mission: >
          Review what this plan changed (the merges since reviews/product-1-fix1.md) against
          specs/product-1/SPEC-resolutions.md points 27 to 38, PRINCIPLES.md, BOUNDARY.md and
          CLAUDE.md, following your role file. Send each case the points name through the api,
          including a four-month OPT card that ends before the program end, the passed new Form
          I-983 of finding 1 and the seven-period record of finding 2 of
          reviews/product-1-fix1.md, answered in full. Check that every
          test changed in the reconcile round names its point and loosens nothing, that no
          answer is shown as standing that the engine did not read, and that every date under
          What comes next opens to its rule. Write reviews/product-1-fix2.md and
          reviews/REVIEW.json.
        done: bash -c 'grep -Eq "^(APPROVE|VETO)$" reviews/product-1-fix2.md && test -f reviews/REVIEW.json'
  - name: audit
    lanes:
      - lane: L-audit
        agent: auditor
        mission: >
          Audit the rows of the register that product round 1 and its fixes cover, as your role
          file describes, against specs/product-1/SPEC.md and SPEC-resolutions.md. Update
          docs/requirements/audits/product-1.md.
        done: >-
          bash -c 'test -f docs/requirements/audits/product-1.md
          && uv run python -m tools.requirements.register check'
