branch: product-1
spec: specs/product-1/SPEC-resolutions.md
merge: pr
rounds:
  - name: tests
    checkpoint: false
    lanes:
      - lane: L-tests
        agent: test-author
        mission: >
          Bring tests/unit/api and tests/holdout in line with specs/product-1/SPEC-resolutions.md,
          as the last round did for tests/unit/engine. The api builder's work is on branch
          lane/L-api/l-api-b92dbaa4da and escalated on 11 api tests; its reasons are in
          api/REPORT.json under disputes and in api/ESCALATE.md on that branch (git show).
          Do not merge it (api/ is outside your lane); your done command lays it over a
          scratch copy of this branch and runs the tests there.
          The cause is one pattern. tests/support/f1_pack.py gives placeholder answers:
          the day ON_THE_DAY_IT_RUNS (1950-01-01) and about_asked(question), which only
          dated_on_the_day and with_the_about_asked turn into real answers. The engine tests
          call those; the api tests and the hidden tests call answered_yes() and answers()
          and send the placeholders as they are, so under points 3 and 7 the questions stay
          open and counts are null. Fix every such caller so that what reaches the engine or
          the api is a real answer: dated on or before the case day (point 2), covering the
          case day for no_employment_to_record (point 3), with the about the output asks for
          (point 7). Then make it impossible to repeat: in tests/support, refuse (raise) when
          a case that still holds ON_THE_DAY_IT_RUNS or an about of the form
          {"question": id} is passed to the engine or posted to the api, in every run helper
          the tests use, and add a test that shows the refusal.
          Other disputes, each settled: test_compute.py::test_a_good_case_returns_the_engine_output
          expects the phase-2 key set; the product contract adds upcoming and lists (SPEC.md
          section 3). Hidden tests whose drawn or fixed dates fall after the case day
          (cap_gap.petition_filed_on.after_today and similar) must draw dates on or before it
          (point 4). test_holdout_sourcing.py::test_the_lookahead_comes_from_the_settings uses
          CASE_C, which records the STEM filing on 2026-05-20, so stem.file_by is a done step
          and not open (point 5); give that test a case with no STEM filing recorded.
          test_there_is_one_report_for_each_interval_in_the_extension fails with
          "fromisoformat: argument must be str" on a null; find which settled point makes it
          null and fix the case, not the expectation, if the SPEC supports the expectation.
          If any failure is not explained by a settled point, it may be a real engine error:
          do not change that test; list it under disputes with the case and the output, and
          escalate. Never loosen an assertion the SPEC supports. Done means tests/unit
          (without tests/unit/tools) and tests/holdout pass against that api; show the tail.
        done: >-
          bash -c 'uv run ruff check tests && uv run ruff format --check tests
          && R=$PWD && d=$R/.done-scratch && rm -rf $d && mkdir $d && trap "rm -rf $d" EXIT
          && git archive HEAD | tar -x -C $d
          && git archive lane/L-api/l-api-b92dbaa4da api | tar -x -C $d
          && cd $d && ${UV_PROJECT_ENVIRONMENT:-$R/.venv}/bin/python -m pytest tests/unit tests/holdout
          --ignore=tests/unit/tools -q -p no:cacheprovider'
  - name: api-and-screen
    lanes:
      - lane: L-api
        agent: builder
        mission: >
          Your earlier run did the api work of specs/product-1/SPEC.md section 3 and
          SPEC-resolutions.md point 8 on branch lane/L-api/l-api-b92dbaa4da and escalated on
          11 tests that contradicted settled points. The tests round has fixed them on this
          branch. Bring your work in first: git merge lane/L-api/l-api-b92dbaa4da. Then run
          the done command; fix anything left in api/, and pass.
        done: >-
          bash -c 'uv run pytest tests/unit/api -q && uv run mypy
          && uv run ruff check api && uv run ruff format --check api'
      - lane: L-web
        agent: builder
        mission: >
          Your earlier run did most of the screen work of specs/product-1/SPEC.md sections 1,
          2, 3, 5, 6 and 7 and was stopped by a fault in the factory's token count, not by
          you. Its work is kept on branch lane/L-web/l-web-d1622b0c58 as one commit marked
          not accepted. Bring it in first: git merge lane/L-web/l-web-d1622b0c58, read
          web/PROGRESS.md for where you were, then finish and pass. Where a choice of layout,
          token or motion is open, follow design/canvas/DESIGN-SPEC.md and the screens in
          design/canvas/screens. Where canvas words cross BOUNDARY.md, BOUNDARY.md wins
          (docs/requirements/canvas-conflicts.md lists each place). Tests beside the code for
          every new piece.
        done: >-
          bash -c 'npm run typecheck -w web && npm test -w web
          && npx eslint web --max-warnings 0
          && npx prettier --check "web/**/*.{ts,tsx,css,html,json}"
          && uv run python -m tools.copy_lint.lint'
    checks:
      - { name: "offline gates", run: "make test-offline BASE=product-1" }
      - { name: "hidden tests", run: "uv run pytest tests/holdout -q" }
  - name: review
    lanes:
      - lane: L-review
        agent: reviewer
        mission: >
          Review everything on this branch that is not on main (git diff main...HEAD) that
          belongs to product round 1, against specs/product-1/SPEC.md, SPEC-resolutions.md,
          PRINCIPLES.md, BOUNDARY.md and CLAUDE.md, following your role file. Run the inputs
          of findings 1 to 6 in reviews/phase-2-second.md again. Check in particular that no
          verdict falls back to no_open_items when a value is missing, stale or in conflict,
          and that a STEM application filed before its DSO recommendation date is caught.
          Write reviews/product-1.md and reviews/REVIEW.json.
        done: bash -c 'grep -Eq "^(APPROVE|VETO)$" reviews/product-1.md && test -f reviews/REVIEW.json'
  - name: audit
    lanes:
      - lane: L-audit
        agent: auditor
        mission: >
          Audit product round 1 as your role file describes, against specs/product-1/SPEC.md
          and SPEC-resolutions.md. Write docs/requirements/audits/product-1.md.
        done: >-
          bash -c 'test -f docs/requirements/audits/product-1.md
          && uv run python -m tools.requirements.register check'
