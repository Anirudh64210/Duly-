branch: product-1
spec: specs/product-1/SPEC.md
merge: pr
rounds:
  - name: tests-and-rules
    checkpoint: false   # tests written before the code cannot pass clean CI on their own
    lanes:
      - lane: L-tests
        agent: test-author
        mission: >
          Write the tests the SPEC describes under "The tests", for sections 1 to 6, in
          tests/unit and tests/holdout, and update existing tests and tests/support for the
          changed contracts. Read reviews/phase-2-second.md for the reviewer's exact inputs.
          The new tests cannot pass yet; that is expected.
        done: >-
          bash -c 'grep -rq "nothing_more_to_record" tests/unit/engine tests/holdout
          && grep -rq "card_longer_than_rule" tests/unit/engine tests/holdout
          && grep -rq "upcoming" tests/unit/engine tests/unit/api
          && uv run ruff check tests && uv run ruff format --check tests'
      - lane: L-content
        agent: rulepack-drafter
        mission: >
          Do the L-content work in sections 5 and 6 of the SPEC. Read the saved sources
          again for every rule you touch. Record only what the paragraph says.
        done: >-
          bash -c 'uv run python -m tools.sources.verify rulepacks
          && uv run pytest tests/unit/engine/test_rulepack.py -q
          && test $(grep -c "id: stem.requires\." rulepacks/f1-us/v2026.09/parameters.yaml) -ge 3'
    checks:
      - { name: "sources: every quote found, verbatim or a marked reading", run: "uv run python -m tools.sources.verify rulepacks" }
  - name: engine
    checkpoint: false   # the api and the screen still speak the old contract
    lanes:
      - lane: L-engine
        agent: builder
        mission: >
          Do the engine work in sections 1 to 6 of the SPEC. The tests in tests/unit/engine
          are your target and you cannot edit them.
        done: >-
          bash -c 'uv run pytest tests/unit/engine -q
          && uv run python -m tools.gates.engine_literals
          && uv run mypy && uv run ruff check engine && uv run ruff format --check engine'
    checks:
      - { name: "engine tests", run: "uv run pytest tests/unit/engine -q" }
  - name: api-and-screen
    lanes:
      - lane: L-api
        agent: builder
        mission: >
          Do the api work in section 3 of the SPEC and keep the api tests green with the
          changed contracts. The tests in tests/unit/api are your target.
        done: >-
          bash -c 'uv run pytest tests/unit/api -q && uv run mypy
          && uv run ruff check api && uv run ruff format --check api'
      - lane: L-web
        agent: builder
        mission: >
          Do the screen work in sections 1, 2, 3, 5, 6 and 7 of the SPEC. Regenerate the api
          types with npx openapi-typescript contracts/openapi.yaml -o
          web/src/lib/api-types.ts only if the network allows; otherwise leave them. Write
          tests beside the code for every new piece of the screen.
        done: >-
          bash -c 'npm run typecheck -w web && npm test -w web
          && npx eslint web --max-warnings 0
          && npx prettier --check "web/**/*.{ts,tsx,css,html,json}"
          && uv run python -m tools.copy_lint.lint'
    checks:
      - { name: "offline gates", run: "make test-offline BASE=product-1" }
      - { name: "hidden tests", run: "uv run pytest tests/holdout -q" }
  - name: review
    lanes:
      - lane: L-review
        agent: reviewer
        mission: >
          Review everything on this branch that is not on the branch factory-v2
          (git diff factory-v2...HEAD) against specs/product-1/SPEC.md, PRINCIPLES.md,
          BOUNDARY.md and CLAUDE.md, following your role file. Run the inputs of findings
          1 to 6 in reviews/phase-2-second.md again and say whether each is closed. Write
          reviews/product-1.md and reviews/REVIEW.json.
        done: bash -c 'grep -Eq "^(APPROVE|VETO)$" reviews/product-1.md && test -f reviews/REVIEW.json'
    checks: []
  - name: audit
    lanes:
      - lane: L-audit
        agent: auditor
        mission: >
          Audit product round 1 as your role file describes. The SPEC is
          specs/product-1/SPEC.md. It was written before SPECs had to name what they cover,
          so find the rows of the register it touches yourself: the verdict, questions and
          conflicts, what comes next, readings, and the founder's notes B1 to B7 and D41.
          Write docs/requirements/audits/product-1.md.
        done: >-
          bash -c 'test -f docs/requirements/audits/product-1.md
          && uv run python -m tools.requirements.register build
          && uv run python -m tools.requirements.register check'
    checks: []
