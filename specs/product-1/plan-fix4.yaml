branch: product-1
spec: specs/product-1/SPEC-resolutions.md
merge: pr
# Resolutions 39 to 50 and specs/plain-1/SPEC.md (the founder's words after testing). Build
# then reconcile, as the runbook says. Replaces plan-fix3, which never ran.
rounds:
  - name: content
    checkpoint: false
    lanes:
      - lane: L-content
        agent: rulepack-drafter
        mission: >
          Three pieces of work in rulepacks/f1-us/v2026.09, each quote found in a saved snapshot.
          (1) specs/plain-1/SPEC.md section 1: plain words for every rule and every regime of the
          F-1 pack, written from each quote, under the rules that section gives. For the paused
          regime, from the court's order saved as sources/mad-1-26-cv-13799-doc51-order.txt and
          the docket listing beside it. Run python -m tools.sources.plain rulepacks --require f1
          and fix every problem it names. (2) specs/product-1/SPEC-resolutions.md point 50: the
          rule stem.report_change_within_days, 10 days, settled, verbatim, quoting 8 CFR
          214.2(f)(12)(ii)(A) from the saved 2026-09-14 text. (3) Point 40: the list of legal public
          holidays in force before 2021-06-17 as a row of calendar.federal_holidays_law with
          effective_to 2021-06-16, grounded in the saved 5 U.S.C. 6103 copy and its note that
          Pub. L. 117-17 inserted Juneteenth, derivation reading, if the saved words ground it (if
          not, add nothing and say so); and the October 1 start condition of 8 CFR
          214.2(f)(5)(vi)(A)(2) as amended by 73 FR 18944 as a flag row
          capgap.october_start_condition closed on 2025-01-16, from the saved fr-e8-7427 copy.
          Record each change in the pack's CHANGELOG.md. Never invent a number or a quote.
        done: >-
          bash -c 'uv run python -m tools.sources.verify rulepacks
          && uv run python -m tools.sources.plain rulepacks --require f1
          && uv run python -c "from engine.rulepack import load_all; load_all()"
          && grep -q "stem.report_change_within_days" rulepacks/f1-us/v2026.09/parameters.yaml'
  - name: tests
    checkpoint: false
    lanes:
      - lane: L-tests
        agent: test-author
        mission: >
          Write the tests, first, for specs/product-1/SPEC-resolutions.md points 39, 40, 42, 43,
          46, 47, 48, 49 and 50, each with the case its point names, in
          tests/unit/engine/test_f1_fix4.py, with hidden twins in tests/holdout/test_holdout_fix4.py.
          Also, from specs/plain-1/SPEC.md and the contract: every rule in the output's rules
          carries the pack's plain words; the output's regimes names every regime an item depends
          on, with its plain words, citation and url; answers_read lists exactly the questions
          whose answers were read. Point 40 with the cases it names (a STEM card before
          2016-05-10, a cap-gap petition before 2025-01-17 with and without an October 1 start,
          report dates in 2019 and 2020 around June 19). Use tests/support/f1_pack.py so no
          placeholder answer reaches the engine. Name every new test. They are expected to fail
          until the build round.
        done: >-
          bash -c 'uv run ruff check tests && uv run ruff format --check tests
          && uv run pytest tests/unit tests/holdout -q --co -p no:cacheprovider >/dev/null
          && test -f tests/unit/engine/test_f1_fix4.py && test -f tests/holdout/test_holdout_fix4.py
          && grep -q "answers_read" tests/unit/engine/test_f1_fix4.py
          && grep -q "earlier_at_this_level" tests/unit/engine/test_f1_fix4.py'
  - name: build
    checkpoint: false
    lanes:
      - lane: L-engine
        agent: builder
        mission: >
          Your earlier run built specs/product-1/SPEC-resolutions.md points 39, 40, 42, 43, 46, 48,
          49 and 50, the plain words, regimes and answers_read, on branch
          lane/L-engine/l-engine-1c477e1c41, and escalated because this round's done command held
          older test files that point 39 was bound to collide with. You were right; the done
          command now holds only the new tests, and the next round reconciles the rest. Bring
          your work in first: git merge lane/L-engine/l-engine-1c477e1c41. Then points 51, 52 and
          53 as written: keep your verdict order (51) and your grace reading (52); for 53, take
          the day Juneteenth starts from the pack's rows of calendar.federal_holidays_law and
          their effective dates, and remove the date written in engine/dates.py. List the older
          tests that collide in your report.
        done: >-
          bash -c 'uv run pytest tests/unit/engine/test_f1_fix4.py -q
          && uv run python -m tools.gates.engine_literals
          && uv run mypy && uv run ruff check engine && uv run ruff format --check engine
          && ! grep -n "2021" engine/dates.py'
  - name: reconcile
    checkpoint: false
    lanes:
      - lane: L-tests
        agent: test-author
        mission: >
          The engine now has specs/product-1/SPEC-resolutions.md points 39, 40, 42, 43, 46, 48 to
          53, and the output carries regimes and answers_read. Every case with an OPT card now
          raises opt.earlier_at_this_level: add it to the helpers of tests/support/f1_pack.py that
          give a case its ordinary answers, answered no, so a test about something else stays
          about that; expect the question only where a test is about it. A test pack that counts
          business days before 2021-06-17 holds both rows of calendar.federal_holidays_law
          (point 53). Tests that pin the output's keys add regimes and answers_read; tests that
          pin a cannot_tell verdict's reasons follow point 51. Bring every test in tests/unit and tests/holdout in line; the builder's
          list of collisions is in its report on its branch (git show). Write the point beside
          each change; never loosen an assertion a point supports; escalate any failure no
          settled point explains.
        done: >-
          bash -c 'uv run ruff check tests && uv run ruff format --check tests
          && uv run pytest tests/unit tests/holdout -q -p no:cacheprovider --ignore=tests/unit/tools'
    checks:
      - { name: "engine and api tests", run: "uv run pytest tests/unit/engine tests/unit/api -q" }
      - { name: "hidden tests", run: "uv run pytest tests/holdout -q" }
  - name: screen
    lanes:
      - lane: L-web
        agent: builder
        mission: >
          Your earlier run built all of this on branch lane/L-web/l-web-e2d830be5b and escalated
          only because the copy lint failed on a path your sandbox may not read; that is fixed.
          Bring your work in first: git merge lane/L-web/l-web-e2d830be5b, then run the done
          command and finish anything left. The work:
          Build specs/plain-1/SPEC.md sections 2 to 5 in web/: plain words first with the exact
          words one tap away; what a court did in plain words from the output's regimes, with a
          link to the order and the paused change behind a tap, and none of the forbidden status
          words anywhere; the drafted DSO email in the student's own voice with no mention of Duly
          and no computed date; calm fixed lines. Also specs/product-1/SPEC-resolutions.md point 41
          (the cap-gap change of status and petition status start unchosen, and the form refuses
          to compute until both are chosen), point 44 (the words for
          rule_not_in_force_on_event_day), point 46 (only answers in answers_read shown as
          standing), and words for the question of point 39, the conflict of point 43 and the
          judgement items of points 39 and 40, saying what is asked or why Duly steps back and
          nothing about what it means for the person. Regenerate the api types from
          contracts/openapi.yaml if the build needs it. Tests beside the code for each.
        done: >-
          bash -c 'npm run typecheck -w web && npm test -w web
          && npx eslint web --max-warnings 0
          && npx prettier --check "web/**/*.{ts,tsx,css,html,json}"
          && uv run python -m tools.copy_lint.lint
          && ! grep -rn "Before a court\|blocked by a court" web/src --include=*.ts --include=*.tsx'
    checks:
      - { name: "offline gates", run: "make test-offline BASE=product-1" }
      - { name: "hidden tests", run: "uv run pytest tests/holdout -q" }
  - name: review
    lanes:
      - lane: L-review
        agent: reviewer
        mission: >
          Review what this plan changed (the merges since reviews/product-1-fix2.md) against
          specs/product-1/SPEC-resolutions.md points 39 to 50, specs/plain-1/SPEC.md, PRINCIPLES.md,
          BOUNDARY.md and CLAUDE.md, following your role file. Read every plain text in the F-1
          pack beside its quote and veto any that says more, less or other than the quote, or that
          reads as advice. Send each case the points name through the api, and the inputs of
          findings 1, 2 and 5 of reviews/product-1-fix2.md. Read every DSO draft the screen can
          build: in the student's voice, no Duly, no computed date, no conclusion. Check that
          every test changed in the reconcile round names its point and loosens nothing. Write
          reviews/product-1-fix4.md and reviews/REVIEW.json.
        done: bash -c 'grep -Eq "^(APPROVE|VETO)$" reviews/product-1-fix4.md && test -f reviews/REVIEW.json'
  - name: audit
    lanes:
      - lane: L-audit
        agent: auditor
        mission: >
          Audit the rows of the register that product round 1, its fixes and specs/plain-1/SPEC.md
          cover, as your role file describes, against specs/product-1/SPEC.md,
          SPEC-resolutions.md and specs/plain-1/SPEC.md. Update docs/requirements/audits/product-1.md.
        done: >-
          bash -c 'test -f docs/requirements/audits/product-1.md
          && uv run python -m tools.requirements.register check'
