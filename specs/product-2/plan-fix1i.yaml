branch: product-2
spec: specs/product-2/resolutions.md
merge: pr
audited: false  # the translation tests inside product-2; plan-fix1g's review and audit follow
rounds:
  - name: guard
    checkpoint: false
    lanes:
      - lane: L-tests
        agent: test-author
        mission: >
          Your work is on lane/L-tests/l-tests-9d76786149; bring it in (git merge lane/L-tests/l-tests-9d76786149). You were right to escalate:
          specs/product-2/resolutions.md point 14 now settles each question. Bring the six
          translation tests in line with it: state each list whole with the path's complete.<kind>
          where the case means it, drop reliance on answers to unasked questions, compare with the
          case as sent, and hold no placeholder marker. Keep the engine's coverage at 95.
        done: >-
          bash -c 'uv run ruff check tests && uv run ruff format --check tests
          && uv run pytest tests/unit/support tests/unit/engine -q -p no:cacheprovider --cov=engine
          --cov-report=xml:.scratch/engine-coverage.xml
          && uv run diff-cover .scratch/engine-coverage.xml --include "engine/*"
          --fail-under=95 --compare-branch=product-2'
