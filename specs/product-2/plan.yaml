branch: product-2
spec: specs/design-1/SPEC.md
merge: pr
# The real app: the path model over every program a student has had (specs/path-1/SPEC.md with
# specs/path-1/programs.md), the checks of D59 for typed dates (specs/documents-1/SPEC.md
# section 8, built now as questions), and the approved canvas (specs/design-1/SPEC.md), inside
# the desktop window (desktop-1). Parallel lanes; heavy checks once; one review; one CI.
rounds:
  - name: first
    checkpoint: false
    lanes:
      - lane: L-tests
        agent: test-author
        mission: >
          Write the tests first, from the contracts on this branch (read
          specs/path-1/contracts-reconciled.md): specs/path-1/SPEC.md and specs/path-1/programs.md
          section 22 (engine/path.py over records, each kind of check, completeness statements,
          the literal-free rule, parity for today's cases with the differences of its section 19,
          and the twenty journeys of specs/path-1/journeys.json as pairs in tests/holdout, each
          date checked against the saved words first); the D59 questions of
          specs/documents-1/SPEC.md section 8 (typed_dates.from_documents and
          typed_dates.checked.<fact>, cannot_tell until checked, never quiet while unchecked); and
          POST /v1/compute (specs/design-1/SPEC.md section 11). Put engine tests in
          tests/unit/engine/test_path.py and test_typed_dates.py, api tests in
          tests/unit/api/test_compute_generic.py. They are expected to fail until the build round.
        done: >-
          bash -c 'uv run ruff check tests && uv run ruff format --check tests
          && uv run pytest tests/unit tests/holdout -q --co -p no:cacheprovider >/dev/null
          && test -f tests/unit/engine/test_path.py && test -f tests/unit/engine/test_typed_dates.py'
      - lane: L-content
        agent: rulepack-drafter
        mission: >
          In rulepacks/f1-us/v2026.09, write F-1's path over records as specs/path-1/programs.md
          sections 13 to 16 set out (record kinds, the stages per program and card, windows,
          next steps, checks, and the rules its section 16 says to add, each from a saved primary
          source), and the checklist steps of specs/design-1/SPEC.md section 8 with their words in
          the shape its section 17 F7 gives, each passing tools.sources.plain. Every amount names a
          sourced rule; never write a number. Record every place a rule is missing in your report.
          Existing plain words are frozen.
        done: >-
          bash -c 'uv run python -m tools.sources.verify rulepacks
          && uv run python -c "from engine.rulepack import load_all; load_all()"
          && uv run python -m tools.sources.plain rulepacks --require f1'
  - name: build
    checkpoint: false
    lanes:
      - lane: L-engine
        agent: builder
        mission: >
          Build engine/path.py over records as specs/path-1/SPEC.md and specs/path-1/programs.md
          say, compute_f1 as a translation of today's case (section 19), the D59 questions of
          specs/documents-1/SPEC.md section 8, and the output the contracts now hold (record on
          items, stages, checklists, upcoming days_away and inputs). No F-1 id, date or number in
          engine/path.py. Your targets are tests/unit/engine/test_path.py and test_typed_dates.py;
          list older tests that collide in your report.
        done: >-
          bash -c 'uv run pytest tests/unit/engine/test_path.py tests/unit/engine/test_typed_dates.py -q
          && uv run python -m tools.gates.engine_literals
          && uv run mypy && uv run ruff check engine && uv run ruff format --check engine'
      - lane: L-api
        agent: builder
        mission: >
          Build POST /v1/compute (case.schema.json in, the engine output out) and the other api
          work of specs/design-1/SPEC.md section 11. /v1/compute/f1 stays. Target:
          tests/unit/api/test_compute_generic.py.
        done: >-
          bash -c 'uv run pytest tests/unit/api/test_compute_generic.py -q && uv run mypy
          && uv run ruff check api && uv run ruff format --check api'
      - lane: L-web
        agent: builder
        mission: >
          Build round A of specs/design-1/SPEC.md in web/: the shell (sections 3 and 4), Onboarding
          asking for every program the student has had, step by step, as specs/path-1/programs.md
          section 18 sets out (section 5), Home (section 6, with the D59 questions shown as
          questions), Updates with its empty state (section 9), and Your case, Settings and
          Feedback (section 10). The words follow section 12 and section 17's recommendations,
          except F12: the D59 checks are questions now, so a checked case can reach every verdict.
          The engine test bench leaves the production build (specs/path-1/programs.md section 9).
          Match the canvas: design/canvas/screens/*.dc.html for type, colour and motion, the PNGs
          for layout. Tests beside the code, including the contrast and calm checks section 14
          names.
        done: >-
          bash -c 'npm run typecheck -w web && npm test -w web
          && npx eslint web --max-warnings 0
          && npx prettier --check "web/**/*.{ts,tsx,css,html,json}"
          && uv run python -m tools.copy_lint.lint'
      - lane: L-desktop
        agent: builder
        mission: >
          Build the desktop part of specs/design-1/SPEC.md section 4: the case kept in one file on
          this Mac, encrypted with the keychain, through the case bridge typed by
          contracts/desktop_case_bridge.schema.json. Tests beside the code as desktop-1 does.
        done: >-
          bash -c 'npm run typecheck -w desktop && npm test -w desktop
          && npx eslint desktop --max-warnings 0 && uv run python -m tools.copy_lint.lint'
  - name: reconcile
    checkpoint: false
    lanes:
      - lane: L-tests
        agent: test-author
        mission: >
          The engine now reads records through engine/path.py, asks the D59 questions, and gives
          the new output; the api has /v1/compute. Bring every test in tests/unit and tests/holdout
          in line; the builders' lists of collisions are in their reports on their branches (git
          show). Write the point beside each change; never loosen an assertion a point supports;
          escalate any failure no settled point explains.
        done: >-
          bash -c 'uv run ruff check tests && uv run ruff format --check tests
          && uv run pytest tests/unit tests/holdout -q -p no:cacheprovider --ignore=tests/unit/tools'
    checks:
      - { name: "engine and api tests", run: "uv run pytest tests/unit/engine tests/unit/api -q" }
      - { name: "hidden tests", run: "uv run pytest tests/holdout -q" }
  - name: screens
    lanes:
      - lane: L-web
        agent: builder
        mission: >
          Build round B of specs/design-1/SPEC.md: Timeline (section 7) with one row per program,
          card, move and trip from the output's stages and record ids, and Checklists (section 8)
          from the output's checklists, and the round B parts of Home (section 6). Words by
          sections 12 and 17. Tests beside the code.
        done: >-
          bash -c 'npm run typecheck -w web && npm test -w web
          && npx eslint web --max-warnings 0
          && npx prettier --check "web/**/*.{ts,tsx,css,html,json}"
          && uv run python -m tools.copy_lint.lint'
    checks:
      - { name: "offline gates", run: "make test-offline BASE=product-2" }
      - { name: "hidden tests", run: "uv run pytest tests/holdout -q" }
  - name: review
    lanes:
      - lane: L-review
        agent: reviewer
        mission: >
          Review everything this plan built against specs/path-1/SPEC.md, specs/path-1/programs.md,
          specs/design-1/SPEC.md, specs/documents-1/SPEC.md section 8, PRINCIPLES.md, BOUNDARY.md
          and CLAUDE.md, following your role file, in ONE pass naming every finding. Send at least
          ten of the twenty journeys of specs/path-1/journeys.json through /v1/compute and say what
          each shows. Compare every screen with its canvas PNG. Check that no verdict is quiet on an
          unchecked typed date, a list with no completeness statement, or an unknown condition.
          Write reviews/product-2.md and reviews/REVIEW.json.
        done: bash -c 'grep -Eq "^(APPROVE|VETO)$" reviews/product-2.md && test -f reviews/REVIEW.json'
  - name: audit
    lanes:
      - lane: L-audit
        agent: auditor
        mission: >
          Audit the rows that specs/path-1/programs.md section 22 and specs/design-1/SPEC.md Covers
          name, as your role file describes. Write docs/requirements/audits/product-2.md and report
          the share of the register met.
        done: >-
          bash -c 'test -f docs/requirements/audits/product-2.md
          && uv run python -m tools.requirements.register check'
