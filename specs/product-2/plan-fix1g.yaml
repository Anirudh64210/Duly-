# Trips counted by their own dates; then reconcile, review, audit.
branch: product-2
spec: specs/product-2/resolutions.md
merge: pr
rounds:
- name: trips
  checkpoint: false
  lanes:
  - lane: L-engine
    agent: builder
    mission: 'A hidden test found a wrong count: engine/path.py _Run._days_of reads a record''s days from
      start and end, but a trip record holds left_on and returned_on, so a personal trip inside a job
      is never counted (86 days where 105 is right). Read each record kind''s days from the span fields
      the pack declares for that kind (specs/path-1/programs.md sections 10 and 13), never from field
      names written in the engine. Add a test in tests/unit/engine that a trip inside a job adds its days.
      Your done command holds the acceptance journeys and the gates.'
    done: bash -c 'uv run pytest tests/unit/acceptance tests/unit/engine/test_path.py -q && uv run python
      -m tools.gates.engine_literals && uv run mypy && uv run ruff check engine && uv run ruff format
      --check engine'
- name: reconcile
  lanes:
  - lane: L-tests
    agent: test-author
    mission: 'Resolution 13 is in the engine: counts wait for every list they read, trips included. Bring
      every test in tests/unit and tests/holdout in line, starting with the three in tests/unit/engine/test_path_fix1.py
      whose journeys hold trips with no statement that the trip list is whole. Write the point beside
      each change; never loosen an assertion; escalate any failure no point explains.'
    done: bash -c 'uv run ruff check tests && uv run ruff format --check tests && uv run pytest tests/unit
      tests/holdout -q -p no:cacheprovider --ignore=tests/unit/tools'
  checks:
  - name: offline gates
    run: make test-offline BASE=product-2
  - name: hidden tests
    run: uv run pytest tests/holdout -q
- name: review
  lanes:
  - lane: L-review
    agent: reviewer
    mission: 'Review product-2 again against specs/product-2/resolutions.md and the SPECs it names, following
      your role file, in ONE pass. Send all twenty journeys through POST /v1/compute and say what each
      shows. Build the web app and walk Onboarding for J01, J08 and J16. Close or name every finding of
      reviews/product-2.md. Write reviews/product-2-fix1.md and reviews/REVIEW.json.

      '
    done: bash -c 'grep -Eq "^(APPROVE|VETO)$" reviews/product-2-fix1.md && test -f reviews/REVIEW.json'
- name: audit
  lanes:
  - lane: L-audit
    agent: auditor
    mission: 'Audit the rows that specs/path-1/programs.md section 22 and specs/design-1/SPEC.md Covers
      name. Update docs/requirements/audits/product-2.md and report the share met.

      '
    done: bash -c 'test -f docs/requirements/audits/product-2.md && uv run python -m tools.requirements.register
      check'
