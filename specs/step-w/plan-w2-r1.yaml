ate, a number, a rule id or a reason code, while every other item keeps its date. tests/desktop/engine-spawn.test.ts: (9) the engine is spawned with detached: true and ended through its process group; it guards code that is right today, so it passes now and fails when detached is taken out (the surviving mutant). Never loosen an assertion.'
