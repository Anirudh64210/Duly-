branch: step-w
spec: specs/step-w/SPEC-W2.md
goal: 'W2-R1, the revision build of the regroup round (SPEC-W2 point 52a; D97, D100), before W2-P5: the findings of the 2026-10-03 audit that need engine, pack, web, pipeline or test work and no other plan carries (the bundle fixes are plan-w2-p4-fix0''s; the job title, Your answers, Back after Delete everything and the rejected-copy tests are W2-P5''s and W2-P6''s, SPEC-W2 points 4a, 4b, 11a and 24a), and D97''s engine changes with what today''s screen needs to show them, so that P5 and P6 build on them. D97(1): one confirmation per document of the fields typed from it (SPEC-W2 points 10 and 28, N7 of point 46); which document a field is typed from is pack data, read from contracts/rulepack.schema.json with K7 (point 44a), and a typed date whose field names no document (a job''s start) is asked once with its record, never once per date. D97(3): an unknown, an unanswered question, an unconfirmed field, a stale rule or a litigated rule holds only the items it touches, every other item keeps its date, and nothing that waits is shown as settled (N8 of point 46; SPEC-W2-UNKNOWN points 33, 34 and 37 as amended). A stale rule is per rule, from its own checked_on; held and superseded rules come from the feed''s check record and stay with FEED-P1 and FEED-P8. D32: a filing date or an EAD stops the DSO recommendation date from being asked or blocking. The should-fixes carried from reviews/w2-p2.md and its audit: a check against a rule never blanks a confirmed day; a withheld watch or check-in row names what it waits on; a conflict between answers withholds what is dated from them, an OPT card that starts before its program ends included; a planned trip gets no conflict built from today; trips, moves, CPT, transfers and changes of level before 2026-09-14 get their dates wherever an earlier saved copy holds the same words; a rule''s checked_on moves only where the newest recheck backs it, the eCFR versions list included (D98, SPEC-FEED points 16 and 55). DSO drafts state only hours the student entered and carry no CFR citation (D57, D97); each conflict has its own words; a "No, something changed" check-in opens the record (D75); the first law-update draft clears the three should-fixes of reviews/feed-pa.md; the surviving mutants of approved reviews are killed. Before the first round, outside the jail and alone, the founder lane commits on step-w: contracts/rulepack.schema.json with K7, and the optional waits_on on watch[] and checkins[] items of contracts/engine_output.schema.json (SPEC-W2 point 40 as amended), each a founder contract commit, first and alone; for 8 CFR 214.2, 8 CFR 214.1 and 22 CFR 41.112, the eCFR versions list and the point-in-time copy at each version date back to the earliest date eCFR serves, under rulepacks/f1-us/v2026.09/sources/ named as the saved copies are (ecfr-8cfr214.2-<date>.xml), each with its SHA-256; and the recheck-<day>.json that tools.sources.recheck --fetch writes on the F-1 pack (the weekly local recheck of D98). The first round stops the plan unless all of it is committed. Lanes work from saved copies only and fetch nothing. Missions cite SPEC points and decisions, never what a hidden test found (D100).'
merge: local
audited: true
rounds:
- name: inputs
  steps:
  - lane: L-content
    run: uv run python -c "import json,re,subprocess as s,sys; g=lambda *a:s.run(['git',*a],capture_output=True,text=True).stdout; j=lambda f:json.loads(g('show','HEAD:'+f) or '{}'); t=g('ls-tree','-r','--name-only','HEAD','rulepacks/f1-us/v2026.09').split(); d=lambda n,x:[m.group(1) for f in t for m in [re.search('/'+re.escape(n)+r'-(\d{4}-\d\d-\d\d)\.'+x+'$',f)] if m]; e=j('contracts/engine_output.schema.json').get('properties',{}); r=j('contracts/rulepack.schema.json').get('\$defs',{}); miss=[k+' waits_on' for k in ('watch','checkins') if 'waits_on' not in e.get(k,{}).get('items',{}).get('properties',{})]; miss+=[] if 'document' in r.get('record_field',{}).get('properties',{}) else ['K7']; miss+=[n+' before '+b for n,b in (('ecfr-8cfr214.2','2026-09-14'),('ecfr-8cfr214.1','2026-09-30'),('ecfr-22cfr41.112','2026-09-30')) if not [x for x in d(n,'xml') if x<b]]; miss+=[] if [x for x in d('recheck','json') if x>'2026-10-03'] else ['a recheck after 2026-10-03']; sys.exit('not committed on step-w, which the founder lane commits before this plan, '+', '.join(miss) if miss else 0)"
- name: tests
  lanes:
  - lane: L-tests
    agent: test-author
    mission: 'Read DECISIONS.md D32, D57, D92, D93, D97 and D100, SPEC-W2 points 28, 40, 44a, 45 and 46, SPEC-W2-UNKNOWN (2a, 32, 32a, 33 and 34), reviews/w2-p2.md findings 1 to 4, docs/requirements/audits/w2-p2.md findings 1 and 4, the hours note and the notes of reviews/w2-p1.md, reviews/feed-pa.md findings 1 and 4, and the DSO email lines of specs/ui-2/BRIEF.md. Write tests failing today, each date worked by hand in a comment, the decision, point or finding beside each. tests/unit/engine/test_w2_r1_checks.py: (1) a2 opt_pre_completion part_time approved, card 2026-06-01 to 2027-05-31, w1 under a2 from 2026-06-01 at 25 hours a week, confirmed_on 2026-10-01, today 2026-10-02: the hours check is asked and the check-in keeps confirmed_on 2026-10-01, due 2026-10-31, since a check that reads a rule never blanks a confirmed day; (2) a job confirmed 2026-06-10 that starts 2026-07-01: its count and limit day are null and wait on w1.confirmed_on (kills mutant N5); (3) a visa issued 2026-01-01 that expires 2025-01-01: watch.vi1.expires_on has date null and a waits_on naming the question that holds it; in (2), the check-in row of w1, withheld the same way, carries waits_on too; (4) program end 2027-01-01, OPT card 2026-06-01 to 2027-05-31, today 2026-09-29: opt_post.starts_after_program_end.a1 is asked, unemployment.opt_card.a1 and its limit day are null and wait on it, no at-or-over reason is raised, and after a yes to it the count is shown again; (5) a trip from 2026-10-31 to 2026-11-15, today 2026-10-02: the after-today questions are asked, no trip.t1.ends_before_starts is raised, and no window of trip.t1 shows a date while a question withholds trip.t1; a trip entered as back before it left still raises ends_before_starts, and its windows are withheld with the stage. tests/unit/engine/test_w2_r1_pack.py: (6) the F-1 pack declares the absence of dso_on by the record (D32): none on an opt_pre_completion, opt_post_completion or stem_extension authorization with a filing date or a decision other than pending recorded, asked on every other, and the pack CHANGELOG names it with the screen words that make it a statement; (12) the F-1 pack declares, as contracts/rulepack.schema.json with K7 allows, the document each record field is typed from (D97(1), SPEC-W2 points 28 and 44a): every kind it names is one of contracts/desktop_documents_bridge.schema.json other than other; an authorization''s dso_on names i20, its card_start and card_end name ead_card, and i20 on a cpt authorization; a program''s start_date and end_date name i20; a work record''s start names none; and the pack CHANGELOG names every field given a document. tests/unit/engine/test_w2_r1_copies.py: (7) each F-1 row whose effective_from_basis is earliest_saved_copy and whose source is an eCFR copy starts on the date of the earliest saved copy of its section, in the pack''s sources, from which every later saved copy up to the row''s own (the copy its snapshot names) holds its quote, read with the plain() of tools.sources.verify; copies after the row''s own are not read, since a row under the ds_2012 regime (transfer.begin_within_months, transfer.contact_new_dso_within_days, change_of_level.transfer_procedure, program.extension_new_i20) loses its words in the 2026-09-15 text; a row with no earlier copy keeps its date. tests/unit/pipeline/test_update_files.py: (8) every draft is validated with format_checker=FormatChecker(); every number in a draft''s plain is in one of its claims'' quotes (the contract''s own rule; tools.sources.plain reads numbers). tests/web/r1_words.test.ts, typed against today''s exports: (9) hours left empty, and hours entered as "forty": the facts sent and every DSO draft (the cannot_tell and talk_to_dso drafts and the hours ask) carry no hours clause, never "0 hours" or "NaN"; (10) no DSO draft holds a citation (no CFR, no section sign, no 214.2), and the draft of a school step for the OPT recommendation never names STEM OPT; (11) every conflict check of the F-1 pack has its own title and question words, none of them the generic line and no two alike, the ids read from the pack or listed with the pack named beside them; a conflict among answers that are not dates (the three address checks) never says dates and its yes never says documents; (13) settingName of plan.prepare_months gives its own plain words, never the name made from its id (the notes of reviews/w2-p1.md, D93). Never loosen an assertion. They cannot pass yet.'
    done: bash -c 'uv run ruff check tests && uv run ruff format --check tests && uv run pytest tests/unit/engine/test_w2_r1_checks.py tests/unit/engine/test_w2_r1_pack.py tests/unit/engine/test_w2_r1_copies.py tests/unit/pipeline --co -q >/dev/null && npx tsc --noEmit -p tests/web && npx eslint tests/web --max-warnings 0 && npx prettier --check "tests/web/**/*.{ts,tsx}"'
- name: build-1
  lanes:
  - lane: L-engine
    agent: builder
    mission: 'SPEC-W2 points 40 (as amended) and 46 and SPEC-W2-UNKNOWN (32, 32a, 33 and 34), with contracts/engine_output.schema.json as the founder lane amended it before this plan. engine/path.py: (1) a check is a clash, which withholds a confirmed day and what is dated from its records, only when its holds read the person''s answers and no rule: `_answers_only` is false for a node holding `rule`, since a check against a rule says what the rule asks, not that the answers are in doubt; (2) a check made only of answers that compares dates across records, directly or through a link, is a clash too: while it is unanswered, the counts, limit days, at-or-over reasons, windows and watch rows dated from the dates it compared are withheld with waits_on naming it, and a yes to it ends the withholding as for any clash; (3) a withheld watch row and a withheld check-in row carry waits_on naming what holds them, so their null never reads as does not apply; (4) ends_before_starts is raised only from days the person entered, never from today filling an optional end, and when a question withholds a stage its windows are withheld too. Generic, nothing about F-1 in engine code. Make tests/unit/engine/test_w2_r1_checks.py pass and list in your report every older test that collides.'
    done: bash -c 'uv run pytest tests/unit/engine/test_w2_r1_checks.py -q && uv run python -m tools.gates.engine_literals && uv run mypy && uv run ruff check engine && uv run ruff format --check engine'
  - lane: L-content
    agent: rulepack-drafter
    mission: 'DECISIONS.md D32 and D97(1), SPEC-W2 points 28, 44a and 45 (point 45 holds before a filing; after a filing date or a decision D32 rules), SPEC-W2-UNKNOWN on absence that depends on the record (2 and 2a), and contracts/rulepack.schema.json with K7, which the founder lane landed before this plan. In rulepacks/f1-us/v2026.09/parameters.yaml: (1) declare the absence of dso_on by the record, so that on an opt_pre_completion, opt_post_completion or stem_extension authorization with a filing date or a decision other than pending recorded an absent recommendation date is none, and on every other it is asked as today; give each check and window that reads dso_on what it needs (an only_if, for example) so that none of them reads that none as a conflict or a date; name the field in the CHANGELOG with the screen words that make its absence a statement. (2) Declare on each record field typed from a document the document kind it is typed from (K7), for the documents SPEC-W2 point 28 lists, named as the kinds of contracts/desktop_documents_bridge.schema.json: an authorization''s dso_on is the Form I-20''s; its card_start and card_end are the EAD card''s, and the Form I-20''s on a cpt authorization, declared by the record as K7 allows; a program''s start and end dates are the Form I-20''s; a field no document gives, such as a job''s start, names none, and so does a field whose document the form does not settle, which your report lists. Name every field given a document in the CHANGELOG. No value, quote, status, checked_on or effective date moves in this round. Work from the saved copies only; fetch nothing. Make tests/unit/engine/test_w2_r1_pack.py pass.'
    done: bash -c 'uv run python -m tools.sources.verify rulepacks && uv run python -m tools.sources.plain rulepacks --require f1 && uv run python -m tools.sources.recheck --check rulepacks/f1-us/v2026.09 && uv run python -c "from engine.rulepack import load_all; load_all()" && uv run python -m tools.copy_lint.lint && uv run pytest tests/unit/engine/test_w2_r1_pack.py tests/unit/engine/test_when_absent.py tests/unit/engine/test_rulepack.py -q'
  - lane: L-web
    agent: builder
    mission: 'DECISIONS.md D5, D56, D57, D93 and D97 (the founder''s 2026-09-30 asks win over the specs: the DSO email in normal student words, never a CFR cite), SPEC-W2 point 2 (lib/drafts.ts is kept while it fits D57) and SPEC-W2-UNKNOWN''s rule on the words (38). (1) web/src/app/caseStore.tsx sends hours as the student entered them: nothing when the field is empty, and never Number() of a value that is not a numeral; web/src/lib/drafts.ts leaves the hours clause out when the value is not a finite number, and the hours ask skips such values. (2) No DSO draft carries a citation; a school step''s draft asks about that step''s own topic, so a step of the OPT recommendation never asks about STEM OPT. (3) web/src/lib/labels.ts gives every conflict check of the F-1 pack its own title, saying in plain words which entered values do not fit together, and its own question: a conflict among answers that are not dates never asks about dates and its yes never says documents; the generic line stays only for an id the pack does not have. (4) SETTING_NAMES in web/src/lib/labels.ts names plan.prepare_months in plain words from its meaning line in contracts/product_settings.yaml, so it reads as Duly''s own setting and not the law (the notes of reviews/w2-p1.md, D93). The words state what was entered, never what it means for the student or what to do (BOUNDARY.md). Bring your own tests that asserted the old words (the citation in drafts.test.ts) in line, the decision beside each. Make tests/web/r1_words.test.ts pass with every web test in src.'
    done: bash -c 'npm run typecheck -w web && npm test -w web -- src/ r1_words && npx eslint web --max-warnings 0 && npx prettier --check "web/**/*.{ts,tsx,css,html,json}" && uv run python -m tools.copy_lint.lint'
  - lane: L-tests
    agent: test-author
    mission: 'Read DECISIONS.md D4, D32, D59, D92 and D97, SPEC-W2 points 10, 28, 44a, 45 and 46 (N7 and N8, as amended), SPEC-W2-UNKNOWN points 33, 34 and 37 as D97 amends them, and the two declarations L-content makes beside you: dso_on by the record (D32: none once a filing date or a decision other than pending is recorded) and each field''s document (K7). Write tests failing today, each date worked by hand, the decision or point beside each. tests/unit/engine/test_w2_r1_recommendation.py: (1) D32 on the F-1 pack: an opt_post_completion authorization approved, filed 2026-04-10, card 2026-06-01 to 2027-05-31, no dso_on: missing:a1.dso_on is not a reason, no question asks a1.dso_on, no conflict rests on it and no window shows a date from it; the same with the decision approved and the card but no filing date; its pair with no filing date and the decision pending still asks dso_on; the same three on a stem_extension. tests/unit/engine/test_w2_confirm_document.py (N7): a program and an authorization with typed dates give one question per record and document kind, read from the pack''s declarations, with id typed_dates.<record>.<kind> (typed_dates.p1.i20, typed_dates.a1.ead_card, and typed_dates.a1.i20 for its dso_on) and an about holding each typed field of that record and kind with its value, and none per date; a work record''s start, which names no document, is asked once with its record (typed_dates.w1), never once per date (D97(1)); on the authorization, which also carries a filing date and a decision date, any typed date whose field the pack''s declarations give no document is asked in typed_dates.a1 beside typed_dates.a1.ead_card and typed_dates.a1.i20, and no typed date is left unasked; typed_dates.from_documents is no longer asked; one yes confirms them all while those values stand; a changed value, or a record that later contradicts a confirmed field, asks that record and kind again and leaves the others confirmed. tests/unit/engine/test_w2_holds.py (N8): an unconfirmed document holds only the items its fields feed, each waiting on its question, while the items fed by a confirmed document keep their dates; an unknown and an unanswered question each hold only the outputs they touch and name, and every other item keeps its date whatever the verdict''s state; the verdict is cannot_tell while any question is open and never no_open_items while anything waits (D4). Stale and litigated rules get their own tests next round. Then bring older tests in line only where this plan''s decisions or the points of tests/unit/engine/test_w2_r1_checks.py require it, the decision or point beside each: test_opt_last_day_with_no_recommendation_date_is_no_date in tests/unit/engine/test_w2_windows.py (D32 rules after a filing; point 45 still holds before one), tests/unit/engine/test_typed_dates.py (D97 amends D59) and tests/unit/acceptance/test_journeys.py where they assert what D32, N7, N8 or those points change; tests/holdout follows in build-3. Never loosen an assertion. They cannot pass yet.'
    done: bash -c 'uv run ruff check tests && uv run ruff format --check tests && uv run pytest tests/unit/engine/test_w2_r1_recommendation.py tests/unit/engine/test_w2_confirm_document.py tests/unit/engine/test_w2_holds.py tests/unit/engine/test_typed_dates.py tests/unit/engine/test_w2_windows.py tests/unit/acceptance/test_journeys.py --co -q >/dev/null'
  checks:
  - name: sources
    run: uv run python -m tools.sources.verify rulepacks
- name: build-2
  lanes:
  - lane: L-engine
    agent: builder
    mission: 'DECISIONS.md D32, D59 as D97 amends it and D97; SPEC-W2 points 10, 28, 44a and 46 (N7, as amended); contracts/rulepack.schema.json with K7 and the two declarations L-content made last round (dso_on by the record, and each field''s document). engine/path.py and the pack reader under engine/: (1) N7: the typed-date questions become one per record and document kind, read from each field''s declared document (by the record where it depends on it), with id typed_dates.<record>.<kind> and an about naming each field typed from that document with its value; a record''s typed dates whose fields name no document are asked together, once with that record (typed_dates.<record>), also on a record whose other fields name one, and a fact''s typed date, which no pack has today, once with the facts (typed_dates.facts), never once per date; one answer confirms them all while those values stand and nothing contradicts them; a changed value or a contradiction asks that record and kind again; typed_dates.from_documents and the per-date questions go. What a question holds is N8, a later round''s: leave it as it is. (2) The D32 cases of tests/unit/engine/test_w2_r1_recommendation.py pass with dso_on as L-content declared it; where one fails on how the engine reads a none, fix that for every field, not for this one. Generic, nothing about F-1 in engine code. Make tests/unit/engine/test_w2_r1_checks.py, test_w2_r1_recommendation.py and test_w2_confirm_document.py pass, and list in your report every older test that collides.'
    done: bash -c 'uv run pytest tests/unit/engine/test_w2_r1_checks.py tests/unit/engine/test_w2_r1_recommendation.py tests/unit/engine/test_w2_confirm_document.py -q && uv run python -m tools.gates.engine_literals && uv run mypy && uv run ruff check engine && uv run ruff format --check engine'
  - lane: L-content
    agent: rulepack-drafter
    mission: 'DECISIONS.md D34, D35 and D98, and what the founder lane committed under rulepacks/f1-us/v2026.09 before this plan: the eCFR versions list and a point-in-time copy at each version date under sources/, and the newest recheck-<day>.json. (1) For every row of the F-1 pack whose effective_from_basis is earliest_saved_copy and whose source is an eCFR copy of 8 CFR 214.2, 8 CFR 214.1 or 22 CFR 41.112: find the earliest saved copy of that section from which every later saved copy, up to the row''s own (the copy its snapshot names), holds the row''s quote word for word, read with the plain() of tools.sources.verify; copies after the row''s own are not read, since the ds_2012 rows lose their words in the 2026-09-15 text; set effective_from to that copy''s date, keep the basis earliest_saved_copy (the rule may be older still), and say in the source note which copies were read. Where the words differ in an earlier copy, the row starts no earlier than the first copy that holds them, and the report names the row and the copy; an event before a row''s first day still goes to the DSO. One CHANGELOG line per row moved. (2) Where the newest recheck file shows a saved copy fetched again and unchanged, move that rule''s checked_on to that day, and nowhere else (D98), under SPEC-FEED points 16 and 55: a pinned eCFR copy always comes back the same, so for one the recheck''s versions list must also name no version of the section later than the newest one the pack already records as read (8 CFR 214.2: 2026-09-30, in the ds_2012 note); where it names one, no rule on that section moves and your report names that version for the founder. The litigated regime''s checked_on moves only with the founder''s sign-off on the docket (point 55). tools.sources.recheck --check does not read the versions list (reviews/feed-pa.md note 5), so your report says what it showed for each section. No value, quote, status or regime moves. Work from the saved copies only; fetch nothing. Make tests/unit/engine/test_w2_r1_copies.py pass.'
