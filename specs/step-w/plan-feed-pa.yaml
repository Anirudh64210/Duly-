branch: step-w
spec: specs/step-w/SPEC-FEED.md
goal: 'Move the 2026-10-06 cliff: every F-1 rule whose source the 2026-10-02 fetch backs carries that day as checked_on, so the installed app keeps giving dates instead of Can''t tell yet for about another week, while the feed is built. Nothing is assumed: a checked_on moves only where rulepacks/f1-us/v2026.09/recheck-2026-10-02.json backs it. SPEC-FEED point 55 (FEED-PA), D88, D89.'
merge: local
audited: false
rounds:
- name: content
  lanes:
  - lane: L-content
    agent: rulepack-drafter
    mission: 'SPEC-FEED point 55, the L-content line, editing rulepacks/f1-us/v2026.09 in place. Read recheck-2026-10-02.json and sources/recheck-2026-10-02/. (1) Move checked_on to 2026-10-02 for every parameter and regime whose saved copy came back the same, or came back changed with its quote still found in the new copy; where the copy changed, save the new copy under sources/ with its own name and record its snapshot and snapshot_sha256 (the Study in the States OPT page: same text, new markup). (2) 5 USC 6103 and 31 USC 1102: uscode.house.gov served another page; the govinfo.gov copies in sources/recheck-2026-10-02/ hold every quote; move those rules to them (url, citation naming the 2024 edition, snapshot, sha256), keep the old copies, and say why in SOURCES.md. (3) Record eCFR version 2026-09-30 of 8 CFR 214.2 and that paragraph (f) is identical to 2026-09-15 (copy in sources/recheck-2026-10-02/). (4) Record the appeal in the fixed_admission_2026 regime history from the docket listing fetched 2026-10-02: ECF 53 notice of appeal, ECF 54, ECF 55 First Circuit case 26-2112, all 2026-09-30, no stay entry; correct claim 2 of SOURCES.md, which says no appeal was found. The founder signed off on the docket (D90, accepting SPEC-FEED point 69; the listing fetched 2026-10-02 shows the appeal and no stay): keep legal_status enjoined and operative false, and move the regime''s checked_on to 2026-10-02. Any other change of status or tag is proposed in your REPORT, never made. (5) Add the 2026-10-02 fetch to SOURCES.md and the CHANGELOG. Your kept work on your lane branch already holds most of this: carry it forward. Since your last attempt tools/sources/recheck.py also matches a rule to a fetch by snapshot_sha256, and a second fetch on 2026-10-02 recorded the govinfo.gov copies and sources/sits-f1-opt-2026-10-02.html as fetched and the same, so those rules can name those copies and carry 2026-10-02. A rule the fetch does not back keeps its date and is listed in your REPORT. No number changes.'
    done: bash -c 'uv run python -m tools.sources.verify rulepacks && uv run python -m tools.sources.plain rulepacks --require f1 && uv run python -m tools.sources.recheck --check rulepacks/f1-us/v2026.09 && uv run python -c "from engine.rulepack import load_all; p=next(x for x in load_all() if x.category==\"f1\"); assert p.rules_checked_on.isoformat() >= \"2026-10-02\", p.rules_checked_on" && uv run pytest tests/unit/engine -q'
  - lane: L-pipeline
    agent: builder
    mission: 'SPEC-FEED point 55, the L-pipeline line: write the appeal as one update draft in pipeline/drafts/ following the law-update-claim skill: the government filed a notice of appeal (ECF 53, 2026-09-30) from the 2026-09-14 order in Presidents Alliance v. DHS, No. 1:26-cv-13799 (D. Mass.), First Circuit case 26-2112; the docket shows no stay; the order stays in force. Primary source and quote from the docket listing saved in rulepacks/f1-us/v2026.09/sources/recheck-2026-10-02/. It stays a draft: never in pipeline/published/ (that folder is bundled into the app) until the founder approves the wording. Information only: no words addressed to the student, nothing about what anyone should do (BOUNDARY.md).'
    done: bash -c 'grep -rlq "26-2112" pipeline/drafts && uv run pytest tests/unit/pipeline -q'
  checks:
  - name: sources
    run: uv run python -m tools.sources.verify rulepacks
- name: review
  lanes:
  - lane: L-review
    agent: reviewer
    mission: 'Review FEED-PA (SPEC-FEED point 55) against PRINCIPLES.md, BOUNDARY.md and CLAUDE.md. Try hardest to find a checked_on that moved without the 2026-10-02 fetch backing it (rerun tools.sources.recheck --check, and check by hand that each moved rule''s quote is in the copy it now names), a number that changed, a regime status changed without the founder, and words in the update draft that address the student or tell anyone what to do. Write reviews/feed-pa.md and reviews/REVIEW.json.'
    done: bash -c 'grep -Eq "^(APPROVE|VETO)$" reviews/feed-pa.md && test -f reviews/REVIEW.json'
- name: audit
  lanes:
  - lane: L-audit
    agent: auditor
    mission: 'Audit FEED-PA as your role file describes. Write docs/requirements/audits/feed-pa.md.'
    done: bash -c 'test -f docs/requirements/audits/feed-pa.md && uv run python -m tools.requirements.register check'
