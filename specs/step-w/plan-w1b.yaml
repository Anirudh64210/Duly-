branch: step-w
spec: specs/step-w/SPEC-W1.md
goal: 'Duly installs and opens like Slack on the founder''s Mac: the engine bundled inside the app, talking over a private socket only Duly can open, packaged, hardened and signed for this Mac. No cloud. The engine entrypoint lands first, then the desktop shell resumes from its saved work, then everything is reconciled.'
merge: local
audited: false
rounds:
- name: engine
  lanes:
  - lane: L-api
    agent: builder
    mission: 'SPEC-W1 section 1 and the engine side of section 2: api/desktop_main.py, api/local_routes.py, and api/main.py mounting local_routes with nothing else changed. Your work is on lane/L-api/l-api-8e3626eddf: bring it in (git merge lane/L-api/l-api-8e3626eddf). Your own Bash sandbox refuses Unix sockets by design (allowing them there would expose system sockets), so the 11 socket tests cannot run for you; the orchestrator runs the done command in its jail, which allows a socket inside the worktree. Do not escalate for that: finish, report done, and fix whatever the jail run reports.'
    done: bash -c 'uv run pytest tests/unit/desktop_entry/test_desktop_main.py tests/unit/api/test_compute_generic.py tests/unit/acceptance/test_journeys.py -q -p no:cacheprovider && uv run mypy && uv run ruff check api && uv run ruff format --check api'
- name: desktop
  lanes:
  - lane: L-desktop
    agent: builder
    mission: 'Your SPEC-W1 sections 2 to 6 work is on lane/L-desktop/l-desktop-241886e510: bring it in (git merge lane/L-desktop/l-desktop-241886e510). The engine files it needed (api/desktop_main.py, api/local_routes.py) are now on this branch, the copy lint is clean, and desktop/python/runtime.json now pins the stripped asset as SPEC-W1 point 12 says. Your manifest order fix (write the manifest again after signing the runtime) is accepted for the review to confirm. Finish and pass.'
    done: bash -c 'npm run typecheck -w desktop && npm test -w desktop && npx eslint desktop --max-warnings 0 && uv run python -m tools.copy_lint.lint && bash -n desktop/scripts/build-python.sh && bash -n desktop/scripts/sign-adhoc.sh && uv run pytest tests/unit/desktop_entry/test_bundle_inputs.py -q -p no:cacheprovider'
- name: reconcile
  lanes:
  - lane: L-tests
    agent: test-author
    mission: 'Bring every test in tests/unit and tests/holdout in line with SPEC-W1 (the desktop entrypoint, the socket, the mounted local routes); write the SPEC-W1 point beside each change; never loosen an assertion; escalate any failure no point explains.'
    done: bash -c 'uv run ruff check tests && uv run ruff format --check tests && uv run pytest tests/unit tests/holdout -q -p no:cacheprovider --ignore=tests/unit/tools'
  checks:
  - name: offline gates
    run: make test-offline BASE=work/product-2
