branch: step-w
spec: specs/step-w/SPEC-W2.md
goal: 'Clear the second W2-P1 review veto (reviews/w2-p1.md, re-review): a gap or an unreadable date in one record never removes another record''s known deadline, and the record left undecided is asked about by name. The fix is for the class, in the engine, with nothing about F-1 in code. W2-P1, SPEC-W2 points 45 and 46.'
merge: local
audited: false
rounds:
- name: tests
  lanes:
  - lane: L-tests
    agent: test-author
    mission: 'Read reviews/w2-p1.md (the re-review). Write tests in tests/unit/engine/test_w2_windows.py, and twins in tests/holdout/test_holdout_w2.py, for blocking finding 1 with the review''s inputs S1, O1 and S2: in each, the record whose facts are all known keeps every window it had (w2''s new Form I-983 and report windows 2026-08-03 to 2026-08-13; w1''s report window 2026-07-01 to 2026-07-11), and the undecided record is asked about by name (a question naming its missing field), the verdict cannot_tell; an unreadable date such as 2026-13-40 or 08/03/2026 in the undecided record gives a reason naming that record and field, never silence. Add a test with two records under one selection, one decided and one not. Finding 2: the end_date_change case with no change, which must ask missing:x1.change (kills mutant M9). Work every date by hand in the comment. They cannot pass yet.'
    done: bash -c 'uv run ruff check tests && uv run ruff format --check tests && uv run pytest tests/unit/engine/test_w2_windows.py --co -q >/dev/null'
- name: engine
  lanes:
  - lane: L-engine
    agent: builder
    mission: 'Read reviews/w2-p1.md (the re-review), finding 1: engine/path.py _select keeps the records whose where condition is decided and reports the undecided ones; run_stages enters every decided record and asks about each undecided one by the fields it read; a field that is present but unreadable (a date that does not parse) gives a reason naming the record and field, and asks it again. Generic, nothing about F-1 in engine code. Finding 3: engine/rulepack.py reads the settings file once per pack load, not once per setting node. Make every test in tests/unit/engine and the journeys pass.'
    done: bash -c 'uv run pytest tests/unit/engine tests/unit/acceptance/test_journeys.py -q && uv run python -m tools.gates.engine_literals && uv run mypy && uv run ruff check engine && uv run ruff format --check engine'
  checks:
  - name: hidden tests
    run: uv run pytest tests/holdout -q
- name: reconcile
  lanes:
  - lane: L-tests
    agent: test-author
    mission: 'Bring every test in tests/unit and tests/holdout in line with the W2-P1 re-review fixes (reviews/w2-p1.md); write the finding beside each change; never loosen an assertion; escalate any failure no finding explains.'
    done: bash -c 'uv run ruff check tests && uv run ruff format --check tests && uv run pytest tests/unit tests/holdout -q -p no:cacheprovider --ignore=tests/unit/tools'
  - lane: L-web
    agent: builder
    mission: 'Run make samples from the repository root, commit what it changes under web/samples, and make npm test -w web pass, changing only tests the W2-P1 re-review fixes require, with the finding beside each.'
    done: bash -c 'make samples && npm test -w web && npm test -w desktop'
  checks:
  - name: offline gates
    run: make test-offline BASE=work/product-2
- name: review
  lanes:
  - lane: L-review
    agent: reviewer
    mission: 'Re-review W2-P1 a third time: everything plan-w2-p1.yaml, plan-w2-p1-fix.yaml and plan-w2-p1-fix2.yaml changed, against SPEC-W2 points 45, 46 and 49, PRINCIPLES.md, BOUNDARY.md and your findings in reviews/w2-p1.md. Rerun your inputs S1, O1 and S2 and every mutant, and try hardest to find any other way one record''s gap removes another record''s deadline, or any gap that is not asked. Write reviews/w2-p1.md and reviews/REVIEW.json.'
    done: bash -c 'grep -Eq "^(APPROVE|VETO)$" reviews/w2-p1.md && test -f reviews/REVIEW.json'
- name: audit
  lanes:
  - lane: L-audit
    agent: auditor
    mission: 'Audit W2-P1 (plan-w2-p1.yaml, plan-w2-p1-fix.yaml and plan-w2-p1-fix2.yaml) as your role file describes. Write docs/requirements/audits/w2-p1.md.'
    done: bash -c 'test -f docs/requirements/audits/w2-p1.md && uv run python -m tools.requirements.register check'
