branch: step-w
spec: specs/step-w/SPEC-W2.md
goal: 'Undo the over-withholding the hidden gap property found after the W2-P2 records round: a span''s order conflict is decided only by dates the person entered, so a trip with its return left out still shows the windows that rest on its departure, and the return is asked (D92). SPEC-W2 point 46; SPEC-W2-UNKNOWN''s rules on span conflicts and on showing an output when every value agrees.'
