branch: phase-2
spec: specs/phase-2/SPEC-fixes.md
rounds:
  - name: F1
    lanes:
      - lane: L-tests
        agent: test-author
        slug: fixes
        mission: >
          Write the tests described in the SPEC for findings 1, 2, 4, 5 and 7. Read
          reviews/phase-2.md for the exact inputs the reviewer used and turn each into a test.
          Read tests/PROGRESS.md first. The new tests cannot pass yet; that is expected.
        done: >-
          bash -c 'grep -rq "latest_start_after_days" tests/support/f1_pack.py
          && grep -rqi "nan" tests/unit/api && grep -rq "operative" tests/unit/engine
          && uv run ruff check tests && uv run ruff format --check tests'
        max_iterations: 3
      - lane: L-content
        agent: rulepack-drafter
        slug: fixes
        mission: >
          Find and source the two rules under "Finding 5" in the SPEC, with a row under each
          regime where the texts differ. Read rulepacks/PROGRESS.md first.
        done: >-
          bash -c 'uv run python -m tools.sources.verify rulepacks
          && uv run pytest tests/unit/engine/test_rulepack.py -q
          && grep -q "opt.latest_start_after_days" rulepacks/f1-us/v2026.09/parameters.yaml'
        max_iterations: 3
    checks:
      - { name: "sources: every quote found", run: "uv run python -m tools.sources.verify rulepacks" }
  - name: F2
    lanes:
      - lane: L-engine
        agent: builder
        slug: fixes
        mission: >
          Do the engine work for findings 1, 2, 4, 5 and 7 in the SPEC. Read engine/PROGRESS.md
          and reviews/phase-2.md first. The tests are your target and you cannot edit them.
        done: >-
          bash -c 'uv run pytest tests/unit/engine -q && uv run python -m tools.gates.engine_literals
          && uv run mypy && uv run ruff check engine && uv run ruff format --check engine'
        max_iterations: 5
    checks:
      - { name: "engine tests", run: "uv run pytest tests/unit/engine -q" }
  - name: F3
    lanes:
      - lane: L-api
        agent: builder
        slug: fixes
        mission: >
          Do the api work for findings 2 and 4 in the SPEC. Read api/PROGRESS.md and
          reviews/phase-2.md first. The tests are your target and you cannot edit them.
        done: >-
          bash -c 'uv run pytest tests/unit/api -q && uv run mypy
          && uv run ruff check api && uv run ruff format --check api'
        max_iterations: 4
      - lane: L-web
        agent: builder
        slug: fixes
        mission: >
          Do the screen work for finding 7 in the SPEC, and follow the renamed item in finding
          5. Read web/PROGRESS.md and reviews/phase-2.md first. Regenerate the api types.
        done: >-
          bash -c 'npm run typecheck -w web && npm test -w web
          && npx eslint web --max-warnings 0
          && npx prettier --check "web/**/*.{ts,tsx,css,html,json}"
          && uv run python -m tools.copy_lint.lint'
        max_iterations: 4
    checks:
      - { name: "gates 1 to 6", run: "make test BASE=main" }
      - { name: "hidden tests", run: "uv run pytest tests/holdout -q" }
      - { name: "every engine number has a source", run: "uv run python -m tools.gates.engine_literals" }
      - { name: "sources: every quote found", run: "uv run python -m tools.sources.verify rulepacks" }
  - name: F4
    lanes:
      - lane: L-review
        agent: reviewer
        slug: second
        mission: >
          Second review. Read reviews/phase-2.md, your first review. Review everything on this
          branch that is not on main against specs/phase-2/SPEC.md, SPEC-sourcing.md,
          SPEC-fixes.md, BOUNDARY.md and CLAUDE.md. Run each input from your first review
          again and say whether each finding is closed. Look for new problems with fresh
          eyes. Finding 6 waits for a founder decision; report it as open, not as blocking.
          Write reviews/phase-2-second.md, ending with APPROVE or VETO on its own line.
        done: bash -c 'grep -Eq "^(APPROVE|VETO)$" reviews/phase-2-second.md'
        max_iterations: 2
    checks:
      - { name: "reviewer approved", run: "grep -Eq '^APPROVE$' reviews/phase-2-second.md" }
