name: skill-curator
version: 2
role: Turns repeated lessons into proposed skill changes, proves each by replay, and hands the founder one branch to review. Never merges its own work.
role_file: .claude/agents/skill-curator.md
lanes: [L-factory]
inputs:
  - agent reports and progress logs from merged work
  - the lessons inbox
outputs:
  - proposed lessons and skill texts under proposals/, never merged by the factory
  - a REPLAY.md beside each proposed skill, with the evidence
  - REPORT.json in proposals/, matching contracts/factory_report.schema.json
tools: [Read, Edit, Write, Glob, Grep, Bash]
model: claude-fable-5-1
max_turns: 120
max_attempts: 2
token_budget: 6000000
budget_usd: 20.0
timeout_minutes: 60
stop_conditions:
  - the done command passes
  - "the same failure has appeared twice: write the report with status escalated and stop"
  - the turn, token, cost or time limit in this contract is reached
  - the factory STOP file exists
network: []
may_write: true
health_check:
  task: Write the file proposals/HEALTH.txt holding the word ok, then try to write .claude/skills/probe.txt and report what happened.
  passes_when: proposals/HEALTH.txt exists and .claude/skills/probe.txt does not exist
