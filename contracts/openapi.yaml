openapi: 3.1.0
info:
  title: Duly API
  version: 0.1.0
  description: Health, version, stack status, the stateless computations and schedule, and approved law updates.
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: The api process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /version:
    get:
      operationId: getVersion
      responses:
        "200":
          description: Build and contract versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
  /v1/status:
    get:
      operationId: getStatus
      responses:
        "200":
          description: Stack status and the verdict for an empty case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /v1/compute/f1:
    post:
      operationId: computeF1
      description: >
        Stateless. Computes dates and counts for an F-1 case from the dates the user
        entered. Nothing is stored. The request body follows contracts/case_f1.schema.json
        and the response follows contracts/engine_output.schema.json.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Engine output.
          content:
            application/json:
              schema:
                type: object
        "422":
          description: The case does not match the contract.
  /v1/compute:
    post:
      operationId: compute
      description: >
        Stateless. Computes dates and counts for a case of any category, from the facts and
        records the person entered. Nothing is stored and nothing from the body is logged.
        The request body follows contracts/case.schema.json and the response follows
        contracts/engine_output.schema.json. It gives the same refusals as /v1/compute/f1
        (NOT_A_NUMBER, NOT_JSON, NOT_YET, and first_problem for a case that does not match),
        and CASE_STRUCTURE for a case whose structure the pack refuses. Only structure is
        refused: a value the person typed is read against the pack's declared kind, and one
        that cannot be read is asked, never refused. A category whose pack has no path gives
        cannot_tell with category_not_covered:<id>.
        /v1/compute/f1 stays, and translates its case into this one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A case that follows contracts/case.schema.json.
      responses:
        "200":
          description: Engine output, following contracts/engine_output.schema.json.
          content:
            application/json:
              schema:
                type: object
        "422":
          description: >
            The case is refused, before any date is computed. The detail is one of:
            NOT_JSON (the body is not JSON); NOT_A_NUMBER (a number is NaN, Infinity or too large to hold);
            first_problem's words (the case does not match contracts/case.schema.json; they
            name the schema path); NOT_YET (an answer is dated after the person's own day);
            CASE_STRUCTURE (the pack refuses the case's structure: a category, record kind,
            field or fact it does not declare, two records with one id, a record id that does
            not match its kind's id_prefix, or more records of a kind than its max_records).
            The CASE_STRUCTURE words are plain and never repeat what was sent.
  /v1/schedule:
    post:
      operationId: schedule
      description: >
        Stateless. Dates the Loop module's timers, reminders and check-ins: each request
        names a base (an engine item of the case, a date the person typed, or today), an
        offset in days, business days, months or a product setting, a sign, and optionally
        an item that caps it. The engine computes the case as /v1/compute does, works out
        each date and its days_away, and gives null with the reason when a base or a cap has
        no date, never a guess. Nothing is stored and nothing from the body is logged. The
        request and the response follow contracts/schedule.schema.json ($defs request and
        response).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "schedule.schema.json#/$defs/request"
      responses:
        "200":
          description: One date for each request, in the order sent.
          content:
            application/json:
              schema:
                $ref: "schedule.schema.json#/$defs/response"
        "422":
          description: >
            The body does not match the contract, or the pack refuses the structure of the
            case (CASE_STRUCTURE, as /v1/compute gives it). The body names the first problem.
  /v1/updates:
    get:
      operationId: getUpdates
      description: >
        Approved law updates only: those for which publish_blockers returns nothing. Each
        follows contracts/update.schema.json. Matching reads the categories, stage ids and
        field ids sent in the query, never a value the person entered.
      parameters:
        - name: categories
          in: query
          required: false
          description: The categories of the case, such as f1. Absent means no update is matched.
          schema:
            type: array
            items: { type: string, pattern: "^[a-z0-9]+$" }
          style: form
          explode: false
        - name: stages
          in: query
          required: false
          description: The stage ids in the case's engine output.
          schema:
            type: array
            items: { type: string, pattern: "^[a-z0-9_.]+$" }
          style: form
          explode: false
        - name: fields
          in: query
          required: false
          description: The fact ids and record field ids the case holds a value for. Names only.
          schema:
            type: array
            items: { type: string, pattern: "^[a-z0-9_.]+$" }
          style: form
          explode: false
      responses:
        "200":
          description: The approved updates, and how many match the case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Updates"
  /ops/v1/status:
    get:
      operationId: getOpsStatus
      responses:
        "200":
          description: Ops status. Only served to allowed network addresses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsStatus"
        "403":
          description: The caller's network address is not on the allowlist.
components:
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok: { type: boolean }
    Version:
      type: object
      additionalProperties: false
      required: [api, contracts]
      properties:
        api: { type: string }
        contracts: { type: string }
    RulepackRef:
      type: object
      additionalProperties: false
      required: [category, version, parameters]
      properties:
        category: { type: string }
        version: { type: string }
        parameters: { type: integer }
        rules_checked_on:
          type: [string, "null"]
          format: date
          description: The oldest checked_on among the pack's rules; null for a pack with no rules.
    Status:
      type: object
      additionalProperties: false
      required: [database, rulepacks, verdict, checked_at]
      properties:
        database: { type: string, enum: [ok, unreachable] }
        rulepacks:
          type: array
          items: { $ref: "#/components/schemas/RulepackRef" }
        verdict:
          type: object
          additionalProperties: false
          required: [state, reasons]
          properties:
            state: { type: string, enum: [no_open_items, needs_you, talk_to_dso, cannot_tell] }
            reasons: { type: array, items: { type: string } }
        checked_at: { type: string, format: date-time }
    Updates:
      type: object
      additionalProperties: false
      required: [matching, updates]
      properties:
        matching:
          type: integer
          minimum: 0
          description: The number of updates that match the case.
        updates:
          type: array
          items: { $ref: "#/components/schemas/ApprovedUpdate" }
    ApprovedUpdate:
      type: object
      additionalProperties: false
      required: [update, matched]
      properties:
        update:
          type: object
          description: An approved update, following contracts/update.schema.json.
        matched:
          type: object
          additionalProperties: false
          required: [stages, fields]
          description: What in the case this update matched. Both empty when it matched none.
          properties:
            stages: { type: array, items: { type: string } }
            fields: { type: array, items: { type: string } }
    OpsStatus:
      type: object
      additionalProperties: false
      required: [caller, allowlist]
      properties:
        caller: { type: string }
        allowlist: { type: array, items: { type: string } }
