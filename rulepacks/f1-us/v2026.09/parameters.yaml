    regime: ds_2012
    effective_from: 2026-09-14
    effective_from_basis: earliest_saved_copy
    source: {citation: '8 CFR 214.2(f)(7)(iv), text of 2026-09-14', url: 'https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2', checked_on: 2026-10-02, quote: A DSO may grant a program extension only by updating SEVIS and issuing a new Form I-20 or successor form reflecting the current program end date., snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml, snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690}
    derivation: verbatim
    note: No saved rule document older than the point-in-time text of 2026-09-14 carries these exact words, so the start date is the date of that saved copy (effective_from_basis earliest_saved_copy). The rule may be older; an event before this day goes to the DSO. Words checked in the 2026-09-14 text on 2026-09-29. The 2026-09-15 text, as amended by 91 FR 44976, rewrites this paragraph, so the row is recorded under the regime ds_2012 and tagged litigated. The 2026-09-15 text has no such sentence, so no row is recorded under fixed_admission_2026.
    plain: Under the rule in force today, a DSO grants a program extension by updating SEVIS and issuing a new Form I-20. The new form shows the current program end date.
    plain_terms: [program extension, program end date]
  - id: travel.absence_months
    value: 5
    unit: months
    status: settled
    effective_from: 2026-09-14
    effective_from_basis: earliest_saved_copy
    source: {citation: 8 CFR 214.2(f)(4), url: 'https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2', checked_on: 2026-10-02, quote: An F-1 student returning to the United States from a temporary absence of five months or less may be readmitted for attendance at an SEVP-certified educational institution, snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml, snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690}
    derivation: verbatim
    note: No saved rule document older than the point-in-time text of 2026-09-14 carries these exact words, so the start date is the date of that saved copy (effective_from_basis earliest_saved_copy). The rule may be older; an event before this day goes to the DSO. Words checked in the 2026-09-14 text and in the 2026-09-15 text on 2026-09-29; both carry them, so the rule sits under no regime. The source writes the number as the word five. The sentence goes on to list the Form I-20 the student presents.
    plain: An F-1 student coming back to the United States from a temporary absence of five months or less may be readmitted. This is to attend an SEVP-certified school, with the papers the rule lists.
    plain_terms: [temporary absence]
  - id: travel.updated_i20
    value: true
    unit: flag
    status: settled
    effective_from: 2026-09-14
    effective_from_basis: earliest_saved_copy
    source: {citation: 8 CFR 214.2(f)(4)(ii), url: 'https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2', checked_on: 2026-10-02, quote: An updated Form I-20 or successor form if there has been a substantive change in the information on the student's most recent Form I-20 or successor form, snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml, snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690}
    derivation: verbatim
    note: 'The quote is one of the two things a returning student may present under (f)(4). The paragraph goes on with examples: a student who has changed the major area of study, who intends to transfer, or who has advanced to a higher level. No saved rule document older than the point-in-time text of 2026-09-14 carries these exact words, so the start date is the date of that saved copy (effective_from_basis earliest_saved_copy). The rule may be older; an event before this day goes to the DSO. Words checked in the 2026-09-14 text and in the 2026-09-15 text on 2026-09-29; both carry them, so the rule sits under no regime.'
    plain: After a substantive change in the facts on the latest Form I-20, a returning student presents an updated Form I-20. A new major, a planned transfer and a move to a higher level are examples.
    plain_terms: [substantive change]
  - id: travel.opt_signature_months
    value: 6
    unit: months
    status: settled
    effective_from: 2016-05-10
    source: {citation: 8 CFR 214.2(f)(13)(ii), url: 'https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2', checked_on: 2026-10-02, quote: endorsed for reentry by the DSO within the last six months, snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml, snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690}
    derivation: verbatim
    note: The sentence says the EAD must be used in combination with a Form I-20 or successor form endorsed for reentry by the DSO within the last six months, for a student on post-completion practical training who returns after a temporary absence. Start date from 81 FR 13040 (FR Doc. 2016-04828), effective 2016-05-10, saved as sources/fr-2016-04828.xml, which carries the same words. Words checked in the 2026-09-14 text and in the 2026-09-15 text on 2026-09-29; both carry them, so the rule sits under no regime. The source writes the number as the word six.
    plain: A student on post-completion training who comes back uses the EAD with a Form I-20. The Form I-20 must be endorsed for reentry by the DSO within the last six months.
    plain_terms: [endorsed for reentry]
  - id: grace.withdrawal_days
