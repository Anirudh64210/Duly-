    note: "Not operative. 2026-09-15 is the effective date stated in 91 FR 44976, saved as sources/fr-2026-14439.xml. A court postponed that date on 2026-09-14; see the regime. The SPEC pointed to (f)(5); the paragraph in the 2026-09-15 text is (f)(5)(v). On 2026-09-29 the quote was widened to the words or to otherwise seek to maintain lawful status. The sentence goes on to name, as part of that, timely filing an extension of stay application or a change of status application; those words are not in the quote. The period counts from one of three dates: the program end date, the 4 year maximum period of admission, or the end date of the approved employment authorization for post-completion OPT or STEM OPT, as applicable."
