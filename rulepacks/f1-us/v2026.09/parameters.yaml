  - id: stem.report_change_within_days
    value: 10
    unit: days
    status: settled
    effective_from: 2016-05-10
    source:
      citation: "8 CFR 214.2(f)(12)(ii)(A)"
      url: "https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2"
      checked_on: 2026-09-29
      quote: "Within 10 days of the change, the student must report to the student's DSO a change of legal name, residential or mailing address, employer name, employer address, and/or loss of employment."
      snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml
      snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690
    derivation: verbatim
    note: "The quote is the whole of paragraph (f)(12)(ii)(A), the first of the reporting obligations listed under (f)(12)(ii), headed Additional reporting obligations for students with an approved 24-month OPT extension. The 10 days apply to those students; for post-completion OPT the regulation, (f)(12)(i), states no number of days, and opt.report_employer_within_days is SEVP guidance (SPEC-resolutions point 50). Start date from 81 FR 13040 (FR Doc. 2016-04828), effective 2016-05-10, saved as sources/fr-2016-04828.xml, which carries the same sentence. Words checked in the 2026-09-14 text on 2026-09-29; the 2026-09-15 text has the same sentence, so the rule sits under no regime."
