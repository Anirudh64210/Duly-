    unit: days
    status: litigated
    regime: ds_2012
    effective_from: 2003-01-01
    source: {citation: '8 CFR 214.2(f)(5)(iv), text of 2026-09-14', url: 'https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2', checked_on: 2026-10-02, quote: An F-1 student authorized by the DSO to withdraw from classes will be allowed a 15-day period for departure from the United States., snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml, snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690}
    derivation: verbatim
    note: Start date from 67 FR 76256 (FR Doc. 02-31184), effective 2003-01-01, saved as sources/fr-02-31184.xml, which carries the same words. The rule may be older; this is the earliest rule document saved with the pack that carries them. Words checked in the 2026-09-14 text on 2026-09-29. The 2026-09-15 text, as amended by 91 FR 44976, rewrites this paragraph, so the row is recorded under the regime ds_2012 and tagged litigated. The 2026-09-15 text words it differently at (f)(5)(v), recorded under fixed_admission_2026.
