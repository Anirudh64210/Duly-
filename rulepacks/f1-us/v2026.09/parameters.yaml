              - {earliest_of: *stem_training_end}
          rule_ids: [stem.evaluation_interval_months, stem.evaluation_due_days, stem.reporting_required, stem.opportunity_ends_with_job, opt.ends_on_release_date, opt.ends_on_transfer_or_new_level]
    - id: grace
      label: "Time after the program ends"
      for_each:
        record: program
        where:
          - {field: this.state, in: [completed]}
          - none: {record: move, where: [{field: this.from_program, same_as: outer.id}]}
      entered_when: [this.end_date]
      rule_ids: [grace.after_completion_days]
      span:
        starts:
          day_after: true
          latest_of:
            - {fact: this.end_date, as_of: {fact: today}}
            - {optional: true, first: {of: {record: authorization, where: [{field: this.program, same_as: outer.id}, {field: this.type, in: [opt_post_completion, stem_extension]}]}, field: card_end, pick: latest}}
            - earliest_of:
                - {fact: this.end_date, as_of: {fact: today}}
                - first:
                    of:
                      record: program
                      where:
                        - {field: this.id, same_as: outer.id}
                        - none: {record: petition, where: [{field: this.change_of_status, in: ["yes"]}, &petition_may_extend_grace {any_of: [{all_of: [{field: this.validity_start, present: true}, {any_of: [{all_of: [{field: this.outcome, present: true}, {field: this.outcome, in: [approved]}]}, {field: this.requested_start, present: false}]}, {field: this.validity_start, on_or_after: {fact: outer.end_date, as_of: {fact: today}, day_after: true}}]}, {all_of: [{field: this.requested_start, present: true}, {not: {all_of: [{field: this.validity_start, present: true}, {field: this.outcome, present: true}, {field: this.outcome, in: [approved]}]}}, {field: this.requested_start, on_or_after: {fact: outer.end_date, as_of: {fact: today}, day_after: true}}]}, {all_of: [{field: this.validity_start, present: false}, {field: this.requested_start, present: false}, {any_of: [{all_of: [{field: this.outcome, present: true}, {field: this.outcome, in: [approved]}, {field: this.validity_start, on_or_after: {fact: outer.end_date, as_of: {fact: today}, day_after: true}}]}, {all_of: [{not: {all_of: [{field: this.outcome, present: true}, {field: this.outcome, in: [approved]}]}}, {field: this.requested_start, on_or_after: {fact: outer.end_date, as_of: {fact: today}, day_after: true}}]}]}]}]}, {field: this.filed_on, on_or_before: {fact: outer.end_date, as_of: {fact: today}, add: [{rule: grace.after_completion_days}]}}]}
                        - none: {record: authorization, where: [{field: this.program, same_as: outer.id}, {field: this.type, in: [opt_post_completion, stem_extension]}, {exists: {record: petition, where: [{field: this.change_of_status, in: ["yes"]}, *petition_may_extend_card, {field: this.filed_on, on_or_before: {fact: outer.card_end, add: [{rule: grace.after_completion_days}]}}]}}]}
                    field: end_date
                    pick: earliest
        ends:
          add: [{rule: grace.after_completion_days}]
          latest_of:
            - {fact: this.end_date, as_of: {fact: today}}
            - {optional: true, first: {of: {record: authorization, where: [{field: this.program, same_as: outer.id}, {field: this.type, in: [opt_post_completion, stem_extension]}]}, field: card_end, pick: latest}}
            - earliest_of:
                - {fact: this.end_date, as_of: {fact: today}}
                - first:
                    of:
                      record: program
                      where:
                        - {field: this.id, same_as: outer.id}
                        - none: {record: petition, where: [{field: this.change_of_status, in: ["yes"]}, *petition_may_extend_grace, {field: this.filed_on, on_or_before: {fact: outer.end_date, as_of: {fact: today}, add: [{rule: grace.after_completion_days}]}}]}
                        - none: {record: authorization, where: [{field: this.program, same_as: outer.id}, {field: this.type, in: [opt_post_completion, stem_extension]}, {exists: {record: petition, where: [{field: this.change_of_status, in: ["yes"]}, *petition_may_extend_card, {field: this.filed_on, on_or_before: {fact: outer.card_end, add: [{rule: grace.after_completion_days}]}}]}}]}
                    field: end_date
                    pick: earliest
    - id: withdrawal
      label: "Time after a withdrawal"
      for_each: {record: withdrawal, where: [{field: this.dso_authorized, in: ["yes"]}]}
      entered_when: [this.on]
      rule_ids: [grace.withdrawal_days]
      span:
        starts: {fact: this.on}
        ends: {fact: this.on, add: [{rule: grace.withdrawal_days}]}
    - id: trip
      label: "Trip abroad"
      for_each: {record: trip}
      entered_when: [this.left_on]
      rule_ids: [travel.absence_months, practical_training.study_abroad]
      span:
        starts: {fact: this.left_on}
        ends: {earliest_of: [{optional: true, fact: this.returned_on}, {fact: today}]}
    - id: opt_job_end
      label: "End of a job on post-completion OPT"
      for_each: {record: work, where: [{field: this.under.type, in: [opt_post_completion]}, {field: this.end, present: true}]}
      entered_when: [this.end]
      rule_ids: [opt.report_employer_within_days, opt.report_interruption]
      windows:
        - id: opt_job_end.report
          label: "Report of the change to the DSO"
          opens: {fact: this.end}
          closes: {fact: this.end, add: [{rule: opt.report_employer_within_days}]}
          rule_ids: [opt.report_employer_within_days, opt.report_interruption]
    - id: opt_job_start
      label: "Start of a job on post-completion OPT"
      for_each: {record: work, where: [{field: this.under.type, in: [opt_post_completion]}, {field: this.start, present: true}]}
      entered_when: [this.start]
      rule_ids: [opt.report_employer_within_days, opt.job_start_is_employment_change]
      windows:
        - id: opt_job_start.report
          label: "Report of the new employment information to the DSO"
          opens: {fact: this.start}
          closes: {fact: this.start, add: [{rule: opt.report_employer_within_days}]}
          rule_ids: [opt.report_employer_within_days, opt.job_start_is_employment_change]
    - id: stem_job_start
      label: "Start of a job with a new employer on a STEM OPT extension"
      for_each:
        record: work
        where:
          - {field: this.under.type, in: [stem_extension]}
          - {field: this.start, present: true}
          - {field: this.start, on_or_after: {fact: this.under.card_start}}
          - {field: this.employer, differs_from: this.under.employer}
      entered_when: [this.start]
      rule_ids: [stem.new_plan_due_days, stem.report_change_within_days, stem.reporting_required]
      windows:
        - id: stem_job_start.new_plan
          label: "New Form I-983 to the DSO"
          opens: {fact: this.start}
          closes: {fact: this.start, add: [{rule: stem.new_plan_due_days}]}
          rule_ids: [stem.new_plan_due_days, stem.reporting_required]
        - id: stem_job_start.report
          label: "Report of the new employer name and address to the DSO"
          opens: {fact: this.start}
          closes: {fact: this.start, add: [{rule: stem.report_change_within_days}]}
          rule_ids: [stem.report_change_within_days, stem.reporting_required]
    - id: stem_job_end
      label: "End of a job on a STEM OPT extension"
      for_each: {record: work, where: [{field: this.under.type, in: [stem_extension]}, {field: this.end, present: true}]}
      entered_when: [this.end]
      rule_ids: [stem.report_change_within_days, stem.reporting_required]
      windows:
        - id: stem_job_end.report
          label: "Report of the loss of employment to the DSO"
          opens: {fact: this.end}
          closes: {fact: this.end, add: [{rule: stem.report_change_within_days}]}
          rule_ids: [stem.report_change_within_days, stem.reporting_required]
        - id: stem_job_end.evaluation_final
          label: "Concluding evaluation"
          opens:
            first:
              of:
                record: work
                where: &stem_job_before_another
                  - {field: this.id, same_as: outer.id}
                  - field: this.end
                    on_or_before:
                      earliest_of:
                        - {fact: this.under.card_end}
                        - {optional: true, first: {of: {record: move, where: [{field: this.from_program, same_as: outer.under.program}]}, field: release_date, pick: earliest}}
                        - {optional: true, day_before: true, first: {of: {record: move, where: [{field: this.from_program, same_as: outer.under.program}, {field: this.to_program.level, differs_from: outer.under.program.level}]}, field: to_program.start_date, pick: earliest}}
                  - exists:
                      record: work
                      where:
                        - {field: this.under, present: true}
                        - {field: this.under, same_as: outer.under}
                        - any_of: [{field: this.end, present: false}, {field: this.end, after: {fact: outer.end}}]
                  - none: {record: petition, where: [{field: this.change_of_status, in: ["yes"]}, &petition_may_extend_job_card {any_of: [{all_of: [{field: this.validity_start, present: true}, {any_of: [{all_of: [{field: this.outcome, present: true}, {field: this.outcome, in: [approved]}]}, {field: this.requested_start, present: false}]}, {field: this.validity_start, on_or_after: {fact: outer.under.card_start}}]}, {all_of: [{field: this.requested_start, present: true}, {not: {all_of: [{field: this.validity_start, present: true}, {field: this.outcome, present: true}, {field: this.outcome, in: [approved]}]}}, {field: this.requested_start, on_or_after: {fact: outer.under.card_start}}]}, {all_of: [{field: this.validity_start, present: false}, {field: this.requested_start, present: false}, {any_of: [{all_of: [{field: this.outcome, present: true}, {field: this.outcome, in: [approved]}, {field: this.validity_start, on_or_after: {fact: outer.under.card_start}}]}, {all_of: [{not: {all_of: [{field: this.outcome, present: true}, {field: this.outcome, in: [approved]}]}}, {field: this.requested_start, on_or_after: {fact: outer.under.card_start}}]}]}]}]}, {field: this.filed_on, on_or_before: {fact: outer.end, add: [{rule: stem.evaluation_due_days}]}}]}
              field: end
              pick: earliest
          closes:
            add: [{rule: stem.evaluation_due_days}]
            first: {of: {record: work, where: *stem_job_before_another}, field: end, pick: earliest}
          rule_ids: [stem.evaluation_interval_months, stem.evaluation_due_days, stem.reporting_required, stem.opportunity_ends_with_job, opt.ends_on_release_date, opt.ends_on_transfer_or_new_level]
  checks:
    - id: program.opt_start_not_too_early
      for_each: {record: authorization, where: [{field: this.type, in: [opt_pre_completion, opt_post_completion]}]}
      holds:
        - {field: this.card_start, on_or_after: {fact: this.program.end_date, as_of: {fact: this.filed_on}, add: [{rule: product.opt_start_earliest_years_before_program_end, sign: -1}]}}
      rule_ids: [opt.post_completion_definition, opt.max_months]
    - id: program.end_on_or_after_today
      for_each: {record: program, where: [{field: this.where, in: [us_on_f1]}, {field: this.state, in: [in_progress]}]}
      holds:
        - {field: this.end_date, on_or_after: {fact: today}}
      rule_ids: [program.extension_before_end, program.extension_new_i20]
    - id: move.classes_begin_in_time
      for_each: {record: move}
      holds:
        - field: this.to_program.start_date
          on_or_before:
            earliest_of:
              - {optional: true, fact: this.release_date, add: [{rule: transfer.begin_within_months}]}
              - {fact: this.from_program.end_date, as_of: {fact: this.i20_issued_on}, add: [{rule: transfer.begin_within_months}]}
      rule_ids: [transfer.begin_within_months, change_of_level.transfer_procedure]
    - id: move.classes_resume_after_opt
      for_each: {record: move}
      only_if:
        - exists: {record: authorization, where: [{field: this.type, in: [opt_post_completion]}, {field: this.program, same_as: outer.from_program}]}
      holds:
        - field: this.to_program.start_date
          on_or_before:
            earliest_of:
              - {optional: true, fact: this.release_date, add: [{rule: transfer.opt_resume_within_months}]}
              - {first: {of: {record: authorization, where: [{field: this.type, in: [opt_post_completion]}, {field: this.program, same_as: outer.from_program}]}, field: card_end, pick: latest}, add: [{rule: transfer.opt_resume_within_months}]}
      rule_ids: [transfer.opt_resume_within_months]
    - id: transfer.new_dso_contacted_in_time
      for_each: {record: move, where: [{field: this.how, in: [transfer]}]}
      holds:
        - {field: this.contacted_new_dso_on, on_or_before: {fact: this.to_program.start_date, add: [{rule: transfer.contact_new_dso_within_days}]}}
      rule_ids: [transfer.contact_new_dso_within_days]
    - id: oncampus.ends_by_release
      for_each: {record: work, where: [{field: this.on_campus, present: true}]}
      only_if:
        - exists: {record: move, where: [{field: this.from_program, same_as: outer.on_campus}, {field: this.release_date, present: true}]}
      holds:
        - {field: this.end, on_or_before: {first: {of: {record: move, where: [{field: this.from_program, same_as: outer.on_campus}]}, field: release_date, pick: earliest}}}
      rule_ids: [oncampus.school_with_record]
    - id: end_date_change.asked_before_end
      for_each: {record: end_date_change, where: [{field: this.change, in: [extension]}]}
      holds:
        - {field: this.requested_on, on_or_before: {fact: this.old_end}}
      rule_ids: [program.extension_before_end]
    - id: cpt.starts_after_endorsement
      for_each: {record: authorization, where: [{field: this.type, in: [cpt]}]}
      holds:
        - {field: this.card_start, on_or_after: {fact: this.dso_on}}
      rule_ids: [cpt.after_endorsed_i20]
    - id: cpt.first_year_done
      for_each: {record: authorization, where: [{field: this.type, in: [cpt]}]}
      holds:
        - any_of:
            - {field: this.program.first_year_before_training, in: ["yes"]}
            - all_of:
                - {field: this.program.immediate_cpt, in: ["yes"]}
                - {field: this.program.level, in: [master, doctorate]}
      rule_ids: [practical_training.one_academic_year, cpt.graduate_immediate]
    - id: opt_pre.starts_after_first_year
      for_each: {record: authorization, where: [{field: this.type, in: [opt_pre_completion]}]}
      holds:
        - {field: this.card_start, on_or_after: {fact: this.program.first_year_done_on}}
      rule_ids: [opt.pre_completion_file_before_days, practical_training.one_academic_year]
    - id: opt_pre.ends_by_program_end
      for_each: {record: authorization, where: [{field: this.type, in: [opt_pre_completion]}]}
      holds:
        - {field: this.card_end, on_or_before: {fact: this.program.end_date, as_of: {fact: this.card_end}}}
      rule_ids: [opt.post_completion_definition]
    - id: opt_pre.part_time_hours
      for_each: {record: work, where: [{field: this.under.type, in: [opt_pre_completion]}, {field: this.under.time, in: [part_time]}]}
      holds:
        - {field: this.hours_per_week, at_most: {rule: opt.pre_completion_in_session_hours}}
      rule_ids: [opt.pre_completion_in_session_hours]
    - id: opt.months_at_level.part_time
      kind: judgement
      for_each: {record: authorization, where: [{field: this.type, in: [opt_pre_completion]}, {field: this.decision, in: [approved]}]}
      holds:
        - {field: this.time, in: [full_time]}
      rule_ids: [opt.part_time_pre_completion_counts, opt.max_months]
    - id: program.enrollment
      kind: judgement
      for_each: {record: program, where: [{field: this.where, in: [us_on_f1]}]}
      holds:
        - {field: this.full_course_each_term, in: ["yes"]}
        - {field: this.online_within_limit, in: ["yes"]}
      rule_ids: [enrollment.full_course_required, enrollment.online_limit, enrollment.online_language_program, enrollment.final_term_reduced_load]
    - id: opt_post.filed_in_window
      for_each: {record: authorization, where: [{field: this.type, in: [opt_post_completion]}]}
      holds:
        - {field: this.filed_on, on_or_after: {fact: this.program.end_date, as_of: {fact: this.filed_on}, add: [{rule: opt.apply_before_days, sign: -1}]}}
        - {field: this.filed_on, on_or_before: {fact: this.program.end_date, as_of: {fact: this.filed_on}, add: [{rule: opt.apply_after_days}]}}
      rule_ids: [opt.apply_before_days, opt.apply_after_days]
    - id: opt_post.card_fits_max_months
      for_each: {record: authorization, where: [{field: this.type, in: [opt_post_completion]}]}
      holds:
        - {field: this.card_end, before: {fact: this.card_start, add: [{rule: opt.max_months}]}}
      rule_ids: [opt.max_months]
    - id: opt_post.starts_after_program_end
      for_each: {record: authorization, where: [{field: this.type, in: [opt_post_completion]}]}
      holds:
        - {field: this.card_start, after: {fact: this.program.end_date, as_of: {fact: this.filed_on}}}
      rule_ids: [opt.post_completion_definition]
    - id: stem.extends_post_completion_opt
      for_each: {record: authorization, where: [{field: this.type, in: [stem_extension]}]}
      holds:
        - {field: this.extends.type, in: [opt_post_completion]}
      rule_ids: [stem.requires_post_completion_opt]
    - id: stem.filed_while_opt_in_force
      for_each: {record: authorization, where: [{field: this.type, in: [stem_extension]}]}
      only_if:
        - none: {record: petition, where: [{field: this.change_of_status, in: ["yes"]}, {any_of: [{all_of: [{field: this.validity_start, present: true}, {any_of: [{all_of: [{field: this.outcome, present: true}, {field: this.outcome, in: [approved]}]}, {field: this.requested_start, present: false}]}, {field: this.validity_start, on_or_after: {fact: outer.extends.card_start}}]}, {all_of: [{field: this.requested_start, present: true}, {not: {all_of: [{field: this.validity_start, present: true}, {field: this.outcome, present: true}, {field: this.outcome, in: [approved]}]}}, {field: this.requested_start, on_or_after: {fact: outer.extends.card_start}}]}, {all_of: [{field: this.validity_start, present: false}, {field: this.requested_start, present: false}, {any_of: [{all_of: [{field: this.outcome, present: true}, {field: this.outcome, in: [approved]}, {field: this.validity_start, on_or_after: {fact: outer.extends.card_start}}]}, {all_of: [{not: {all_of: [{field: this.outcome, present: true}, {field: this.outcome, in: [approved]}]}}, {field: this.requested_start, on_or_after: {fact: outer.extends.card_start}}]}]}]}]}]}
      holds:
        - {field: this.filed_on, on_or_before: {fact: this.extends.card_end}}
      rule_ids: [stem.requires_post_completion_opt, stem.apply_window_closes_rule]
    - id: stem.basis_program
      for_each: {record: authorization, where: [{field: this.type, in: [stem_extension]}]}
      holds:
        - {field: this.basis_program.where, in: [us_on_f1, us_other_status]}
        - {field: this.basis_program.level, in: [bachelor, master, doctorate]}
        - {field: this.basis_program.stem_list, in: [on_list]}
      rule_ids: [stem.requires.accreditation, stem.requires.dhs_approved_degree, stem.requires.degree_on_designated_list]
    - id: stem.basis_older_degree
      for_each: {record: authorization, where: [{field: this.type, in: [stem_extension]}]}
      only_if:
        - {field: this.basis_program, differs_from: this.extends.program}
      holds:
        - {field: this.basis_program.conferred_on, before: {fact: this.extends.program.coursework_done_on}}
        - {field: this.basis_program.conferred_on, on_or_after: {fact: this.dso_on, add: [{rule: stem.previous_degree_within_years, sign: -1}]}}
      rule_ids: [stem.requires.previously_obtained_degree, stem.previous_degree_within_years, stem.later_degree_not_basis]
    - id: stem.second_at_higher_level
      for_each: {record: authorization, where: [{field: this.type, in: [stem_extension]}]}
      only_if:
        - exists: {record: authorization, where: [{field: this.type, in: [stem_extension]}, {field: this.card_start, before: {fact: outer.card_start}}]}
      holds:
        - none: {record: authorization, where: [{field: this.type, in: [stem_extension]}, {field: this.card_start, before: {fact: outer.card_start}}, {not: {field: outer.basis_program.level, level_above: this.basis_program.level}}]}
      rule_ids: [stem.second_higher_level, levels.higher_order]
    - id: stem.training_plan_before_recommendation
      for_each: {record: authorization, where: [{field: this.type, in: [stem_extension]}, {field: this.dso_on, present: true}]}
      only_if:
        - exists: {record: report, where: [{field: this.type, in: [i983_new]}, {field: this.about, same_as: outer.id}]}
      holds:
        - exists: {record: report, where: [{field: this.type, in: [i983_new]}, {field: this.about, same_as: outer.id}, {field: this.made_on, on_or_before: {fact: outer.dso_on}}]}
      rule_ids: [stem.requires.training_plan]
    - id: stem.employer_in_e_verify
      kind: judgement
      for_each: {record: work, where: [{field: this.under.type, in: [stem_extension]}]}
      holds:
        - {field: this.employer.e_verify, in: ["yes"]}
      rule_ids: [stem.requires.employer_qualification]
    - id: capgap.trip_while_pending
      kind: judgement
      for_each: {record: trip}
      holds:
        - none:
            record: petition
            where:
              - {field: this.change_of_status, in: ["yes"]}
              - {field: this.filed_on, on_or_before: {fact: outer.left_on}}
              - any_of:
                  - {field: this.outcome, in: [pending]}
                  - {field: this.outcome_on, after: {fact: outer.left_on}}
      rule_ids: [capgap.travel_while_pending]
    - id: cap_gap.for_dso
      kind: judgement
      holds:
        - none:
            record: petition
            where:
              - {field: this.change_of_status, in: ["yes"]}
              - any_of:
                  - exists:
                      record: authorization
                      where:
                        - {field: this.type, in: [opt_post_completion, stem_extension]}
                        - {field: outer.filed_on, on_or_before: {fact: this.card_end, add: [{rule: grace.after_completion_days}]}}
                        - {any_of: [{all_of: [{field: outer.validity_start, present: true}, {any_of: [{all_of: [{field: outer.outcome, present: true}, {field: outer.outcome, in: [approved]}]}, {field: outer.requested_start, present: false}]}, {field: this.card_start, on_or_before: {fact: outer.validity_start}}]}, {all_of: [{field: outer.requested_start, present: true}, {not: {all_of: [{field: outer.validity_start, present: true}, {field: outer.outcome, present: true}, {field: outer.outcome, in: [approved]}]}}, {field: this.card_start, on_or_before: {fact: outer.requested_start}}]}, {all_of: [{field: outer.validity_start, present: false}, {field: outer.requested_start, present: false}]}]}
                  - exists:
                      record: program
                      where:
                        - {field: this.state, in: [completed]}
                        - none: {record: move, where: [{field: this.from_program, same_as: outer.id}]}
                        - {field: outer.filed_on, on_or_before: {fact: this.end_date, as_of: {fact: today}, add: [{rule: grace.after_completion_days}]}}
                        - {any_of: [{all_of: [{field: outer.validity_start, present: true}, {any_of: [{all_of: [{field: outer.outcome, present: true}, {field: outer.outcome, in: [approved]}]}, {field: outer.requested_start, present: false}]}, {field: this.end_date, before: {fact: outer.validity_start}}]}, {all_of: [{field: outer.requested_start, present: true}, {not: {all_of: [{field: outer.validity_start, present: true}, {field: outer.outcome, present: true}, {field: outer.outcome, in: [approved]}]}}, {field: this.end_date, before: {fact: outer.requested_start}}]}, {all_of: [{field: outer.validity_start, present: false}, {field: outer.requested_start, present: false}]}]}
      rule_ids: [capgap.petition_for_dso]
    - id: withdrawal.dso_authorized
      kind: judgement
      for_each: {record: withdrawal}
      holds:
        - {field: this.dso_authorized, in: ["yes"]}
      rule_ids: [grace.withdrawal_days]
    - id: trip.back_within_absence_limit
      for_each: {record: trip, where: [{field: this.returned_on, present: true}]}
      holds:
        - {field: this.returned_on, on_or_before: {fact: this.left_on, add: [{rule: travel.absence_months}]}}
      rule_ids: [travel.absence_months]
    - id: trip.signature_for_opt_return
      for_each: {record: trip, where: [{field: this.returned_on, present: true}]}
      only_if:
        - exists: {record: authorization, where: [{field: this.type, in: [opt_post_completion, stem_extension]}, {field: this.card_start, on_or_before: {fact: outer.returned_on}}, {field: this.card_end, on_or_after: {fact: outer.returned_on}}]}
      holds:
        - {field: this.signature_on, on_or_after: {fact: this.returned_on, add: [{rule: travel.opt_signature_months, sign: -1}]}}
        - {field: this.signature_on, on_or_before: {fact: this.returned_on}}
      rule_ids: [travel.opt_signature_months]
    - id: trip.job_on_return
      kind: judgement
      for_each: {record: trip, where: [{field: this.returned_on, present: true}]}
      only_if:
        - exists: {record: authorization, where: [{field: this.type, in: [opt_post_completion, stem_extension]}, {field: this.card_start, on_or_before: {fact: outer.returned_on}}, {field: this.card_end, on_or_after: {fact: outer.returned_on}}]}
      holds:
        - {field: this.job_on_return, in: ["yes"]}
      rule_ids: [travel.opt_signature_months, opt.report_interruption]
    - id: trip.reentry_i20_after_move
      for_each: {record: trip}
      only_if:
        - exists: {record: move, where: [{field: this.told_school_on, on_or_before: {fact: outer.left_on}}]}
      holds:
        - exists: {record: move, where: [{field: this.told_school_on, on_or_before: {fact: outer.left_on}}, {field: this.to_program, same_as: outer.reentry_i20}]}
      rule_ids: [travel.updated_i20]
    - id: oncampus.ends_after_completion
      for_each: {record: work, where: [{field: this.on_campus, present: true}, {field: this.on_campus.state, in: [completed]}]}
      only_if:
        - none: {record: move, where: [{field: this.from_program, same_as: outer.on_campus}]}
      holds:
        - {field: this.end, on_or_before: {fact: this.on_campus.end_date, as_of: {fact: today}}}
      rule_ids: [oncampus.after_completion]
  counters:
    - id: unemployment.opt_card
      calculator: days_without_qualifying_period
      scope:
        of:
          record: authorization
          where:
            - {field: this.type, in: [opt_post_completion]}
        group: record
      span:
        starts: {fact: this.card_start}
        ends:
          earliest_of:
            - {fact: this.card_end}
            - {optional: true, day_before: true, first: {of: {record: move, where: [{field: this.from_program, same_as: outer.program}, {field: this.to_program.level, differs_from: outer.program.level}]}, field: to_program.start_date, pick: earliest}}
            - first: &card_end_no_petition
                of:
                  record: authorization
                  where:
                    - {field: this.id, same_as: outer.id}
                    - none: {record: petition, where: [{field: this.change_of_status, in: ["yes"]}, *petition_may_extend_card, {field: this.filed_on, on_or_before: {fact: outer.card_end, add: [{rule: grace.after_completion_days}]}}]}
                field: card_end
                pick: latest
      qualifying: {record: work, where: [{field: this.on_campus, present: false}, {field: this.under, same_as: outer.id}]}
      hours_rule: opt.min_hours_per_week
      not_qualifying: {record: trip, where: [{field: this.purpose, in: [personal, study_abroad]}]}
      limit_rule: opt.unemployment_limit_days
      rule_ids: [opt.unemployment_limit_days, opt.unemployment_each_period, opt.unemployment_abroad, opt.ends_on_transfer_or_new_level]
    - id: unemployment.total
      calculator: days_without_qualifying_period
      scope: {of: {record: authorization, where: [{field: this.type, in: [opt_post_completion, stem_extension]}]}, group: chain, chain_link: extends}
      span:
        starts: {fact: this.card_start}
        ends: {first: *card_end_no_petition}
      qualifying: {record: work, where: [{field: this.under, same_as: outer.id}]}
      hours_rule: stem.min_hours_per_week
      not_qualifying: {record: trip, where: [{field: this.purpose, in: [personal, study_abroad]}]}
      only_if:
        - exists: {record: authorization, where: [{field: this.type, in: [stem_extension]}, {field: this.extends, same_as: outer.id}]}
      limit_rule: stem.unemployment_limit_days
      rule_ids: [stem.unemployment_limit_days, opt.unemployment_each_period, opt.unemployment_abroad]
    - id: cpt.full_time_days_at_level
      calculator: sum_of_days
      scope: {of: {record: authorization, where: [{field: this.type, in: [cpt]}, {field: this.time, in: [full_time]}]}, group: same_value, value_of: this.program.level}
      span:
        starts: {fact: this.card_start}
        ends: {fact: this.card_end}
      limit_rule: cpt.full_time_bar_days
      rule_ids: [cpt.full_time_bar_days, cpt.same_level_counts]
    - id: cpt.full_time_months_at_level
      calculator: sum_of_months
      scope: {of: {record: authorization, where: [{field: this.type, in: [cpt]}, {field: this.time, in: [full_time]}]}, group: same_value, value_of: this.program.level}
      span:
        starts: {fact: this.card_start}
        ends: {fact: this.card_end}
      limit_rule: cpt.full_time_months_bar
      rule_ids: [cpt.full_time_months_bar, cpt.same_level_counts]
    - id: opt.months_at_level
      calculator: sum_of_months
      scope: {of: {record: authorization, where: [{field: this.type, in: [opt_pre_completion, opt_post_completion]}, {field: this.decision, in: [approved]}]}, group: same_value, value_of: this.program.level}
      span:
        starts: {fact: this.card_start}
        ends:
          first:
            of:
              record: authorization
              where:
                - {field: this.id, same_as: outer.id}
                - any_of:
                    - {field: this.type, in: [opt_post_completion]}
                    - {field: this.time, in: [full_time]}
            field: card_end
            pick: latest
      limit_rule: opt.max_months
      rule_ids: [opt.max_months, opt.split_same_level, levels.higher_order, opt.part_time_pre_completion_counts, opt.post_completion_remaining_time]
    - id: stem.extensions
      calculator: count_of_records
      scope: {of: {record: authorization, where: [{field: this.type, in: [stem_extension]}, {field: this.decision, in: [pending, approved]}]}, group: all}
      limit_rule: stem.max_lifetime_extensions
      rule_ids: [stem.max_lifetime_extensions, stem.seventeen_month_counts_as_one]
  checklists:
    - id: opt_post
      label: "Post-completion OPT filing"
      reading: true
      steps:
        - id: dso_recommendation
          label: "The DSO's OPT recommendation, put in SEVIS"
          rule_ids: [opt.file_within_days_of_recommendation]
          who: school
          school: true
        - id: i765_in_window
          label: "Form I-765 for post-completion OPT, filed in the window around the program end date"
          rule_ids: [opt.apply_before_days, opt.apply_after_days]
          who: student
        - id: i765_after_recommendation
          label: "Form I-765, filed within the rule's days of the DSO's recommendation"
          rule_ids: [opt.file_within_days_of_recommendation]
          who: student
        - id: start_date
          label: "A requested start date no later than the rule allows after the program end date"
          rule_ids: [opt.latest_start_after_days]
          who: student
    - id: stem_opt
      label: "STEM OPT extension filing"
      reading: true
      steps:
        - id: i983
          label: "A completed and signed Form I-983, the training plan"
          rule_ids: [stem.requires.training_plan]
          who: student
        - id: dso_recommendation
          label: "The DSO's STEM OPT recommendation, put in SEVIS"
          rule_ids: [stem.file_within_days_of_recommendation, stem.requires.training_plan]
          who: school
          school: true
        - id: i765_after_recommendation
          label: "Form I-765, filed within the rule's days of the DSO's recommendation"
          rule_ids: [stem.file_within_days_of_recommendation]
          who: student
        - id: i765_before_card_end
          label: "Form I-765, filed before the current OPT card ends"
          rule_ids: [stem.apply_before_expiry_days, stem.apply_window_closes_rule]
          who: student
        - id: degree_on_list
          label: "A degree on the STEM list at the time the DSO recommends the extension"
          rule_ids: [stem.requires.degree_on_designated_list, stem.requires.dhs_approved_degree]
          who: student
        - id: accredited_school
          label: "A degree from an accredited U.S. school"
          rule_ids: [stem.requires.accreditation]
          who: school
        - id: e_verify
          label: "An employer in E-Verify, with an employer ID number (EIN) for tax"
          rule_ids: [stem.requires.employer_qualification]
          who: employer
        - id: directly_related
          label: "Training that is directly related to the degree"
          rule_ids: [stem.requires.eligible_practical_training_opportunity]
          who: employer
        - id: employer_attests
          label: "The employer's attestations, signed on Form I-983"
          rule_ids: [stem.requires.employer_attestation, stem.requires.employer_attests_resources, stem.requires.employer_attests_no_replacement, stem.requires.employer_attests_training_goals]
          who: employer
        - id: employer_reporting
          label: "The employer's agreement, on Form I-983, to tell the DSO if the student leaves early"
          rule_ids: [stem.requires.employer_reporting]
          who: employer
        - id: commensurate_terms
          label: "Duties, hours and compensation like those of similar U.S. workers at the employer"
          rule_ids: [stem.requires.duties_hours_and_compensation, stem.min_hours_per_week]
          who: employer
