    source:
      citation: "31 U.S.C. 1102"
      url: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title31-section1102&num=0&edition=prelim"
      checked_on: 2026-09-28
      quote: "The fiscal year of the Treasury begins on October 1 of each year and ends on September 30 of the following year."
