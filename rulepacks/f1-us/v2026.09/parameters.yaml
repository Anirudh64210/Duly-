    note: "Start date from 81 FR 13040 (FR Doc. 2016-04828), effective 2016-05-10, saved as sources/fr-2016-04828.xml. Words checked in the 2026-09-14 text."
    plain: "A validation report is due to the DSO within 10 business days. The days count from each reporting date."
    plain_terms: ["validation report", "business days", "reporting date"]
  - id: stem.evaluation_due_days
    value: 10
    unit: days
    status: settled
    effective_from: 2016-05-10
    source:
      citation: "8 CFR 214.2(f)(10)(ii)(C)(9)(i)"
      url: "https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2"
      checked_on: 2026-10-02
      quote: "The student is responsible for ensuring the DSO receives his or her 12-month evaluation and final evaluation no later than 10 days following the conclusion of the reporting period or conclusion of his or her practical training opportunity, respectively."
      snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml
      snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690
    derivation: verbatim
    note: "Start date from 81 FR 13040 (FR Doc. 2016-04828), effective 2016-05-10, saved as sources/fr-2016-04828.xml. Words checked in the 2026-09-14 text. On 2026-09-29 the quote was widened to the whole sentence, so that the word respectively pairs the 12-month evaluation with the reporting period and the final evaluation with the end of the practical training opportunity."
    plain: "The student is the one who must see that the DSO gets two evaluations on time. The 12-month evaluation is due within 10 days after the reporting period ends. The final evaluation is due within 10 days after the practical training opportunity ends."
    plain_terms: ["12-month evaluation", "final evaluation", "practical training opportunity"]
  - id: stem.new_plan_due_days
    value: 10
    unit: days
    status: settled
    effective_from: 2016-05-10
    source:
