          opens: {latest_of: [{fact: this.card_start}, {first: {of: {record: authorization, where: [{field: this.id, same_as: outer.id}, {none: {record: petition, where: [{field: this.change_of_status, in: ["yes"]}, *petition_may_extend_card, {field: this.filed_on, on_or_before: {fact: outer.card_start, add: [{rule: stem.evaluation_interval_months}, {rule: stem.evaluation_due_days}]}}]}}]}, field: card_start, pick: earliest}}]}
          closes: {latest_of: [{fact: this.card_start}, {first: {of: {record: authorization, where: [{field: this.id, same_as: outer.id}, {none: {record: petition, where: [{field: this.change_of_status, in: ["yes"]}, *petition_may_extend_card, {field: this.filed_on, on_or_before: {fact: outer.card_start, add: [{rule: stem.evaluation_interval_months}, {rule: stem.evaluation_due_days}]}}]}}]}, field: card_start, pick: earliest}}], add: [{rule: stem.evaluation_interval_months}, {rule: stem.evaluation_due_days}]}
          rule_ids: [stem.evaluation_interval_months, stem.evaluation_due_days, stem.reporting_required]
        - id: stem.evaluation_final
