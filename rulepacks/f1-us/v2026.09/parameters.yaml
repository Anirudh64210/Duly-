    unit: date
    status: settled
    effective_from: 1982-09-13
    source:
      citation: "31 U.S.C. 1102, United States Code, 2024 Edition"
      url: "https://www.govinfo.gov/content/pkg/USCODE-2024-title31/html/USCODE-2024-title31-subtitleII-chap11-sec1102.htm"
      checked_on: 2026-10-02
      quote: "The fiscal year of the Treasury begins on October 1 of each year and ends on September 30 of the following year."
