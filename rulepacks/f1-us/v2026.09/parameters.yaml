    derivation: reading
    note: "Reading: the regulation says one year or more, and the pack holds one year as 12 months. Start date from 67 FR 76256 (FR Doc. 02-31184), effective 2003-01-01, saved as sources/fr-02-31184.xml. The rule is older than this start date; this is the earliest rule document saved with the pack that carries the same words. Words checked in the 2026-09-14 text. The source says one year, not 12 months. The pack has no unit for years, so one year is recorded as 12 months. The source says post-completion academic training; it does not use the words optional practical training in this sentence. Duly reads post-completion academic training as OPT after the program end date; that is a reading, not the words of the sentence, and the plain words say so (SPEC-resolutions point 54)."
    plain: "The rule says a student who has received one year or more of full-time curricular practical training (CPT) cannot have post-completion academic training. Duly reads that term as OPT after the program end date, and one year as 12 months. This is Duly's reading, not the rule's exact words."
    plain_terms: ["curricular practical training", "post-completion academic training"]
  - id: grace.after_completion_days
    value: 60
    unit: days
    status: litigated
    regime: ds_2012
    effective_from: 2003-01-01
    source:
      citation: "8 CFR 214.2(f)(5)(iv), text of 2026-09-14"
      url: "https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2"
      checked_on: 2026-09-29
      quote: "An F-1 student who has completed a course of study and any authorized practical training following completion of studies will be allowed an additional 60-day period to prepare for departure from the United States or to transfer in accordance with paragraph (f)(8) of this section."
      snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml
      snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690
    derivation: verbatim
