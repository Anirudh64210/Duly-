    derivation: verbatim
    note: "Start date from 89 FR 103054 (FR Doc. 2024-29354), effective 2025-01-17, saved as sources/fr-2024-29354.xml. Words checked in the 2026-09-14 text. The 2026-09-15 text keeps April 1 and moves the paragraph to (f)(5)(vii)(A). On 2026-09-29 the quote was widened to the start of paragraph (A), so that what is extended, and for whom, is in the quote. The conditions follow the colon and are not recorded as rows here. 8 CFR 274a.12(c)(3)(i)(B) and (C), named in the quote, are not saved and were not read; the plain words say only the employment authorization the rule names. The preamble of 89 FR 103054 calls the extension the cap-gap extension and speaks of a cap-subject H-1B petition; the preamble of 81 FR 13040 calls a petition not subject to the annual numerical cap on H-1B visas cap-exempt. Duly reads subject to section 214(g)(1)(A) of the Act as under the yearly H-1B cap; that is a reading of those preambles, not the words of the regulation."
    plain: "It is for an F-1 student whose H-1B petition to change status is under the cap, as Duly reads it, and meets the terms. Duration of status and the employment authorization the rule names last on their own till April 1 of the H-1B fiscal year. If the approved petition starts first, they last on their own only until then."
    plain_terms: ["duration of status", "employment authorization"]
  - id: stem.evaluation_interval_months
    value: 12
    unit: months
    status: settled
    effective_from: 2016-05-10
    source:
      citation: "8 CFR 214.2(f)(10)(ii)(C)(9)(i)"
      url: "https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2"
      checked_on: 2026-10-02
      quote: "All STEM practical training opportunities require an initial evaluation within 12 months of the approved starting date on the employment authorization document granted pursuant to the student's 24-month OPT extension application, and a concluding evaluation."
