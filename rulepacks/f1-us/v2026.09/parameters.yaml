      snapshot_sha256: dbfc074987138fe7e80be4f0a47c6810fb03a4bb1a49ffa7e8a53a8ba35698ea
    derivation: verbatim
    note: "Closed row. The quote is the whole of (f)(5)(vi)(A)(2) as printed in 73 FR 18944 (FR Doc. E8-7427), effective 2008-04-08: the extension until October 1 in (A) reaches a petition that has been timely filed, (1), and states this start date, (2). The flag records that condition. 81 FR 13040 (FR Doc. 2016-04828), effective 2016-05-10, saved, rewrote (2) as requests an H-1B employment start date of October 1 of the following fiscal year, so this row ends 2016-05-09 and the next row carries those words to 2025-01-16. SPEC-resolutions point 40 and the mission asked for one row from this copy closed on 2025-01-16; the saved words of 2016 differ, so both are recorded. The flag records what the regulation said. It says nothing about any one person. Condition (1) in the same paragraph reads has been timely filed. The preamble of 89 FR 103054 calls the extension the cap-gap extension."
    plain: "Under the older cap-gap rule, one condition for the extension to October 1 was that the H-1B petition stated the F-1 student's employment start date as October 1 of the following fiscal year. The petition also had to be filed on time. This was the rule from 2008 to 2016."
    plain_terms: ["employment start date", "following fiscal year"]
  - id: capgap.october_start_condition
    value: true
    unit: flag
    status: settled
    effective_from: 2016-05-10
    effective_to: 2025-01-16
    source:
      citation: "8 CFR 214.2(f)(5)(vi)(A)(2), as amended by 81 FR 13040"
      url: "https://www.federalregister.gov/documents/full_text/xml/2016/03/11/2016-04828.xml"
      checked_on: 2026-10-02
      quote: "requests an H-1B employment start date of October 1 of the following fiscal year."
      snapshot: sources/fr-2016-04828.xml
      snapshot_sha256: 5e4bc844cac1e67b34626115a7ec94c9928f5ef3cb82219f436a4d85d68a5794
    derivation: verbatim
    note: "Closed row. The quote is the whole of (f)(5)(vi)(A)(2) as printed in 81 FR 13040 (FR Doc. 2016-04828), effective 2016-05-10. The same paragraph (A) now names an H-1B petition subject to section 214(g)(1)(A) of the Act, and extends status and employment authorization until October 1 of the fiscal year for which such H-1B status is being requested where such petition has been timely filed, (1), and meets this condition, (2). End date: 89 FR 103054 (FR Doc. 2024-29354), saved as sources/fr-2024-29354.xml, says the final rule will be effective January 17, 2025, and will apply to petitions filed on or after that date, and revises (f)(5)(vi)(A): the extension runs until April 1 of the fiscal year for which such H-1B status is being requested or until the validity start date of the approved petition, whichever is earlier, and (2) reads requests an H-1B employment start date in the fiscal year for which such H-1B status is being requested; so this row ends 2025-01-16 (SPEC-resolutions point 40). The flag records what the regulation said. It says nothing about any one person. Condition (1) in the same paragraph reads has been timely filed. The preamble of 89 FR 103054 calls the extension the cap-gap extension and speaks of a cap-subject H-1B petition; Duly reads subject to section 214(g)(1)(A) of the Act as under the yearly H-1B cap, a reading, not the words of the regulation."
    plain: "This was the cap-gap rule from 2016 to January 16, 2025. For the extension to October 1, the petition had to ask for an H-1B employment start date of October 1 of the following fiscal year. It also had to be filed on time and, as Duly reads it, be under the yearly cap."
    plain_terms: ["employment start date", "following fiscal year"]
