    note: "Start date from 67 FR 76256 (FR Doc. 02-31184), effective 2003-01-01, saved as sources/fr-02-31184.xml. The rule is older than this start date; this is the earliest rule document saved with the pack that carries the same words. Words checked in the 2026-09-14 text on 2026-09-29. The quote is the whole sentence of (f)(10)(ii)(A)(3), with its exception for the 24-month extension under (f)(10)(ii)(C), so the 14 months are never shown without the exception (SPEC-resolutions point 30). The same sentence is in the 2026-09-15 text and in 81 FR 13040 (FR Doc. 2016-04828), both saved. Paragraph (f)(10)(ii)(C) is headed 24-month extension of post-completion OPT for a science, technology, engineering, or mathematics (STEM) degree; that heading is why the plain words say STEM."
