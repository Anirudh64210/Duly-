regimes:
  - id: ds_2012
    legal_status: effective
    operative: true
    note: "Duration of status, the rule in force before 91 FR 44976. Read from the point-in-time text of 2026-09-14, the last day before the effective date stated in that final rule. On 2026-10-02 eCFR listed a newer version of 8 CFR 214.2, dated 2026-09-30, saved as sources/recheck-2026-10-02/ecfr-8cfr214.2-2026-09-30.xml. Its paragraph (f) is the same, character for character, as paragraph (f) of the 2026-09-15 text; the change in that version is outside paragraph (f), in paragraph (h)(6)(xvi), on H-2B. The 2026-09-14 text pinned here came back the same on 2026-10-02."
    source:
      citation: "8 CFR 214.2(f)(5)(i), text of 2026-09-14"
      url: "https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2"
      checked_on: 2026-10-02
      quote: "Duration of status is defined as the time during which an F-1 student is pursuing a full course of study at an educational institution certified by SEVP for attendance by foreign students, or engaging in authorized practical training following completion of studies"
      snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml
      snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690
    plain: "This is the rule that applies today. Duration of status is the time an F-1 student is pursuing a full course of study at a school SEVP has certified for foreign students to attend. It also covers time in authorized practical training after study ends."
  - id: fixed_admission_2026
    legal_status: enjoined
    operative: false
    note: "Final rule: 91 FR 44976 (FR Doc. 2026-14439), published 2026-07-17, stated effective date 2026-09-15, saved as sources/fr-2026-14439.xml. Order of 2026-09-14, document 51 in Presidents Alliance on Higher Education and Immigration v. United States Department of Homeland Security, No. 1:26-cv-13799 (D. Mass.): paragraph 3 postpones the effective date under 5 U.S.C. 705 and paragraph 4 is quoted here. The snapshot is text extracted from the saved PDF beside it. Status as of 2026-09-28: the docket listing saved that day shows no later order, and no appeal was found. The 2026-09-15 point-in-time text carries the amendments even though the effective date is postponed. Paragraph 1(a) of the order names the Final Rule by its title, Establishing a Fixed Time Period of Admission and an Extension of Stay Procedure for Nonimmigrant Academic Students, Exchange Visitors, and Representatives of Foreign Information Media. Paragraph 3 says the effective date of the Final Rule is postponed pending further order of this court or resolution of this proceeding on the merits. History from the docket listing fetched 2026-10-02, saved as sources/recheck-2026-10-02/courtlistener-docket-74661796-entries-2026-09-28.json: on 2026-09-30 the defendants filed a notice of appeal as to document 50, the memorandum and order of 2026-09-14 (ECF 53); the record on appeal was sent to the Court of Appeals the same day (ECF 54); and the First Circuit case number is 26-2112 (ECF 55). The listing shows no entry for a stay of the order. The words Status as of 2026-09-28 above are kept as written that day; the appeal is recorded here. The founder reviewed this docket listing (D90, accepting SPEC-FEED point 69): legal_status stays enjoined and operative stays false, since no order of a court has changed the order of 2026-09-14, and the status tag is unchanged. The listing this rests on was fetched at 2026-10-02T06:09Z, and again at 06:25Z with the same bytes. That is before the status conference the listing sets for 2026-10-02 at 12:00 PM in Boston (ECF 52), which is 16:00Z. Any order from that conference is not covered by this listing, and checked_on 2026-10-02 does not cover it."
    source:
      citation: "Preliminary Injunction Order Postponing Effective Date of Final Rule, No. 1:26-cv-13799 (D. Mass. Sept. 14, 2026), ECF No. 51"
      url: "https://www.courtlistener.com/docket/74661796/51/presidents-alliance-on-higher-education-and-immigration-v-united-states/"
      checked_on: 2026-10-02
      quote: "Defendants are preliminarily enjoined from taking any further action to implement the Final Rule pending further order of this court or resolution of this proceeding on the merits."
      snapshot: sources/mad-1-26-cv-13799-doc51-order.txt
      snapshot_sha256: c211815e43cc9f25b6cc231ab75c8c8151bfe6e26c3a79d147a3642c220db399
    plain: "A new rule, published on July 17, 2026, would set a fixed time period of admission for students and some other visitors. A federal court paused it on September 14, 2026, while the case goes on. Until the court orders otherwise or rules on the merits of the case, the rule's start date is put off and the government may not take further steps to carry it out. The earlier rule applies today."
