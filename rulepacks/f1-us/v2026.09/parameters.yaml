    plain: "A student who meets the terms for a 24-month OPT extension may ask for it by filing Form I-765 with the fee and papers needed. The filing may come up to 90 days before the student's current OPT employment authorization ends."
    plain_terms: ["employment authorization", "24-month OPT extension"]
  - id: stem.apply_window_closes_rule
    value: true
    unit: flag
    status: settled
    effective_from: 2016-05-10
    source:
      citation: "8 CFR 214.2(f)(10)(ii)(C)"
      url: "https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2"
      checked_on: 2026-10-02
      quote: "a qualified student may apply for an extension of OPT while in a valid period of post-completion OPT authorized under 8 CFR 274a.12(c)(3)(i)(B)"
      snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml
      snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690
    derivation: reading
    note: "Reading: the regulation says a qualified student may apply while in a valid period of post-completion OPT, and Duly reads those words as the closing of the filing window. Start date from 81 FR 13040 (FR Doc. 2016-04828), effective 2016-05-10, saved as sources/fr-2016-04828.xml. Words checked in the 2026-09-14 text; the 2026-09-15 text has the same words, so the rule sits under no regime. The SPEC pointed to (f)(11)(i)(C). That paragraph states only the opening of the window, up to 90 days prior to the expiration date of the current OPT employment authorization, and states no closing. The closing is in the opening text of (f)(10)(ii)(C), quoted here, which begins with the words Consistent with paragraph (f)(11)(i)(C) of this section. The regulation states the closing as a condition, while in a valid period of post-completion OPT, and names no date. The preamble of 81 FR 13040 says a student may file only if the student is in a valid period of post-completion OPT at the time of filing, and that a period extended under cap-gap is a valid period. So the window can close later than the expiration date on the employment authorization document. That the window closes on that expiration date is a reading, not the words of the source. The plain words say qualified student as a student who meets its terms, because the plain check refuses the word qualified."
    plain: "The rule lets a student who meets its terms apply for an extension of OPT while in a valid period of post-completion OPT. Duly reads this as closing the window when the OPT card ends, though a cap-gap period may keep it open longer. This is Duly's reading, not the rule's exact words."
    plain_terms: ["extension of OPT", "valid period of post-completion OPT"]
  - id: stem.file_within_days_of_recommendation
    value: 60
    unit: days
    status: settled
    effective_from: 2016-05-10
    source:
      citation: "8 CFR 214.2(f)(11)(i)(C)"
      url: "https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2"
      checked_on: 2026-10-02
      quote: "The student seeking such 24-month OPT extension must properly file his or her Form I-765 or successor form with USCIS within 60 days of the date the DSO enters the recommendation for the OPT extension into his or her SEVIS record."
      snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml
      snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690
    derivation: verbatim
    note: "Start date from 81 FR 13040 (FR Doc. 2016-04828), effective 2016-05-10, saved as sources/fr-2016-04828.xml. Words checked in the 2026-09-14 text. The plain words say properly file as correctly file."
    plain: "A student seeking the 24-month OPT extension must correctly file Form I-765 with USCIS. It is due within 60 days after the DSO puts the recommendation for it in the student's SEVIS record."
    plain_terms: ["24-month OPT extension", "SEVIS record"]
  - id: stem.min_hours_per_week
    value: 20
    unit: hours_per_week
    status: settled
    effective_from: 2016-05-10
    source:
      citation: "8 CFR 214.2(f)(10)(ii)(C)(8)"
      url: "https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2"
      checked_on: 2026-10-02
      quote: "A student may not engage in practical training for less than 20 hours per week, excluding time off taken consistent with leave-related policies applicable to the employer's similarly situated U.S. workers in the area of employment."
      snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml
      snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690
    derivation: verbatim
    note: "Start date from 81 FR 13040 (FR Doc. 2016-04828), effective 2016-05-10, saved as sources/fr-2016-04828.xml. Words checked in the 2026-09-14 text. The sentence is the second one of paragraph (f)(10)(ii)(C)(8), under (f)(10)(ii)(C), headed 24-month extension of post-completion OPT for a science, technology, engineering, or mathematics (STEM) degree; that heading is why the plain words name the extension. The time off left out is only time off taken consistent with leave-related policies applicable to the employer's similarly situated U.S. workers in the area of employment."
    plain: "On a 24-month extension, practical training may not be less than 20 hours a week. Some time off is not counted. It is time off that follows the leave policies for the employer's similarly situated U.S. workers in the area of employment."
    plain_terms: ["similarly situated U.S. workers", "area of employment"]
  - id: stem.validation_interval_months
    value: 6
    unit: months
    status: settled
    effective_from: 2016-05-10
    source:
      citation: "8 CFR 214.2(f)(12)(ii)(B)"
      url: "https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2"
      checked_on: 2026-10-02
      quote: "The student must complete a validation report, confirming that the information required by paragraph (f)(12)(ii)(A) of this section has not changed, every six months."
      snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml
      snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690
    derivation: verbatim
    note: "Start date from 81 FR 13040 (FR Doc. 2016-04828), effective 2016-05-10, saved as sources/fr-2016-04828.xml. Words checked in the 2026-09-14 text. The source writes the number as the word six. The same paragraph says the requirement starts on the date the 24-month OPT extension begins. The sentence is (f)(12)(ii)(B), under (f)(12)(ii), headed Additional reporting obligations for students with an approved 24-month OPT extension; that heading is why the plain words name the extension. The source does not call the report short. Paragraph (f)(12)(ii)(A), named in the quote, requires a report of a change of legal name, residential or mailing address, employer name, employer address, and/or loss of employment; that is the information the validation report confirms has not changed (quoted in stem.report_change_within_days)."
    plain: "A student with an approved 24-month OPT extension must complete a validation report every six months. It confirms that the facts the student must report have not changed. These are legal name, home or mailing address, employer name and address, and loss of employment."
    plain_terms: ["validation report"]
  - id: stem.validation_due_business_days
