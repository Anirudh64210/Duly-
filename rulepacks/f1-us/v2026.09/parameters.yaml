    plain: "This is the rule in force today. An F-1 student gets 60 more days after a course of study and any authorized practical training after it are done. The time is to get ready to leave the United States, or to move to a new school under the transfer rules."
    plain_terms: ["course of study", "authorized practical training"]
  - id: grace.after_completion_days
