      snapshot_sha256: dcd7e4bb057f8351e61fa327773698e3457a5c05ee5f87ebb919385bed8714dd
    derivation: reading
    note: "Reading: the statute says the fiscal year of the Treasury begins on October 1, and Duly reads the fiscal year named in the cap-gap paragraph as that fiscal year. Start date is the date of Pub. L. 97-258, 1982-09-13, named in the source credit of the saved copy, which enacted title 31 in this form. The October 1 start is older than that. The statute speaks of the fiscal year of the Treasury. The cap-gap paragraph, 8 CFR 214.2(f)(5)(vi)(A) in the 2026-09-14 text, says fiscal year and does not define it or name a start date. That the fiscal year in the cap-gap paragraph is the one in 31 U.S.C. 1102 is a reading, not the words of either source. The saved copy of 81 FR 13040 says in a footnote that an approved change to H-1B status takes effect on October 1. The 2026-09-15 text moves the cap-gap paragraph to (f)(5)(vii)(A) and keeps the words fiscal year. The saved copy is the govinfo.gov copy of the United States Code, 2024 Edition, current through 2025-01-06 by its own header. uscode.house.gov, which carries laws enacted after that, served a page titled Under Maintenance on 2026-10-02 and not the statute. Any amendment after 2025-01-06 is not covered by this copy; checked_on 2026-10-02 says the same copy came back that day."
    plain: "The fiscal year of the Treasury begins on October 1 and ends on September 30 of the next year. Duly reads the fiscal year in the cap-gap rule as this one. This is how Duly reads the rule, not its exact words."
    plain_terms: ["fiscal year of the Treasury"]
  - id: opt.report_employer_within_days
