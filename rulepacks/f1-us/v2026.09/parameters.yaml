    source: {citation: '8 CFR 214.2(f)(8)(i), text of 2026-09-14', url: 'https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2', checked_on: 2026-10-02, quote: 'an F-1 student is not permitted to remain in the United States when transferring between schools or programs unless the student will begin classes at the transfer school or program within five months of transferring out of the current school or within 5 months of the program completion date on their current Form I-20 or successor form, whichever is earlier.', snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml, snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690}
    derivation: verbatim
    note: No saved rule document older than the point-in-time text of 2026-09-14 carries these exact words, so the start date is the date of that saved copy (effective_from_basis earliest_saved_copy). The rule may be older; an event before this day goes to the DSO. Words checked in the 2026-09-14 text on 2026-09-29. The 2026-09-15 text, as amended by 91 FR 44976, rewrites this paragraph, so the row is recorded under the regime ds_2012 and tagged litigated. The 2026-09-15 text keeps 5 months at (f)(8)(i)(G), recorded under fixed_admission_2026.
    plain: Under the rule in force today, a student who transfers must begin classes at the new school within five months of leaving the old one. The limit is 5 months from the program completion date on the Form I-20 if that is earlier.
    plain_terms: [program completion date]
  - id: transfer.begin_within_months
    value: 5
    unit: months
    status: litigated
    regime: fixed_admission_2026
    effective_from: 2026-09-15
    source: {citation: '8 CFR 214.2(f)(8)(i)(G), text of 2026-09-15, as amended by 91 FR 44976', url: 'https://www.ecfr.gov/api/versioner/v1/full/2026-09-15/title-8.xml?part=214&section=214.2', checked_on: 2026-10-02, quote: 'the student will begin classes at the transfer school or program within 5 months of transferring out of the current school or within 5 months of the program completion date on his or her current Form I-20, or successor form, whichever is earlier', snapshot: sources/ecfr-8cfr214.2-2026-09-15.xml, snapshot_sha256: d65cc78343f2f41484b708487c4ada6669f10166857e7d884bbf64066caad947}
    derivation: verbatim
    note: Not operative. 2026-09-15 is the effective date stated in 91 FR 44976, saved as sources/fr-2026-14439.xml. A court postponed that date on 2026-09-14; see the regime. In the 2026-09-15 text this is one of the requirements listed for a student changing educational objectives or transferring.
    plain: The paused rule would also have classes at the new school begin within 5 months of the transfer or of the program completion date, whichever is earlier. A court has paused this rule, so it does not apply today.
    plain_terms: [program completion date]
  - id: transfer.opt_resume_within_months
    value: 5
    unit: months
    status: litigated
    regime: ds_2012
    effective_from: 2003-01-01
    source: {citation: '8 CFR 214.2(f)(8)(i), text of 2026-09-14', url: 'https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2', checked_on: 2026-10-02, quote: 'the student must be able resume classes within 5 months of transferring out of the school that recommended OPT or the date the OPT authorization ends, whichever is earlier.', snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml, snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690}
    derivation: verbatim
    note: The sentence begins In the case of an F-1 student authorized to engage in post-completion optional practical training (OPT); the quote starts after those words. The source says be able resume. Start date from 67 FR 76256 (FR Doc. 02-31184), effective 2003-01-01, saved as sources/fr-02-31184.xml, which carries the same words. The rule may be older; this is the earliest rule document saved with the pack that carries them. Words checked in the 2026-09-14 text on 2026-09-29. The 2026-09-15 text, as amended by 91 FR 44976, rewrites this paragraph, so the row is recorded under the regime ds_2012 and tagged litigated.
    plain: Under the rule in force today, a student on post-completion OPT who transfers must be able to resume classes within 5 months. The time runs from leaving the school that recommended OPT, or from the end of the OPT if that is earlier.
    plain_terms: [resume classes]
  - id: transfer.opt_resume_within_months
    value: 5
    unit: months
    status: litigated
    regime: fixed_admission_2026
    effective_from: 2026-09-15
    source: {citation: '8 CFR 214.2(f)(8)(i)(H), text of 2026-09-15, as amended by 91 FR 44976', url: 'https://www.ecfr.gov/api/versioner/v1/full/2026-09-15/title-8.xml?part=214&section=214.2', checked_on: 2026-10-02, quote: 'must be able to begin or resume classes within 5 months of transferring out of the school that recommended the post-completion or STEM OPT or the date the post-completion or STEM OPT authorization ends, whichever is earlier', snapshot: sources/ecfr-8cfr214.2-2026-09-15.xml, snapshot_sha256: d65cc78343f2f41484b708487c4ada6669f10166857e7d884bbf64066caad947}
    derivation: verbatim
    note: Not operative. 2026-09-15 is the effective date stated in 91 FR 44976, saved as sources/fr-2026-14439.xml. A court postponed that date on 2026-09-14; see the regime.
    plain: The paused rule would also cover STEM OPT. Classes would have to begin or resume within 5 months of leaving the school that recommended the OPT, or of its end, whichever is earlier. A court has paused this rule, so it does not apply today.
    plain_terms: [STEM OPT]
  - id: transfer.contact_new_dso_within_days
    value: 15
    unit: days
    status: litigated
    regime: ds_2012
    effective_from: 2026-09-14
    effective_from_basis: earliest_saved_copy
    source: {citation: '8 CFR 214.2(f)(8)(ii), text of 2026-09-14', url: 'https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2', checked_on: 2026-10-02, quote: The student is then required to contact the DSO at the transfer-in school within 15 days of the program start date listed on the Form I-20 or successor form., snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml, snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690}
    derivation: verbatim
    note: No saved rule document older than the point-in-time text of 2026-09-14 carries these exact words, so the start date is the date of that saved copy (effective_from_basis earliest_saved_copy). The rule may be older; an event before this day goes to the DSO. Words checked in the 2026-09-14 text on 2026-09-29. The 2026-09-15 text, as amended by 91 FR 44976, rewrites this paragraph, so the row is recorded under the regime ds_2012 and tagged litigated. The 2026-09-15 text of (f)(8)(ii) names no number of days for this, so no row is recorded under fixed_admission_2026.
    plain: Under the rule in force today, after the release date the student contacts the DSO at the transfer-in school. This must be within 15 days of the program start date on the Form I-20. The paused rule leaves this out.
    plain_terms: [transfer-in school, program start date]
  - id: change_of_level.transfer_procedure
    value: true
    unit: flag
    status: litigated
    regime: ds_2012
    effective_from: 2026-09-14
    effective_from_basis: earliest_saved_copy
    source: {citation: '8 CFR 214.2(f)(5)(ii), text of 2026-09-14', url: 'https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2', checked_on: 2026-10-02, quote: 'An F-1 student who continues from one educational level to another is considered to be maintaining status, provided that the transition to the new educational level is accomplished according to transfer procedures outlined in paragraph', snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml, snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690}
    derivation: verbatim
    note: The sentence ends (f)(8) of this section; the quote stops before the number. No saved rule document older than the point-in-time text of 2026-09-14 carries these exact words, so the start date is the date of that saved copy (effective_from_basis earliest_saved_copy). The rule may be older; an event before this day goes to the DSO. Words checked in the 2026-09-14 text on 2026-09-29. The 2026-09-15 text, as amended by 91 FR 44976, rewrites this paragraph, so the row is recorded under the regime ds_2012 and tagged litigated.
    plain: Under the rule in force today, a student may go on from one educational level to the next. The student is then maintaining status if the move follows the steps for a transfer.
    plain_terms: [educational level]
  - id: change_of_level.transfer_procedure
    value: true
    unit: flag
    status: litigated
    regime: fixed_admission_2026
    effective_from: 2026-09-15
    source: {citation: '8 CFR 214.2(f)(8)(iii), text of 2026-09-15, as amended by 91 FR 44976', url: 'https://www.ecfr.gov/api/versioner/v1/full/2026-09-15/title-8.xml?part=214&section=214.2', checked_on: 2026-10-02, quote: A change of education level can be accomplished according to the transfer procedures outlined in paragraph, snapshot: sources/ecfr-8cfr214.2-2026-09-15.xml, snapshot_sha256: d65cc78343f2f41484b708487c4ada6669f10166857e7d884bbf64066caad947}
    derivation: verbatim
    note: Not operative. 2026-09-15 is the effective date stated in 91 FR 44976, saved as sources/fr-2026-14439.xml. A court postponed that date on 2026-09-14; see the regime. The sentence ends (f)(8)(ii) of this section; the quote stops before the number.
    plain: The paused rule says a change of education level can follow the transfer procedures. A court has paused this rule, so it does not apply today.
    plain_terms: [change of education level, transfer procedures]
  - id: oncampus.school_with_record
    value: true
    unit: flag
    status: settled
    effective_from: 2003-01-01
    source: {citation: 8 CFR 214.2(f)(9)(i), url: 'https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2', checked_on: 2026-10-02, quote: 'In the case of a transfer in SEVIS, the student may only engage in on-campus employment at the school having jurisdiction over the student''s SEVIS record.', snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml, snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690}
    derivation: verbatim
    note: Start date from 67 FR 76256 (FR Doc. 02-31184), effective 2003-01-01, saved as sources/fr-02-31184.xml, which carries the same words. The rule may be older; this is the earliest rule document saved with the pack that carries them. Words checked in the 2026-09-14 text and in the 2026-09-15 text on 2026-09-29; both carry them, so the rule sits under no regime. The school that holds the record is worked out from the move's release date. The plain words say engage in on-campus employment as work on campus.
    plain: During a transfer in SEVIS, a student may only work on campus at one school. It is the school that has the student's SEVIS record.
    plain_terms: [SEVIS record]
  - id: oncampus.after_completion
    value: true
    unit: flag
    status: settled
    effective_from: 2026-09-14
    effective_from_basis: earliest_saved_copy
    source: {citation: 8 CFR 214.2(f)(9)(i), url: 'https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2', checked_on: 2026-10-02, quote: 'Otherwise, an F-1 student may not engage in on-campus employment after completing a course of study, except employment for practical training as authorized under paragraph', snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml, snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690}
    derivation: verbatim
    note: The sentence before says a student who has been issued a Form I-20 to begin a new program and who intends to enroll for the next term at the institution that issued it may continue on-campus employment incident to status. The quote stops before the number (f)(10). No saved rule document older than the point-in-time text of 2026-09-14 carries these exact words, so the start date is the date of that saved copy (effective_from_basis earliest_saved_copy). The rule may be older; an event before this day goes to the DSO. Words checked in the 2026-09-14 text and in the 2026-09-15 text on 2026-09-29; both carry them, so the rule sits under no regime. 8 CFR 214.3(k), named beside it, is not saved.
    plain: An F-1 student may not work on campus after completing a course of study, apart from practical training. There is an exception for a student going on to a new program at the same school.
    plain_terms: [course of study]
  - id: program.extension_before_end
    value: true
    unit: flag
    status: litigated
    regime: ds_2012
    effective_from: 2003-01-01
    source: {citation: '8 CFR 214.2(f)(7)(iii), text of 2026-09-14', url: 'https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2', checked_on: 2026-10-02, quote: A DSO may not grant an extension if the student did not apply for an extension until after the program end date noted on the Form I-20 or successor form., snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml, snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690}
    derivation: verbatim
    note: Start date from 67 FR 76256 (FR Doc. 02-31184), effective 2003-01-01, saved as sources/fr-02-31184.xml, which carries the same words. The rule may be older; this is the earliest rule document saved with the pack that carries them. Words checked in the 2026-09-14 text on 2026-09-29. The 2026-09-15 text, as amended by 91 FR 44976, rewrites this paragraph, so the row is recorded under the regime ds_2012 and tagged litigated. The 2026-09-15 text replaces the program extension by the DSO with an extension of stay filed with USCIS, and has no such sentence, so no row is recorded under fixed_admission_2026.
    plain: Under the rule in force today, a DSO may not grant a program extension if the student asked for it only after the program end date on the Form I-20. The paused rule would replace this with a filing to USCIS.
    plain_terms: [program end date]
  - id: program.extension_new_i20
