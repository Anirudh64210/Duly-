    note: "Reading: the statute says the fiscal year of the Treasury begins on October 1, and Duly reads the fiscal year named in the cap-gap paragraph as that fiscal year. Start date is the date of Pub. L. 97-258, 1982-09-13, named in the source credit of the saved copy, which enacted title 31 in this form. The October 1 start is older than that. The statute speaks of the fiscal year of the Treasury. The cap-gap paragraph, 8 CFR 214.2(f)(5)(vi)(A) in the 2026-09-14 text, says fiscal year and does not define it or name a start date. That the fiscal year in the cap-gap paragraph is the one in 31 U.S.C. 1102 is a reading, not the words of either source. The saved copy of 81 FR 13040 says in a footnote that an approved change to H-1B status takes effect on October 1. The 2026-09-15 text moves the cap-gap paragraph to (f)(5)(vii)(A) and keeps the words fiscal year."
