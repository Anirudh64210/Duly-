  - id: calendar.federal_holidays_law
    value: true
    unit: flag
    status: settled
    effective_from: 1986-01-01
    effective_to: 2021-06-16
    source:
      citation: "5 U.S.C. 6103(a), amendment note for 2021, United States Code, 2024 Edition"
      url: "https://www.govinfo.gov/content/pkg/USCODE-2024-title5/html/USCODE-2024-title5-partIII-subpartE-chap61-subchapI-sec6103.htm"
      checked_on: 2026-10-02
      quote: "Pub. L. 117-17 inserted item relating to Juneteenth National Independence Day."
      snapshot: sources/govinfo-uscode-2024-title5-sec6103.htm
      snapshot_sha256: 6909183aef19c2e16b1540ff3058f3a1bbb2c5ca13f249dee494f059604ea28f
    derivation: reading
    note: "Reading: the list of legal public holidays in force before 2021-06-17 is the list of 6103(a) in the saved copy without Juneteenth National Independence Day, June 19. Ten holidays: New Year's Day, January 1. Birthday of Martin Luther King, Jr., the third Monday in January. Washington's Birthday, the third Monday in February. Memorial Day, the last Monday in May. Independence Day, July 4. Labor Day, the first Monday in September. Columbus Day, the second Monday in October. Veterans Day, November 11. Thanksgiving Day, the fourth Thursday in November. Christmas Day, December 25. The saved copy holds no text of the list as it stood before; the list is read from the current list and the amendment notes. The notes say, under Amendments, 2021, Subsec. (a), that Pub. L. 117-17 inserted the Juneteenth item, and the source credit dates Pub. L. 117-17 June 17, 2021; the saved copy gives no other effective date for it, so the row ends 2021-06-16. The notes list no other amendment of subsection (a) after 1983; the 1996 and 1998 amendments are to subsections (d) and (b)(3). Start date: the 1983 amendment, Pub. L. 98-144, inserted the Birthday of Martin Luther King, Jr., and the note Effective Date of 1983 Amendment says it took effect on the first January 1 that occurs after the two-year period following the date of enactment, Nov. 2, 1983; Duly reads that day as 1986-01-01. No row is recorded for the list before that date. Business days skip these days, on those days, and not observed days, as in the row that starts 2021-06-17 (SPEC-resolutions points 24 and 40). That this list sets which days are not business days under 8 CFR 214.2(f) is a reading, as in that row. The saved copy is the govinfo.gov copy of the United States Code, 2024 Edition, current through 2025-01-06 by its own header. uscode.house.gov, which carries laws enacted after that, served a page titled Under Maintenance on 2026-10-02 and not the statute. Any amendment after 2025-01-06 is not covered by this copy; checked_on 2026-10-02 says the same copy came back that day."
    plain: "From January 1, 1986 to June 16, 2021, Duly reads the list of legal public holidays as ten days: the list of today without Juneteenth National Independence Day. Duly skips those days, on the holiday itself, when it counts business days in that time. This is Duly's reading, not the rule's exact words."
    plain_terms: ["Juneteenth National Independence Day"]
