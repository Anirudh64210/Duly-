path:
  facts: []
  records:
    - id: program
      label: "Program of study"
      id_prefix: p
      max_records: 20
      complete_label: "Is this every program of study, in the US or not?"
      fields:
        - {id: where, kind: choice, label: "Where the program was, and on what status", choices: [us_on_f1, us_other_status, outside_us]}
        - {id: school_name, kind: text, label: "School name", max_length: 120}
        - {id: school_code, kind: text, label: "School code, as printed on the Form I-20", max_length: 40}
        - {id: level, kind: choice, label: "Level, as the Form I-20 shows it", choices: [secondary, language_training, associate, bachelor, master, doctorate, professional, other]}
        - {id: field_name, kind: text, label: "Field of study, as printed", max_length: 120}
        - {id: cip_code, kind: text, label: "CIP code on the Form I-20", pattern: "^[0-9]{2}\\.[0-9]{4}$"}
        - {id: stem_list, kind: choice, label: "Is the degree on the STEM Designated Degree Program List?", choices: [on_list, not_on_list], not_sure: true}
        - {id: start_date, kind: date, label: "Program start date on the Form I-20"}
        - {id: end_date, kind: date, label: "Program end date on the newest Form I-20", history: {record: end_date_change, link: program, old: old_end, new: new_end, from: granted_on}}
        - {id: state, kind: choice, label: "Where the program stands", choices: [in_progress, completed, left_before_completing]}
        - {id: coursework_done_on, kind: date, label: "Day all course requirements were done, apart from a thesis or its equivalent", happened: true, school: true}
        - {id: conferred_on, kind: date, label: "Day the degree was conferred", happened: true}
        - {id: first_year_done_on, kind: date, label: "Day the first full academic year was done, from the school", school: true}
        - {id: first_year_before_training, kind: choice, label: "Was one full academic year done before the training began?", choices: ["yes", "no"], not_sure: true, school: true}
        - {id: immediate_cpt, kind: choice, label: "Does the program require CPT from the start?", choices: ["yes", "no"], not_sure: true, school: true}
        - {id: dual_with, kind: link, label: "The other program of a dual degree", to: [program]}
        - {id: full_course_each_term, kind: choice, label: "Was every term a full course of study?", choices: ["yes", "no"], not_sure: true}
        - {id: online_within_limit, kind: choice, label: "Did online classes stay within the school's limit each term?", choices: ["yes", "no"], not_sure: true, school: true}
        - {id: cpt_days_stated, kind: count, label: "CPT days, from an older case", translation_only: true}
    - id: move
      label: "Move from one program to the next"
      id_prefix: mv
      max_records: 20
      grows_with_time: true
      complete_label: "Is this every move between programs?"
      fields:
        - {id: how, kind: choice, label: "How the move was made", choices: [transfer, change_of_level, new_initial_i20]}
        - {id: from_program, kind: link, label: "Program moved from", to: [program]}
        - {id: to_program, kind: link, label: "Program moved to", to: [program]}
        - {id: told_school_on, kind: date, label: "Day the school was told of the transfer", happened: true}
        - {id: release_date, kind: date, label: "SEVIS release date"}
        - {id: i20_issued_on, kind: date, label: "Day the new Form I-20 was issued", happened: true}
        - {id: contacted_new_dso_on, kind: date, label: "Day the DSO at the new school was contacted", happened: true}
        - {id: registered_on, kind: date, label: "Day of registration at the new school", happened: true}
    - id: end_date_change
      label: "Change of program end date"
      id_prefix: ec
      max_records: 20
      fields:
        - {id: program, kind: link, label: "Program", to: [program]}
        - {id: change, kind: choice, label: "Kind of change", choices: [extension, shortened]}
        - {id: old_end, kind: date, label: "End date before the change"}
        - {id: new_end, kind: date, label: "End date after the change"}
        - {id: requested_on, kind: date, label: "Day the extension was asked for", happened: true}
        - {id: granted_on, kind: date, label: "Day the change was granted", happened: true}
        - {id: reason, kind: choice, label: "Reason on the Form I-20", choices: [academic, medical, other], not_sure: true}
    - id: authorization
      label: "Permission to work"
      id_prefix: a
      max_records: 30
      complete_label: "Is this every CPT, OPT and other work permission?"
      fields:
        - {id: type, kind: choice, label: "Kind of permission", choices: [cpt, opt_pre_completion, opt_post_completion, stem_extension, off_campus_hardship, international_organization]}
        - {id: program, kind: link, label: "Program it rests on", to: [program]}
        - {id: extends, kind: link, label: "OPT it extends", to: [authorization]}
        - {id: basis_program, kind: link, label: "Degree the STEM extension rests on", to: [program]}
        - {id: time, kind: choice, label: "Full or part time, as the Form I-20 shows it", choices: [full_time, part_time], not_sure: true}
        - {id: employer, kind: link, label: "Employer on the Form I-20", to: [employer]}
        - {id: dso_on, kind: date, label: "Day the DSO signed or entered the recommendation", happened: true}
        - {id: filed_on, kind: date, label: "Day Form I-765 was filed", happened: true}
        - {id: decision, kind: choice, label: "Decision", choices: [pending, approved, denied, withdrawn], not_sure: true}
        - {id: decided_on, kind: date, label: "Day of the decision", happened: true}
        - {id: card_start, kind: date, label: "Start date on the card, or on the Form I-20 for CPT"}
        - {id: card_end, kind: date, label: "End date on the card, or on the Form I-20 for CPT"}
        - {id: split_noted, kind: choice, label: "Did the DSO note a split of OPT time in SEVIS?", choices: ["yes", "no"], not_sure: true}
    - id: employer
      label: "Employer"
      id_prefix: e
      max_records: 50
      fields:
        - {id: name, kind: text, label: "Employer name", max_length: 120}
        - {id: e_verify, kind: choice, label: "Is the employer enrolled in E-Verify?", choices: ["yes", "no"], not_sure: true}
    - id: work
      label: "Job"
      id_prefix: w
      max_records: 100
      grows_with_time: true
      complete_label: "Is this every job, through today?"
      fields:
        - {id: employer, kind: link, label: "Employer", to: [employer]}
        - {id: under, kind: link, label: "Permission the job was under", to: [authorization]}
        - {id: on_campus, kind: link, label: "Program whose school the on-campus job was at", to: [program]}
        - {id: start, kind: date, label: "First day of the job", happened: true}
        - {id: end, kind: date, label: "Last day of the job", happened: true}
        - {id: hours_per_week, kind: number, label: "Hours a week"}
        - {id: hours_changes, kind: periods, label: "Times the hours a week changed"}
        - {id: employer_reported, kind: flag, label: "Employer reported, from an older case", translation_only: true}
    - id: report
      label: "Report to the DSO"
      id_prefix: r
      max_records: 100
      grows_with_time: true
      complete_label: "Is this every report made to the DSO, through today?"
      fields:
        - {id: type, kind: choice, label: "Kind of report", choices: [validation, evaluation_12_month, evaluation_final, i983_new, i983_changed, change_report, interruption_report]}
        - {id: about, kind: link, label: "Permission or job it is about", to: [authorization, work]}
        - {id: made_on, kind: date, label: "Day it was made", happened: true}
    - id: trip
      label: "Trip abroad"
      id_prefix: t
      max_records: 100
      grows_with_time: true
      complete_label: "Is this every trip outside the US in the time asked?"
      fields:
        - {id: left_on, kind: date, label: "Day of leaving the US", happened: true}
        - {id: returned_on, kind: date, label: "Day of return to the US", happened: true}
        - {id: purpose, kind: choice, label: "What the trip was", choices: [job_travel, approved_leave, personal, study_abroad], not_sure: true}
        - {id: reentry_i20, kind: link, label: "Program whose Form I-20 was shown on return", to: [program]}
        - {id: signature_on, kind: date, label: "Day of the DSO's travel signature on it", happened: true}
        - {id: job_on_return, kind: choice, label: "Was there a job to return to?", choices: ["yes", "no"], not_sure: true}
    - id: petition
      label: "H-1B petition"
      id_prefix: h
      max_records: 10
      complete_label: "Is this every H-1B petition filed for this person?"
      fields:
        - {id: type, kind: choice, label: "Kind of petition", choices: [h1b, other]}
        - {id: cap_subject, kind: choice, label: "Is the petition under the yearly cap?", choices: ["yes", "no"], not_sure: true}
        - {id: employer, kind: link, label: "Employer", to: [employer]}
        - {id: filed_on, kind: date, label: "Day it was filed", happened: true}
        - {id: receipt_on, kind: date, label: "Receipt date", happened: true}
        - {id: requested_start, kind: date, label: "Start date asked for in the petition"}
        - {id: change_of_status, kind: choice, label: "Does it ask for a change of status?", choices: ["yes", "no"]}
        - {id: cos_ended_on, kind: date, label: "Day the change of status was withdrawn or moved to a consulate", happened: true}
        - {id: outcome, kind: choice, label: "Outcome", choices: [pending, approved, denied, rejected, withdrawn, revoked]}
        - {id: outcome_on, kind: date, label: "Day of the outcome", happened: true}
        - {id: validity_start, kind: date, label: "Validity start date of the approved petition"}
        - {id: h1b_began_on, kind: date, label: "Day H-1B status began", happened: true}
    - id: withdrawal
      label: "Withdrawal from classes"
      id_prefix: wd
      max_records: 10
      fields:
        - {id: program, kind: link, label: "Program", to: [program]}
        - {id: "on", kind: date, label: "Day of the withdrawal", happened: true}
        - {id: dso_authorized, kind: choice, label: "Did the DSO authorize the withdrawal?", choices: ["yes", "no"], not_sure: true}
    - id: term
      label: "Term, held and not yet computed"
      id_prefix: tm
      max_records: 200
      fields:
        - {id: program, kind: link, label: "Program", to: [program]}
        - {id: start, kind: date, label: "First day of the term"}
        - {id: end, kind: date, label: "Last day of the term"}
        - {id: type, kind: choice, label: "Kind of term", choices: [term, annual_vacation]}
        - {id: credits, kind: number, label: "Credits taken"}
        - {id: online_credits, kind: number, label: "Online credits taken"}
        - {id: full_course_credits, kind: number, label: "Credits the school counts as a full course", school: true}
    - id: reduced_load
      label: "Reduced course load, held and not yet computed"
      id_prefix: rl
      max_records: 50
      fields:
        - {id: program, kind: link, label: "Program", to: [program]}
        - {id: reason, kind: choice, label: "Reason", choices: [language_or_academic, medical, final_term, other], not_sure: true}
        - {id: starts, kind: date, label: "First day"}
        - {id: ends, kind: date, label: "Last day"}
        - {id: approved_on, kind: date, label: "Day the DSO approved it", happened: true}
        - {id: credits, kind: number, label: "Credits taken"}
        - {id: resumed_on, kind: date, label: "Day a full course resumed", happened: true}
    - id: reinstatement
      label: "Reinstatement, held and not yet computed"
      id_prefix: ri
      max_records: 10
      fields:
        - {id: program, kind: link, label: "Program", to: [program]}
        - {id: filed_on, kind: date, label: "Day it was filed", happened: true}
        - {id: decided_on, kind: date, label: "Day of the decision", happened: true}
        - {id: decision, kind: choice, label: "Decision", choices: [pending, approved, denied]}
  order:
    - record: program
      field: level
      ascending: [associate, bachelor, master, doctorate]
      rule_ids: [levels.higher_order, opt.max_months, stem.second_higher_level]
  lists:
    - id: stem.requirements
      label: "What the rule lists for a STEM OPT extension"
      rule_ids: [stem.requires.all_of_the_following, stem.requires.accreditation, stem.requires.dhs_approved_degree, stem.requires.degree_on_designated_list, stem.requires.previously_obtained_degree, stem.requires.eligible_practical_training_opportunity, stem.requires.employer_qualification, stem.requires.employer_reporting, stem.requires.training_plan, stem.requires.duties_hours_and_compensation, stem.requires.self_evaluation, stem.requires.employer_attestation, stem.requires.employer_attests_resources, stem.requires.employer_attests_no_replacement, stem.requires.employer_attests_training_goals]
  stages:
    - id: program
      label: "Program of study"
      for_each: {record: program, where: [{field: this.where, in: [us_on_f1]}]}
      entered_when: [this.start_date, this.end_date]
      rule_ids: [program.extension_new_i20, levels.higher_order, practical_training.language_programs]
      span:
        starts: {fact: this.start_date}
        ends: {fact: this.end_date, as_of: {fact: today}}
      next:
        - stage: opt_post
          bind: {program: outer.id, type: opt_post_completion}
          only_if:
            - not: {field: this.level, in: [secondary, language_training]}
            - any_of:
                - {field: this.level, in: [associate]}
                - {field: this.level, level_above: associate}
            - none: {record: authorization, where: [{field: this.type, in: [opt_post_completion]}, {field: this.program, same_as: outer.id}]}
            - none: {record: authorization, where: [{field: this.type, in: [opt_pre_completion, opt_post_completion]}, {field: this.program.level, same_as: outer.level}, {field: this.decision, in: [approved]}, {field: this.card_end, on_or_after: {fact: this.card_start, add: [{rule: opt.max_months}], day_before: true}}]}
            - not: {field: this.state, in: [left_before_completing]}
    - id: move
      label: "Move to a new program"
      for_each: {record: move}
      entered_when: [this.i20_issued_on]
      rule_ids: [change_of_level.transfer_procedure, transfer.begin_within_months]
      span:
        starts: {earliest_of: [{optional: true, fact: this.release_date}, {fact: this.i20_issued_on}]}
        ends: {earliest_of: [{optional: true, fact: this.release_date}, {fact: this.i20_issued_on}]}
      windows:
        - id: move.begin_classes
          label: "Classes at the new program begin"
          opens: {earliest_of: [{optional: true, fact: this.release_date}, {fact: this.i20_issued_on}]}
          closes:
            earliest_of:
              - {optional: true, fact: this.release_date, add: [{rule: transfer.begin_within_months}]}
              - {fact: this.from_program.end_date, as_of: {fact: this.i20_issued_on}, add: [{rule: transfer.begin_within_months}]}
          rule_ids: [transfer.begin_within_months]
          done_when: [this.registered_on]
    - id: transfer
      label: "School transfer"
      for_each: {record: move, where: [{field: this.how, in: [transfer]}]}
      entered_when: [this.release_date]
      rule_ids: [transfer.contact_new_dso_within_days, oncampus.school_with_record]
      span:
        starts: {fact: this.release_date}
        ends: {fact: this.to_program.start_date, add: [{rule: transfer.contact_new_dso_within_days}]}
      windows:
        - id: transfer.contact_new_dso
          label: "Contact with the DSO at the transfer-in school"
          opens: {fact: this.release_date}
          closes: {fact: this.to_program.start_date, add: [{rule: transfer.contact_new_dso_within_days}]}
          rule_ids: [transfer.contact_new_dso_within_days]
          done_when: [this.contacted_new_dso_on]
    - id: cpt
      label: "Curricular practical training"
      for_each: {record: authorization, where: [{field: this.type, in: [cpt]}]}
      entered_when: [this.card_start, this.card_end]
      rule_ids: [cpt.after_endorsed_i20, cpt.dso_marks_time]
      span:
        starts: {fact: this.card_start}
        ends: {fact: this.card_end}
    - id: opt_pre
      label: "Pre-completion OPT"
      for_each: {record: authorization, where: [{field: this.type, in: [opt_pre_completion]}]}
      entered_when: [this.card_start, this.card_end]
      rule_ids: [opt.post_completion_definition, opt.pre_completion_file_before_days]
      span:
        starts: {fact: this.card_start}
        ends: {fact: this.card_end}
      windows:
        - id: opt_pre.apply_window
          label: "Filing window for Form I-765, pre-completion OPT"
          opens: {fact: this.program.first_year_done_on, add: [{rule: opt.pre_completion_file_before_days, sign: -1}]}
          closes: {fact: this.program.end_date, as_of: {fact: this.filed_on}}
          rule_ids: [opt.pre_completion_file_before_days, opt.post_completion_definition]
          done_when: [this.filed_on]
    - id: opt_post
      label: "Post-completion OPT"
      for_each: {record: authorization, where: [{field: this.type, in: [opt_post_completion]}]}
      entered_when: [this.card_start, this.card_end]
      rule_ids: [opt.post_completion_definition, opt.ends_on_transfer_or_new_level]
      checklist: opt_post
      span:
        starts: {fact: this.card_start}
        ends:
          earliest_of:
            - {fact: this.card_end}
            - {optional: true, day_before: true, first: {of: {record: move, where: [{field: this.from_program, same_as: outer.program}, {field: this.to_program.level, differs_from: outer.program.level}]}, field: to_program.start_date, pick: earliest}}
        ends_also:
          - when: {earliest_of: [{fact: this.card_end}, {optional: true, first: {of: {record: move, where: [{field: this.from_program, same_as: outer.program}]}, field: release_date, pick: earliest}}]}
            rule_ids: [opt.ends_on_release_date]
      windows:
        - id: opt.apply_window
          label: "Filing window for Form I-765"
          opens: {fact: this.program.end_date, as_of: {fact: this.filed_on}, add: [{rule: opt.apply_before_days, sign: -1}]}
          closes: {fact: this.program.end_date, as_of: {fact: this.filed_on}, add: [{rule: opt.apply_after_days}]}
          rule_ids: [opt.apply_before_days, opt.apply_after_days]
          done_when: [this.filed_on, this.card_start]
        - id: opt.latest_start
          label: "Latest start date that may be requested"
          opens: {fact: this.program.end_date, as_of: {fact: this.filed_on}}
          closes: {fact: this.program.end_date, as_of: {fact: this.filed_on}, add: [{rule: opt.latest_start_after_days}]}
          rule_ids: [opt.latest_start_after_days]
          done_when: [this.card_start]
        - id: opt.file_by
          label: "Form I-765 filed after the DSO's recommendation"
          opens: {fact: this.dso_on}
          closes: {fact: this.dso_on, add: [{rule: opt.file_within_days_of_recommendation}]}
          rule_ids: [opt.file_within_days_of_recommendation]
          done_when: [this.filed_on]
        - id: opt.last_day
          label: "Last day to file Form I-765"
          opens: {fact: this.program.end_date, as_of: {fact: this.filed_on}, add: [{rule: opt.apply_before_days, sign: -1}]}
          closes:
            earliest_of:
              - {fact: this.program.end_date, as_of: {fact: this.filed_on}, add: [{rule: opt.apply_after_days}]}
              - {fact: this.dso_on, add: [{rule: opt.file_within_days_of_recommendation}]}
          rule_ids: [opt.apply_before_days, opt.apply_after_days, opt.file_within_days_of_recommendation]
          done_when: [this.filed_on, this.card_start]
        - id: opt.prepare
          label: "Time to prepare the Form I-765 filing, a planning date"
          opens: {fact: this.program.end_date, as_of: {fact: this.filed_on}, add: [{rule: opt.apply_before_days, sign: -1}, {setting: plan.prepare_months, sign: -1}]}
          closes: {fact: this.program.end_date, as_of: {fact: this.filed_on}, add: [{rule: opt.apply_before_days, sign: -1}]}
          rule_ids: [opt.apply_before_days]
          done_when: [this.filed_on, this.card_start]
        - id: opt.complete_by
          label: "Practical training completed after the completion of study"
          opens: {fact: this.program.end_date, as_of: {fact: this.filed_on}}
          closes: {fact: this.program.end_date, as_of: {fact: this.filed_on}, add: [{rule: opt.complete_within_months}]}
          rule_ids: [opt.complete_within_months]
      lists: [stem.requirements]
      next:
        - stage: stem
          bind: {extends: outer.id, type: stem_extension, program: outer.program}
          only_if:
            - exists:
                record: program
                where:
                  - {field: this.where, in: [us_on_f1, us_other_status]}
                  - {field: this.level, in: [bachelor, master, doctorate]}
                  - {field: this.stem_list, in: [on_list]}
                  - any_of:
                      - {field: this.id, same_as: outer.program}
                      - all_of:
                          - {field: this.conferred_on, before: {fact: outer.program.coursework_done_on}}
                          - {field: this.conferred_on, on_or_after: {fact: outer.card_end, add: [{rule: stem.apply_before_expiry_days, sign: -1}, {rule: stem.file_within_days_of_recommendation, sign: -1}, {rule: stem.previous_degree_within_years, sign: -1}]}}
            - count_below: {of: {record: authorization, where: [{field: this.type, in: [stem_extension]}, {field: this.decision, in: [pending, approved]}]}, rule: stem.max_lifetime_extensions}
    - id: stem
      label: "STEM OPT extension"
      for_each: {record: authorization, where: [{field: this.type, in: [stem_extension]}]}
      entered_when: [this.card_start, this.card_end]
      rule_ids: [stem.extension_months, stem.requires_post_completion_opt, opt.ends_on_transfer_or_new_level, stem.pending_card_extended]
      checklist: stem_opt
      lists: [stem.requirements]
      span:
        starts: {fact: this.card_start}
        ends:
          earliest_of:
            - {fact: this.card_end}
            - {optional: true, first: {of: {record: move, where: [{field: this.from_program, same_as: outer.program}]}, field: release_date, pick: earliest}}
            - {optional: true, day_before: true, first: {of: {record: move, where: [{field: this.from_program, same_as: outer.program}, {field: this.to_program.level, differs_from: outer.program.level}]}, field: to_program.start_date, pick: earliest}}
        ends_also:
          - when: {earliest_of: [{fact: this.card_end}, {optional: true, first: {of: {record: move, where: [{field: this.from_program, same_as: outer.program}]}, field: release_date, pick: earliest}}]}
            rule_ids: [opt.ends_on_release_date]
      windows:
        - id: stem.apply_window
          label: "Filing window for the STEM OPT extension"
          opens: {fact: this.extends.card_end, add: [{rule: stem.apply_before_expiry_days, sign: -1}]}
          closes: {fact: this.extends.card_end}
          rule_ids: [stem.apply_before_expiry_days, stem.apply_window_closes_rule]
          done_when: [this.filed_on]
        - id: stem.file_by
          label: "Form I-765 filed after the DSO's recommendation"
          opens: {fact: this.dso_on}
          closes: {fact: this.dso_on, add: [{rule: stem.file_within_days_of_recommendation}]}
          rule_ids: [stem.file_within_days_of_recommendation]
          done_when: [this.filed_on]
        - id: stem.last_day
          label: "Last day to file Form I-765 for the STEM OPT extension"
          opens: {fact: this.extends.card_end, add: [{rule: stem.apply_before_expiry_days, sign: -1}]}
          closes:
            earliest_of:
              - {fact: this.extends.card_end}
              - {fact: this.dso_on, add: [{rule: stem.file_within_days_of_recommendation}]}
          rule_ids: [stem.apply_before_expiry_days, stem.apply_window_closes_rule, stem.file_within_days_of_recommendation]
          done_when: [this.filed_on]
        - id: stem.prepare
          label: "Time to prepare the STEM OPT extension filing, a planning date"
          opens: {fact: this.extends.card_end, add: [{rule: stem.apply_before_expiry_days, sign: -1}, {setting: plan.prepare_months, sign: -1}]}
          closes: {fact: this.extends.card_end, add: [{rule: stem.apply_before_expiry_days, sign: -1}]}
          rule_ids: [stem.apply_before_expiry_days]
          done_when: [this.filed_on]
        - id: stem.validation_1
          label: "First validation report"
          opens:
            add: [{rule: stem.validation_interval_months}]
            first:
              of:
                record: authorization
                where:
                  - {field: this.id, same_as: outer.id}
                  - {field: this.type, in: [stem_extension]}
                  - field: this.card_start
                    on_or_before:
                      add: [{rule: stem.validation_interval_months, sign: -1}]
                      earliest_of: &stem_validation_end
                        - {fact: this.card_end}
                        - {optional: true, first: {of: {record: move, where: [{field: this.from_program, same_as: outer.program}]}, field: release_date, pick: earliest}}
                        - {optional: true, day_before: true, first: {of: {record: move, where: [{field: this.from_program, same_as: outer.program}, {field: this.to_program.level, differs_from: outer.program.level}]}, field: to_program.start_date, pick: earliest}}
                  - none: {record: petition, where: [{field: this.change_of_status, in: ["yes"]}, &petition_may_extend_card {any_of: [{all_of: [{field: this.validity_start, present: true}, {any_of: [{all_of: [{field: this.outcome, present: true}, {field: this.outcome, in: [approved]}]}, {field: this.requested_start, present: false}]}, {field: this.validity_start, on_or_after: {fact: outer.card_start}}]}, {all_of: [{field: this.requested_start, present: true}, {not: {all_of: [{field: this.validity_start, present: true}, {field: this.outcome, present: true}, {field: this.outcome, in: [approved]}]}}, {field: this.requested_start, on_or_after: {fact: outer.card_start}}]}, {all_of: [{field: this.validity_start, present: false}, {field: this.requested_start, present: false}, {any_of: [{all_of: [{field: this.outcome, present: true}, {field: this.outcome, in: [approved]}, {field: this.validity_start, on_or_after: {fact: outer.card_start}}]}, {all_of: [{not: {all_of: [{field: this.outcome, present: true}, {field: this.outcome, in: [approved]}]}}, {field: this.requested_start, on_or_after: {fact: outer.card_start}}]}]}]}]}, {field: this.filed_on, on_or_before: {fact: outer.card_start, add: [{rule: stem.validation_interval_months}, {rule: stem.validation_due_business_days}]}}]}
              field: card_start
              pick: earliest
          closes:
            add: [{rule: stem.validation_interval_months}, {rule: stem.validation_due_business_days}]
