    status: settled
    effective_from: 2016-05-10
    source:
      citation: "8 CFR 214.2(f)(12)(ii)(B)"
      url: "https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2"
      checked_on: 2026-10-02
      quote: "The requirement for validation reporting starts on the date the 24-month OPT extension begins and ends when the student's F-1 status expires or the 24-month OPT extension concludes, whichever is first."
      snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml
      snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690
    derivation: verbatim
    note: "The quote is the second sentence of (f)(12)(ii)(B), the paragraph of stem.validation_interval_months. Start date from 81 FR 13040 (FR Doc. 2016-04828), effective 2016-05-10, saved as sources/fr-2016-04828.xml. Words checked in the 2026-09-14 text and in the 2026-09-15 text on 2026-09-30; both carry the same sentence, so the rule sits under no regime. The path dates a validation report only while a STEM card exists (resolutions point 16): a next STEM stage with no card has no report dates. A reporting date is dated only when it falls on or before the earliest of the card end, the transfer release date (opt.ends_on_release_date), the day before a program at another level starts (opt.ends_on_transfer_or_new_level), and the day before a program at another level starts. Resolutions point 19: the path no longer ends reporting on the validity start of an approved change-of-status petition; while a petition with change_of_status yes is on the record, a report whose due day is on or after the day the petition was filed is null and the judgement cap_gap.for_dso goes to the DSO (capgap.petition_for_dso). A job's end is neither the expiry of F-1 status nor the conclusion of the extension, so it does not end validation reporting."
