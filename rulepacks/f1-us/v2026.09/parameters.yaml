  - id: calendar.federal_holidays_law
    value: true
    unit: flag
    status: settled
    effective_from: 2021-06-17
    source:
      citation: "5 U.S.C. 6103(a), United States Code, 2024 Edition"
      url: "https://www.govinfo.gov/content/pkg/USCODE-2024-title5/html/USCODE-2024-title5-partIII-subpartE-chap61-subchapI-sec6103.htm"
      checked_on: 2026-10-02
      quote: "The following are legal public holidays: New Year's Day, January 1. Birthday of Martin Luther King, Jr., the third Monday in January. Washington's Birthday, the third Monday in February. Memorial Day, the last Monday in May. Juneteenth National Independence Day, June 19. Independence Day, July 4. Labor Day, the first Monday in September. Columbus Day, the second Monday in October. Veterans Day, November 11. Thanksgiving Day, the fourth Thursday in November. Christmas Day, December 25."
      snapshot: sources/govinfo-uscode-2024-title5-sec6103.htm
      snapshot_sha256: 6909183aef19c2e16b1540ff3058f3a1bbb2c5ca13f249dee494f059604ea28f
    derivation: reading
    note: "Reading: the statute lists the legal public holidays, and Duly reads that list as the days that are not business days under 8 CFR 214.2(f). Eleven holidays. Start date is the date of Pub. L. 117-17, 2021-06-17, which added Juneteenth National Independence Day; the date and the amendment are in the source credit and notes of the saved copy. Before that date the list had ten holidays, recorded in the row of this id that ends 2021-06-16, read from this saved copy and its amendment note. Business days skip the days 6103(a) lists, on those days, and not observed days. Subsection (b) in the saved copy begins with the words 'For the purpose of statutes relating to pay and leave of employees', and only then moves a holiday that falls on a Saturday to the Friday before; the day off for a holiday on a Sunday is in Executive Order 11582, printed in the notes of the saved copy, which applies it in administering the provisions of law relating to pay and leave of absence. 8 CFR 214.2(f) is not a statute relating to pay and leave of employees, so Duly does not skip an observed day. The words of 6103(b) are in the note and not in the quote, which stays the list in (a). Subsection (c) names Inauguration Day for employees in the Washington area; it is not in the list in (a). 8 CFR 214.2(f) uses the words business days and does not define them or point to this statute. That the list in 5 U.S.C. 6103(a) sets which days are not business days under 8 CFR 214.2(f) is a reading, not the words of either source. The saved copy is the govinfo.gov copy of the United States Code, 2024 Edition, current through 2025-01-06 by its own header. uscode.house.gov, which carries laws enacted after that, served a page titled Under Maintenance on 2026-10-02 and not the statute. Any amendment after 2025-01-06 is not covered by this copy; checked_on 2026-10-02 says the same copy came back that day."
    plain: "The law lists eleven legal public holidays, including Juneteenth National Independence Day on June 19. Duly skips these days when it counts business days, on the holiday itself and not on a weekday off in its place. This is Duly's reading, not the rule's exact words."
    plain_terms: ["legal public holidays", "Juneteenth National Independence Day"]
  - id: stem.requires_post_completion_opt
    value: true
    unit: flag
    status: settled
