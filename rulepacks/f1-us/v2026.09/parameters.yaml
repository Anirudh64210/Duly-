    note: "Reading: the quote is the second part of a sentence, and the first part is needed to say what it states. The whole sentence begins A student may not be authorized for employment with an employer pursuant to paragraph (f)(10)(ii)(C)(2) of this section, and then the quoted words follow. The quote starts at unless because the saved copy prints the paragraph number 2 in italics and the source check cannot match a quote across it. The sentence is the first one of paragraph (f)(10)(ii)(C)(9)(i), under the heading Evaluation requirements and Training Plan modifications. The same paragraph is the source of stem.evaluation_interval_months and stem.evaluation_due_days. Paragraph (9)(ii), on a material change to the training plan, and paragraph (9)(iii), on what the educational institution is responsible for, are not recorded as rows. Start date from 81 FR 13040 (FR Doc. 2016-04828), effective 2016-05-10, saved as sources/fr-2016-04828.xml, which carries the same words. Words checked in the 2026-09-14 text on 2026-09-29; the 2026-09-15 text has the same words, so the rule sits under no regime. The flag records what the regulation lists. It says nothing about any one person. The paragraph is under (f)(10)(ii)(C), headed 24-month extension of post-completion OPT for a science, technology, engineering, or mathematics (STEM) degree."
    plain: "A student may be authorized to work for an employer on a 24-month OPT extension only if the student hands in a self-evaluation. It shows progress toward the training goals in Form I-983. This is Duly's reading, not the rule's exact words."
    plain_terms: ["self-evaluation", "training goals"]
