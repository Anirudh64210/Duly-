    effective_from: 2026-09-15
    source: {citation: '8 CFR 214.2(f)(5)(v), text of 2026-09-15, as amended by 91 FR 44976', url: 'https://www.ecfr.gov/api/versioner/v1/full/2026-09-15/title-8.xml?part=214&section=214.2', checked_on: 2026-10-02, quote: An F-1 student authorized by the designated school official to withdraw from classes will be allowed a 15-day period from the date of the withdrawal to depart the United States., snapshot: sources/ecfr-8cfr214.2-2026-09-15.xml, snapshot_sha256: d65cc78343f2f41484b708487c4ada6669f10166857e7d884bbf64066caad947}
    derivation: verbatim
