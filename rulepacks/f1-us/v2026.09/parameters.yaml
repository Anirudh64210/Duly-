    derivation: verbatim
    note: "The quoted words are the first part of the first sentence of paragraph (f)(10)(ii)(C)(7)(i), under the heading Training Plan for STEM OPT Students, Form I-983 or successor form. The sentence goes on: under paragraph (f)(10)(ii)(C)(2) of this section in SEVIS. The quote stops before those words because the saved copy prints the paragraph number 2 in italics and the source check cannot match a quote across it. The same paragraph says the student must submit the form to the student's DSO prior to the new DSO recommendation. Paragraphs (7)(ii) and (7)(iii) say what the training plan must identify, describe and explain; they are not recorded as rows. Paragraph (7)(iv) is the source of stem.new_plan_due_days. Form I-983 and its instructions are not saved with this pack and were not read. Start date from 81 FR 13040 (FR Doc. 2016-04828), effective 2016-05-10, saved as sources/fr-2016-04828.xml, which carries the same words. Words checked in the 2026-09-14 text on 2026-09-29; the 2026-09-15 text has the same words, so the rule sits under no regime. The flag records what the regulation lists. It says nothing about any one person."
    plain: "Before the DSO may recommend a 24-month OPT extension, the student must fully complete an individualized Form I-983. The student must also get it signed by the right person at the employer. Both steps follow the form's instructions."
    plain_terms: ["individualized", "24-month OPT extension"]
  - id: stem.requires.duties_hours_and_compensation
    value: true
    unit: flag
    status: settled
    effective_from: 2016-05-10
    source:
      citation: "8 CFR 214.2(f)(10)(ii)(C)(8)"
      url: "https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2"
      checked_on: 2026-09-29
      quote: "The terms and conditions of a STEM practical training opportunity during the period of the 24-month OPT extension, including duties, hours, and compensation, must be commensurate with terms and conditions applicable to the employer's similarly situated U.S. workers in the area of employment."
      snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml
      snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690
    derivation: verbatim
    note: "The quoted sentence is the first one of paragraph (f)(10)(ii)(C)(8), headed Duties, hours, and compensation for training. The second sentence of the paragraph is the source of stem.min_hours_per_week. The paragraph goes on to say what similarly situated U.S. workers includes and when duties, hours, and compensation are commensurate, and that the student must disclose his or her compensation on the Form I-983 or successor form; those sentences are not recorded as rows. The words speak of the period of the 24-month OPT extension. Start date from 81 FR 13040 (FR Doc. 2016-04828), effective 2016-05-10, saved as sources/fr-2016-04828.xml, which carries the same words. Words checked in the 2026-09-14 text on 2026-09-29; the 2026-09-15 text has the same words, so the rule sits under no regime. The flag records what the regulation lists. It says nothing about any one person."
    plain: "During the 24-month OPT extension, the training has terms and conditions. These include duties, hours and compensation. They must be commensurate with those of the employer's similarly situated U.S. workers in the area of employment."
    plain_terms: ["similarly situated U.S. workers", "commensurate", "compensation"]
  - id: stem.requires.self_evaluation
