    unit: days
    status: litigated
    regime: fixed_admission_2026
    effective_from: 2026-09-15
    source:
      citation: "8 CFR 214.2(f)(5)(v), text of 2026-09-15, as amended by 91 FR 44976"
      url: "https://www.ecfr.gov/api/versioner/v1/full/2026-09-15/title-8.xml?part=214&section=214.2"
      checked_on: 2026-09-29
      quote: "An F-1 student who has completed a course of study and any authorized practical training will be allowed an additional 30-day period from the program end date or the 4 year maximum period of admission, or the end date of the approved employment authorization for post-completion OPT or STEM OPT, as applicable, to prepare for departure from the United States, or to otherwise seek to maintain lawful status"
      snapshot: sources/ecfr-8cfr214.2-2026-09-15.xml
      snapshot_sha256: d65cc78343f2f41484b708487c4ada6669f10166857e7d884bbf64066caad947
    derivation: verbatim
    note: "Not operative. 2026-09-15 is the effective date stated in 91 FR 44976, saved as sources/fr-2026-14439.xml. A court postponed that date on 2026-09-14; see the regime. The SPEC pointed to (f)(5); the paragraph in the 2026-09-15 text is (f)(5)(v). On 2026-09-29 the quote was widened to the words or to otherwise seek to maintain lawful status. The sentence goes on to name, as part of that, timely filing an extension of stay application or a change of status application; those words are not in the quote. The period counts from one of three dates: the program end date, the 4 year maximum period of admission, or the end date of the approved employment authorization for post-completion OPT or STEM OPT, as applicable."
