      snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690
    derivation: reading
    note: "Reading. The regulation does not say in so many words when a practical training opportunity concludes. The quoted sentence ties an opportunity to one employer, so Duly reads the opportunity under a STEM card as ending on the last day of the job with that employer, or on the day the employment authorization ends if that is sooner. The authorization ends at the card end, at the transfer release date (opt.ends_on_release_date), or the day before a program at another level starts (opt.ends_on_transfer_or_new_level). A job that ends after the authorization ends does not count; resolutions point 19 took out the cap-gap reading that let it, and while a petition with change_of_status yes is on the record a final evaluation due on or after the day the petition was filed is null (capgap.petition_for_dso). For the concluding evaluation of the stage, the path uses the last job's end only when every job under the card has an end and no job under the card ends after it; while one runs on, the card end is used. Each other job under the card that ends on or before the authorization ends, while another job under the card runs on or ends later, gets its own final evaluation dated from its own end (stem_job_end.evaluation_final, resolutions point 16, J15 Job B). The path dates no validation report from a job's end (stem.validation_ends_with_extension). Paragraph (f)(10)(ii)(C)(9)(i) dates the final evaluation from the conclusion of the practical training opportunity (stem.evaluation_due_days). Start date from 81 FR 13040 (FR Doc. 2016-04828), effective 2016-05-10, saved as sources/fr-2016-04828.xml, which carries the same sentence. Words checked in the 2026-09-14 text on 2026-09-30; the 2026-09-15 text has the same sentence. The same quote is the source of stem.new_plan_due_days."
    plain: "Duly reads each STEM practical training opportunity as a job with one employer. It ends on the last day of that job, or sooner if the permission to work ends first. This is Duly's reading, not the words of the rule."
    plain_terms: ["practical training opportunity"]
  - id: cpt.full_time_bar_days
    value: 365
    unit: days
    status: settled
    effective_from: 2003-01-01
    source:
      citation: "8 CFR 214.2(f)(10)(i)"
      url: "https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2"
      checked_on: 2026-10-02
      quote: "Students who have received one year or more of full time curricular practical training are ineligible for post-completion academic training."
      snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml
      snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690
    derivation: reading
    note: "Reading: the regulation says one year or more and states no number of days; 365 is Duly's count of one year in days. The number 365 appears nowhere in the source. The count is Duly's own and is not the words of the law: one year counted in days can come to a different number, for example across a leap year, and the regulation does not say how the year is counted. The status is settled because the quoted sentence is regulation in force and has the same words in the 2026-09-14 and 2026-09-15 texts; settled describes the sentence, not the count. The row was tagged school until 2026-09-29; it cites the regulation and no school's page, and no school document is saved with this pack, so it is not school policy. The sentence ends ineligible for post-completion academic training; it does not use the words optional practical training. Start date as for cpt.full_time_months_bar. Words checked again in the 2026-09-14 text on 2026-09-29. Duly reads post-completion academic training as OPT after the program end date; that is a reading, not the words of the sentence, and the plain words say so (SPEC-resolutions point 54)."
    plain: "The rule says a student who has received one year or more of full-time curricular practical training (CPT) cannot have post-completion academic training. Duly reads that term as OPT after the program end date, and one year as 365 days. This is Duly's reading, not the rule's exact words."
    plain_terms: ["curricular practical training", "post-completion academic training"]
  - id: capgap.fiscal_year_start_month_day
