              - {fact: this.card_start}
              - {first: {of: {record: authorization, where: [{field: this.id, same_as: outer.id}, {none: {record: petition, where: [{field: this.change_of_status, in: ["yes"]}, *petition_may_extend_card, {field: this.filed_on, on_or_before: {fact: outer.card_end, add: [{rule: stem.evaluation_due_days}]}}]}}]}, field: card_start, pick: earliest}}
              - earliest_of: &stem_training_end
