      url: "https://www.federalregister.gov/documents/full_text/xml/2008/04/08/E8-7427.xml"
      checked_on: 2026-09-29
      quote: "The duration of status, and any employment authorization granted under 8 CFR 274a.12(c)(3)(i)(B) and (C), of an F-1 student who is the beneficiary of an H-1B petition and request for change of status shall be automatically extended until October 1 of the fiscal year for which such H-1B visa is being requested where such petition:"
      snapshot: sources/fr-e8-7427.xml
      snapshot_sha256: dbfc074987138fe7e80be4f0a47c6810fb03a4bb1a49ffa7e8a53a8ba35698ea
    derivation: verbatim
    note: "Closed row. Not in the SPEC table; added so the change to April 1 closes the old value. Start date from 73 FR 18944 (FR Doc. E8-7427), effective 2008-04-08. 81 FR 13040, saved as sources/fr-2016-04828.xml, also carries October 1. On 2026-09-29 the quote was widened to the start of paragraph (A), so that what is extended, and for whom, is in the quote. The conditions (1) and (2) follow the colon; (2) is recorded as capgap.october_start_condition. The later change to April 1 is the row that starts 2025-01-17. From 2016-05-10 the words of 81 FR 13040 name an H-1B petition subject to section 214(g)(1)(A) of the Act (8 U.S.C. 1184(g)(1)(A)) and H-1B status in place of H-1B visa. The preamble of 89 FR 103054 calls the extension the cap-gap extension and speaks of a cap-subject H-1B petition; the preamble of 81 FR 13040 calls a petition not subject to the annual numerical cap on H-1B visas cap-exempt. Duly reads subject to section 214(g)(1)(A) of the Act as under the yearly H-1B cap; that is a reading of those preambles, not the words of the regulation, and the plain words say so. 8 CFR 274a.12(c)(3)(i)(B) and (C), named in the quote, are not saved and were not read; the plain words say only the employment authorization the rule names."
