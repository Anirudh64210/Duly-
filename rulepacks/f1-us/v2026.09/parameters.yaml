  - id: opt.post_completion_definition
    value: true
    unit: flag
    status: guidance
    effective_from: 2025-05-19
    source:
      citation: "SEVP, Study in the States, SEVIS Help Hub, F-1 Optional Practical Training (OPT), last updated 2025-05-19"
      url: "https://studyinthestates.dhs.gov/sevis-help-hub/student-records/fm-student-employment/f-1-optional-practical-training-opt"
      checked_on: 2026-09-29
      quote: "Post-Completion OPT: Any portion of OPT used after the student's Program End Date."
      snapshot: sources/sits-f1-opt-2026-09-28.html
      snapshot_sha256: 176dbcd7914ca569219a9033f1e27135002f9b3afeb34a23bb60424132ca9288
    derivation: verbatim
    note: "Agency guidance, not regulation. The quote is SEVP's definition in the table of OPT types on the saved page; the next sentence says it must be at least 20 hours per week or full-time, and the row before it defines pre-completion OPT as any portion of OPT used before the student's Program End Date. Start date is the last updated date printed on the saved page, the earliest date the saved copy supports; the guidance may be older. Taking the end of the OPT card as the test of whether any post-completion OPT exists is Duly's reading (SPEC-resolutions point 27), not these words. The flag records what the guidance says. It says nothing about any one person."
    plain: "SEVP's guidance says post-completion OPT is any portion of OPT used after the program end date. This is agency guidance, not a regulation."
    plain_terms: ["post-completion OPT", "program end date"]
  - id: opt.unemployment_limit_days
    value: 90
    unit: days
    status: settled
    effective_from: 2008-04-08
    source:
      citation: "8 CFR 214.2(f)(10)(ii)(E)"
      url: "https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2"
      checked_on: 2026-09-28
      quote: "Students may not accrue an aggregate of more than 90 days of unemployment during any post-completion OPT period described in 8 CFR 274a.12(c)(3)(i)(B)."
      snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml
      snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690
    derivation: verbatim
    note: "Start date from 73 FR 18944 (FR Doc. E8-7427), effective 2008-04-08, saved as sources/fr-e8-7427.xml. Words checked in the 2026-09-14 text. The next sentence of the paragraph gives students granted a 24-month OPT extension a limit counted over a total OPT period, recorded as stem.unemployment_limit_days. The plain words say accrue an aggregate of as have, added together."
    plain: "During a post-completion OPT period, a student may not have more than 90 days of unemployment in all. A student granted a 24-month OPT extension has a separate limit."
    plain_terms: ["post-completion OPT period", "unemployment"]
  - id: stem.unemployment_limit_days
    value: 150
    unit: days
    status: settled
    effective_from: 2016-05-10
    source:
      citation: "8 CFR 214.2(f)(10)(ii)(E)"
      url: "https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2"
      checked_on: 2026-09-28
      quote: "may not accrue an aggregate of more than 150 days of unemployment during a total OPT period, including any post-completion OPT period described in 8 CFR 274a.12(c)(3)(i)(B) and any subsequent 24-month extension period"
      snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml
      snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690
    derivation: verbatim
    note: "Start date from 81 FR 13040 (FR Doc. 2016-04828), effective 2016-05-10, saved as sources/fr-2016-04828.xml. Words checked in the 2026-09-14 text. The limit for the earlier 17-month extension was a different number and is not recorded in this pack. The subject of the sentence in the saved text is Students granted a 24-month OPT extension under paragraph (f)(10)(ii)(C)(2) of this section; the quote starts after those words because the saved copy prints the paragraph number 2 in italics."
    plain: "A student granted a 24-month OPT extension may not have more than 150 days of unemployment in all. The count runs over a total OPT period. That takes in any post-completion OPT period and any later 24-month extension period."
    plain_terms: ["total OPT period", "post-completion OPT period", "24-month extension period"]
  - id: stem.extension_months
    value: 24
    unit: months
    status: settled
    effective_from: 2016-05-10
    source:
      citation: "8 CFR 214.2(f)(10)(ii)(C)"
      url: "https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2"
      checked_on: 2026-09-28
      quote: "An extension will be for 24 months for the first qualifying degree for which the student has completed all course requirements (excluding thesis or equivalent), including any qualifying degree as part of a dual degree program"
      snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml
      snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690
    derivation: verbatim
    note: "Start date from 81 FR 13040 (FR Doc. 2016-04828), effective 2016-05-10, saved as sources/fr-2016-04828.xml. Words checked in the 2026-09-14 text. On 2026-09-29 the quote was widened to the words dual degree program, so that the thesis exclusion is in the quote. The sentence goes on: subject to the requirement in paragraph (f)(10)(ii)(C)(3) of this section that previously obtained degrees must have been conferred; the quote stops before that number because the saved copy prints it in italics. Qualifying is the regulation's word; the plain check refuses it, so the plain words say a degree that meets the STEM terms, the terms of paragraph (f)(10)(ii)(C), headed 24-month extension of post-completion OPT for a science, technology, engineering, or mathematics (STEM) degree."
    plain: "The extension lasts 24 months. It is for the first degree that meets the STEM terms and for which the student has completed all course requirements, apart from a thesis or its equivalent. A degree in a dual degree program can count."
    plain_terms: ["course requirements", "dual degree program"]
  - id: stem.apply_before_expiry_days
    value: 90
    unit: days
    status: settled
    effective_from: 2016-05-10
    source:
      citation: "8 CFR 214.2(f)(11)(i)(C)"
      url: "https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2"
      checked_on: 2026-09-28
      quote: "A student meeting the eligibility requirements for a 24-month OPT extension under paragraph (f)(10)(ii)(C) of this section may request an extension of employment authorization by filing Form I-765 or successor form, with the required fee and supporting documents, up to 90 days prior to the expiration date of the student's current OPT employment authorization."
      snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml
      snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690
    derivation: verbatim
    note: "Start date from 81 FR 13040 (FR Doc. 2016-04828), effective 2016-05-10, saved as sources/fr-2016-04828.xml. Words checked in the 2026-09-14 text. On 2026-09-29 the quote was widened to the whole sentence, so that who may file, and what is filed, is in the quote. Eligibility is the regulation's word; the plain check refuses it, so the plain words say meets the terms."
    plain: "A student who meets the terms for a 24-month OPT extension may ask for it by filing Form I-765 with the fee and papers needed. The filing may come up to 90 days before the student's current OPT employment authorization ends."
    plain_terms: ["employment authorization", "24-month OPT extension"]
  - id: stem.apply_window_closes_rule
    value: true
    unit: flag
    status: settled
    effective_from: 2016-05-10
    source:
      citation: "8 CFR 214.2(f)(10)(ii)(C)"
      url: "https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2"
      checked_on: 2026-09-28
      quote: "a qualified student may apply for an extension of OPT while in a valid period of post-completion OPT authorized under 8 CFR 274a.12(c)(3)(i)(B)"
      snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml
      snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690
    derivation: reading
    note: "Reading: the regulation says a qualified student may apply while in a valid period of post-completion OPT, and Duly reads those words as the closing of the filing window. Start date from 81 FR 13040 (FR Doc. 2016-04828), effective 2016-05-10, saved as sources/fr-2016-04828.xml. Words checked in the 2026-09-14 text; the 2026-09-15 text has the same words, so the rule sits under no regime. The SPEC pointed to (f)(11)(i)(C). That paragraph states only the opening of the window, up to 90 days prior to the expiration date of the current OPT employment authorization, and states no closing. The closing is in the opening text of (f)(10)(ii)(C), quoted here, which begins with the words Consistent with paragraph (f)(11)(i)(C) of this section. The regulation states the closing as a condition, while in a valid period of post-completion OPT, and names no date. The preamble of 81 FR 13040 says a student may file only if the student is in a valid period of post-completion OPT at the time of filing, and that a period extended under cap-gap is a valid period. So the window can close later than the expiration date on the employment authorization document. That the window closes on that expiration date is a reading, not the words of the source. The plain words say qualified student as a student who meets its terms, because the plain check refuses the word qualified."
    plain: "The rule lets a student who meets its terms apply for an extension of OPT while in a valid period of post-completion OPT. Duly reads this as closing the window when the OPT card ends, though a cap-gap period may keep it open longer. This is Duly's reading, not the rule's exact words."
    plain_terms: ["extension of OPT", "valid period of post-completion OPT"]
  - id: stem.file_within_days_of_recommendation
    value: 60
    unit: days
    status: settled
    effective_from: 2016-05-10
    source:
      citation: "8 CFR 214.2(f)(11)(i)(C)"
      url: "https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2"
      checked_on: 2026-09-28
      quote: "The student seeking such 24-month OPT extension must properly file his or her Form I-765 or successor form with USCIS within 60 days of the date the DSO enters the recommendation for the OPT extension into his or her SEVIS record."
      snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml
      snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690
    derivation: verbatim
    note: "Start date from 81 FR 13040 (FR Doc. 2016-04828), effective 2016-05-10, saved as sources/fr-2016-04828.xml. Words checked in the 2026-09-14 text. The plain words say properly file as correctly file."
    plain: "A student seeking the 24-month OPT extension must correctly file Form I-765 with USCIS. It is due within 60 days after the DSO puts the recommendation for it in the student's SEVIS record."
    plain_terms: ["24-month OPT extension", "SEVIS record"]
  - id: stem.min_hours_per_week
    value: 20
    unit: hours_per_week
    status: settled
    effective_from: 2016-05-10
    source:
      citation: "8 CFR 214.2(f)(10)(ii)(C)(8)"
      url: "https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2"
      checked_on: 2026-09-28
      quote: "A student may not engage in practical training for less than 20 hours per week, excluding time off taken consistent with leave-related policies applicable to the employer's similarly situated U.S. workers in the area of employment."
      snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml
      snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690
    derivation: verbatim
    note: "Start date from 81 FR 13040 (FR Doc. 2016-04828), effective 2016-05-10, saved as sources/fr-2016-04828.xml. Words checked in the 2026-09-14 text. The sentence is the second one of paragraph (f)(10)(ii)(C)(8), under (f)(10)(ii)(C), headed 24-month extension of post-completion OPT for a science, technology, engineering, or mathematics (STEM) degree; that heading is why the plain words name the extension. The time off left out is only time off taken consistent with leave-related policies applicable to the employer's similarly situated U.S. workers in the area of employment."
    plain: "On a 24-month extension, practical training may not be less than 20 hours a week. Some time off is not counted. It is time off that follows the leave policies for the employer's similarly situated U.S. workers in the area of employment."
    plain_terms: ["similarly situated U.S. workers", "area of employment"]
  - id: stem.validation_interval_months
    value: 6
    unit: months
    status: settled
    effective_from: 2016-05-10
    source:
      citation: "8 CFR 214.2(f)(12)(ii)(B)"
      url: "https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2"
      checked_on: 2026-09-28
      quote: "The student must complete a validation report, confirming that the information required by paragraph (f)(12)(ii)(A) of this section has not changed, every six months."
      snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml
      snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690
    derivation: verbatim
    note: "Start date from 81 FR 13040 (FR Doc. 2016-04828), effective 2016-05-10, saved as sources/fr-2016-04828.xml. Words checked in the 2026-09-14 text. The source writes the number as the word six. The same paragraph says the requirement starts on the date the 24-month OPT extension begins. The sentence is (f)(12)(ii)(B), under (f)(12)(ii), headed Additional reporting obligations for students with an approved 24-month OPT extension; that heading is why the plain words name the extension. The source does not call the report short. Paragraph (f)(12)(ii)(A), named in the quote, requires a report of a change of legal name, residential or mailing address, employer name, employer address, and/or loss of employment; that is the information the validation report confirms has not changed (quoted in stem.report_change_within_days)."
    plain: "A student with an approved 24-month OPT extension must complete a validation report every six months. It confirms that the facts the student must report have not changed. These are legal name, home or mailing address, employer name and address, and loss of employment."
    plain_terms: ["validation report"]
  - id: stem.validation_due_business_days
