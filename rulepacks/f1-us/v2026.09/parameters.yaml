    plain_terms: ["E-Verify", "good standing", "employer identification number"]
  - id: stem.requires.employer_reporting
    value: true
    unit: flag
    status: settled
    effective_from: 2016-05-10
    source:
      citation: "8 CFR 214.2(f)(10)(ii)(C)(6)"
      url: "https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2"
      checked_on: 2026-09-29
      quote: "unless the employer agrees, by signing the Training Plan for STEM OPT Students, Form I-983 or successor form, to report the termination or departure of an OPT student to the DSO at the student's school, if the termination or departure is prior to the end of the authorized period of OPT."
      snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml
      snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690
    derivation: reading
    note: "Reading: the quote is the second part of a sentence, and the first part is needed to say what it states. The whole sentence begins A student may not be authorized for employment with an employer pursuant to paragraph (f)(10)(ii)(C)(2) of this section, and then the quoted words follow. The quote starts at unless because the saved copy prints the paragraph number 2 in italics and the source check cannot match a quote across it. The sentence is the first one of paragraph (f)(10)(ii)(C)(6), headed Employer reporting. The paragraph goes on to say such reporting must be made within five business days of the termination or departure, and when an employer shall consider a student to have departed; the number five is not recorded as a value in this pack. Start date from 81 FR 13040 (FR Doc. 2016-04828), effective 2016-05-10, saved as sources/fr-2016-04828.xml, which carries the same words. Words checked in the 2026-09-14 text on 2026-09-29; the 2026-09-15 text has the same words, so the rule sits under no regime. The flag records what the regulation lists. It says nothing about any one person. The paragraph is under (f)(10)(ii)(C), headed 24-month extension of post-completion OPT for a science, technology, engineering, or mathematics (STEM) degree. The plain words say the termination or departure as the student leaves or the job is ended, the words reviews/product-1-fix6.md finding 1 asks for; the plain check refuses the word termination. The condition if the termination or departure is prior to the end of the authorized period of OPT stays a condition on when the student leaves or the job ends."
    plain: "A student may be authorized to work for an employer on a 24-month OPT extension only if the employer agrees to tell the DSO if the student leaves or the job is ended before the authorized period of OPT ends. The employer agrees by signing Form I-983. This is Duly's reading, not the rule's exact words."
    plain_terms: ["authorized period of OPT"]
