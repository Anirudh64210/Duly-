  - id: capgap.status_ends_on_h1b_start
    value: true
    unit: flag
    status: guidance
    effective_from: 2016-05-10
    source:
      citation: "81 FR 13040 (preamble), FR Doc. 2016-04828"
      url: "https://www.federalregister.gov/documents/full_text/xml/2016/03/11/2016-04828.xml"
      checked_on: 2026-10-02
      quote: "If an H-1B change-of-status petition requesting a start date of October 1 has been approved, the F-1 status will expire on the same day as the H-1B status begins."
      snapshot: sources/fr-2016-04828.xml
      snapshot_sha256: 5e4bc844cac1e67b34626115a7ec94c9928f5ef3cb82219f436a4d85d68a5794
    derivation: reading
    note: "Reading. The quote is from the preamble of 81 FR 13040, effective 2016-05-10, not from the regulation. It speaks of the October 1 start of the 2016 rule. 89 FR 103054 (FR Doc. 2024-29354), saved as sources/fr-2024-29354.xml, extends the cap-gap until April 1 of the fiscal year or until the validity start date of the approved petition, whichever is earlier (8 CFR 214.2(f)(5)(vi)(A), capgap.end_month_day). Duly reads the preamble as saying the same of any approved start date on or before that April 1: F-1 status ends that day and H-1B status begins, so no grace.after_completion_days period follows it (resolutions point 15, J12), and no validation report is dated on or after that day (stem.validation_ends_with_extension, resolutions point 16). Resolutions point 19: until the cap-gap round, the path does not apply this reading. It computes no cap_gap stage and no petition grace, and ends no validation, grace or unemployment span on a petition; while a petition with change_of_status yes is on the record, the items a petition could change are null and the judgement cap_gap.for_dso goes to the DSO (capgap.petition_for_dso). The row stays for the older compute and for that round. The 60-day period of 8 CFR 214.2(f)(5)(iv) is for a student who has completed a course of study and any practical training, to prepare to leave or to transfer. The preamble sentence before the quote says a student with a timely-filed, non-frivolous change-of-status petition is in a period of authorized stay while it is pending, and is not authorized to work."
    plain: "Agency words from 2016 say that once an H-1B change-of-status petition is approved, F-1 status ends the day H-1B status begins. As Duly reads it, no 60-day period follows the H-1B start. This is guidance, not a regulation."
    plain_terms: [change-of-status petition, H-1B status]
  - id: capgap.petition_for_dso
    value: true
    unit: flag
    status: settled
    effective_from: 2025-01-17
    source:
      citation: "8 CFR 214.2(f)(5)(vi)(A)"
      url: "https://www.ecfr.gov/api/versioner/v1/full/2026-09-14/title-8.xml?part=214&section=214.2"
      checked_on: 2026-10-02
      quote: "of an F-1 student who is the beneficiary of an H-1B petition subject to section 214(g)(1)(A) of the Act (8 U.S.C. 1184(g)(1)(A)) requesting a change of status will be automatically extended until April 1 of the fiscal year for which such H-1B status is being requested or until the validity start date of the approved petition, whichever is earlier"
      snapshot: sources/ecfr-8cfr214.2-2026-09-14.xml
      snapshot_sha256: 920ad4ad54d7255bd313257ea29d1d16f235fae22ef4e5e5ff3c3a89aa3cb690
    derivation: reading
    note: "Reading, resolutions point 19. The quote is from the sentence of (f)(5)(vi)(A) that begins The duration of status, and any employment authorization granted under 8 CFR 274a.12(c)(3)(i)(B) or (C), the sentence recorded as capgap.end_month_day; it ends before where such petition and the conditions that follow. (f)(5)(vi)(B), recorded as capgap.ends_on_outcome, ends the extension on the rejection, denial, revocation or withdrawal of the petition, or the denial or withdrawal of the change of status. So a change-of-status petition can move the end of F-1 status and of the employment authorization the rule names, and so the dates that follow from them. Until the cap-gap round, the path computes none of this: while a petition with change_of_status yes is on the record, the judgement check cap_gap.for_dso goes to the DSO, and the path leaves null the grace of a program when the petition was filed on or before that program's end plus grace.after_completion_days, or on or before the end of its post-completion OPT or STEM card plus those days; each validation report and evaluation whose due day is on or after the day the petition was filed (for the concluding evaluation of the stage, due by the card end plus stem.evaluation_due_days, a conservative bound); and each unemployment count over a card that ends on or after the day the petition was filed less grace.after_completion_days. No petition opens a stage, raises a conflict, or moves a date. A missing filing day or change_of_status answer is asked, and the items wait null. Resolutions points 23 and 23a: the quote extends status until a date that is the petition's start at the latest, so Duly reads a petition as able to extend a period only when its start falls on or after the day the period begins: for a card's dates (reports, evaluations, unemployment counts, the card's grace), the card start; for the grace of a program, the day after the program ends; for the check that a STEM card was filed while the card it extends was in force, the start of that earlier card. A petition whose start falls before that day takes nothing from the period, and cap_gap.for_dso is given only when some period of the record could be extended and the petition was filed on or before its end plus grace.after_completion_days. The start used is validity_start when the outcome is approved and it is entered, else requested_start, else validity_start; only when neither is entered is a start asked (validity_start when approved, else requested_start), and the items wait null until it is answered. The outcome is not asked for this (resolutions points 21 and 26). Start date from 89 FR 103054 (FR Doc. 2024-29354), effective 2025-01-17, saved as sources/fr-2024-29354.xml. Words checked in the 2026-09-14 text and in the 2026-09-15 text on 2026-09-30; both carry the quote, so the rule sits under no regime. The 2026-09-15 text numbers it (f)(5)(vii)(A). The older words of 73 FR 18944 and 81 FR 13040 extend status to October 1 (capgap.end_month_day, closed rows); a petition under them is treated the same way. The flag records what the regulation says. It says nothing about any one person."
    plain: "A petition for a change of status, such as one for H-1B, can make F-1 status and the employment authorization the rule names last longer or end sooner. It can change the grace period, counts of days without work, STEM reports and evaluations, and any cap-gap period. Duly leaves those dates out for the DSO."
    plain_terms: [change of status]
